
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def geckoVersion = '159.0.20261102144711'
def buildNum = (project.findProperty('buildNum') ?: '1').toString().toInteger()

def appVersionName = "2.0.${buildNum}"

def appVersionCode = 2000 + buildNum

android {
    // MainActivity.kt declares package com.tvbrowser.gecko; keep the namespace aligned with it.
    namespace 'com.tvbrowser.gecko'
    compileSdk 36

    defaultConfig {
        applicationId 'com.battv.browser.v2'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // Each APK contains one GeckoView native engine, avoiding a double-sized universal APK.
    flavorDimensions 'abi'
    productFlavors {
        arm32 {
            dimension 'abi'
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension 'abi'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'DebugProbesKt.bin'
            ]
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'

    // GeckoView publishes separate native AARs for each Android ABI.
    arm32Implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:${geckoVersion}"
    arm64Implementation "org.mozilla.geckoview:geckoview-arm64-v8a:${geckoVersion}"
}
