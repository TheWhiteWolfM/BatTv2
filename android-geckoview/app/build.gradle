plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.battv.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.battv.browser"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "3.0"

        // Arquitectura nativa de Android TV (Chromecast / ONN / Google TV) y compatible con móviles ARM:
        // Elimina ~140 MB de binarios duplicados arm64 que no usa el sistema de 32 bits del televisor.
        ndk {
            abiFilters "armeabi-v7a"
        }
        resConfigs "es"
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            // Permite que Android cargue libxul.so directamente desde el APK (mmap)
            // sin descomprimir una segunda copia de 140 MB en el almacenamiento interno del TV.
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.kotlin_module',
                '/META-INF/*.version',
                '/META-INF/CHANGES',
                '/META-INF/README.md',
                '/kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mozilla.geckoview:geckoview:130.0.20240913135723'
}
