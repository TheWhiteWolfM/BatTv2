plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.battv.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.battv.browser"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "2.0"

        ndk {
            // Incluye soporte para Android TV de 32 bits (armeabi-v7a) y 64 bits (arm64-v8a)
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma el APK de release con la llave debug para que instale directo en el TV
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mozilla.geckoview:geckoview:130.0.20240913135723'
}
