plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // namespace identifica el paquete de recursos y la Activity principal.
    namespace 'com.tvbrowser.gecko'
    compileSdk 36

    defaultConfig {
        // Identificador propio de la nueva aplicación Battv.2.
        applicationId 'com.battv.browser.v2'
        minSdk 26
        targetSdk 34
        versionCode 2000
        versionName '2.0.0'

        // Se conservan ambas arquitecturas para los dispositivos Android TV objetivo.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma de prueba para permitir instalar el APK generado por Actions.
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Se mantiene la versión ya utilizada por el proyecto mientras estabilizamos CI.
    implementation 'org.mozilla.geckoview:geckoview:130.0.20240913135723'
}
