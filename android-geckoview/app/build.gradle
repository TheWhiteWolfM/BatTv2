plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.battv.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.battv.browser"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "3.0"

        // Empaqueta únicamente la arquitectura nativa de Android TV (ahorra ~140 MB en el APK)
        ndk {
            abiFilters "armeabi-v7a"
        }
        resConfigs "es"
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildTypes {
        release {
            // Desactivado para evitar el fallo de R8 con SnakeYAML (java.beans.*) dentro de GeckoView
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            // Evita descomprimir una copia duplicada de libxul.so en el almacenamiento interno del TV
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.kotlin_module',
                '/META-INF/*.version',
                '/META-INF/CHANGES',
                '/META-INF/README.md',
                '/kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mozilla.geckoview:geckoview:130.0.20240913135723'
}
