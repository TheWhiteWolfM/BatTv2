name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 (Evita error de SnakeYAML en GeckoView)
        run: |
          cat << 'EOF' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF

      - name: Compilar Listas Oficiales uBlock/AdGuard/EasyList y Motor Nativo v10.0 (battv_shield)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import shutil
          import urllib.request

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)

          SHIELD_DIR = os.path.join(EXT_BASE, "battv_shield")
          os.makedirs(SHIELD_DIR, exist_ok=True)

          # 1. Descargar y compilar en tiempo de build las listas reales de uBlock Origin,
          #    EasyList Spanish, AdGuard Popups/Spanish y Peter Lowe (0 MB de IndexedDB en la TV)
          FILTER_URLS = [
              "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext",
              "https://easylist-downloads.adblockplus.org/easylistspanish.txt",
              "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt",
              "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/badware.txt",
              "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/annoyances-others.txt",
              "https://filters.adtidy.org/extension/ublock/filters/2_without_easylist.txt",
              "https://filters.adtidy.org/extension/ublock/filters/17.txt"
          ]

          # Dominios base que siempre deben estar bloqueados
          compiled_domains = {
              "vidoomy.com", "viwom.com", "wortise.com", "aniview.com", "primis.tech",
              "adinplay.com", "brid.tv", "doubleclick.net", "googlesyndication.com",
              "googleadservices.com", "google-analytics.com", "googletagmanager.com",
              "googletagservices.com", "popads.net", "popcash.net", "propellerads.com",
              "exoclick.com", "magsrv.com", "realsrv.com", "juicyads.com", "adsterra.com",
              "monetag.com", "acscdn.com", "onclickads.net", "hilltopads.net",
              "galaksion.com", "clickadu.com", "adcash.com", "richads.com",
              "admaven.com", "bidgear.com", "trafficjunky.net", "trafficstars.com",
              "tsyndicate.com", "rollerads.com", "evadav.com", "optad360.io",
              "teads.tv", "taboola.com", "outbrain.com", "mgid.com", "revcontent.com",
              "criteo.com", "pubmatic.com", "rubiconproject.com", "openx.net",
              "smartadserver.com", "1xbet.com", "1xstavka.ru", "bet365.com", "mostbet.com",
              "caliente.mx", "codere.mx", "betano.com", "bwin.com", "pin-up.bet",
              "pin-up.casino", "20bet.com", "22bet.com", "melbet.com", "parimatch.com",
              "stake.com", "leon.bet", "1win.pro", "1win.com", "apuestasroyal.com",
              "pushground.com", "yllix.com", "plugrush.com", "adspyglass.com",
              "clksite.com", "clkmon.com", "betteradsystem.com", "blurtsbrerd.com",
              "capsidsflyleaf.com", "skypipevatican.com", "21wiz.com", "aarems.org",
              "twinrdsyn.com", "adsco.re", "a-ads.com", "adskeeper.com", "adskeeper.co.uk",
              "wpadmngr.com", "onmarshtompor.com", "alwingulla.com", "profitablecpmrate.com",
              "highperformanceformat.com", "surfe.pro", "histats.com", "yandex.ru",
              "mc.yandex.ru", "clarity.ms", "bebi.com", "adsbyvli.com", "vlitag.com",
              "adtng.com", "ero-advertising.com", "adform.net", "quantserve.com",
              "scorecardresearch.com", "dtscout.com", "acint.net", "adkernel.com",
              "aliexpress.com", "aliexpress.us", "aliexpress.ru", "alibaba.com",
              "mmstat.com", "aliapp.org", "temu.com", "shein.com", "shopee.com", "lazada.com"
          }

          # Palabras clave protegidas: JAMÁS bloquear dominios de tus páginas, reproductores de vídeo o CDNs técnicos
          PROTECTED_KEYWORDS = (
              "jkanime", "jkdesu", "doramasflix", "dramachino", "tudorama",
              "asialiveaction", "kisskh", "chaturbate", "mmcdn", "highwebmedia",
              "google.", "gstatic", "googleapis", "youtube", "ytimg", "cloudflare",
              "jsdelivr", "unpkg", "jquery", "bootstrap", "fontawesome", "jwplayer",
              "jwpcdn", "jwpsrv", "plyr", "videojs", "zencdn", "vimeocdn", "vimeo",
              "dailymotion", "dmcdn", "voe.", "streamtape", "dood", "d000d", "ds2play",
              "filemoon", "streamwish", "wishembed", "vidhide", "mp4upload", "ok.ru",
              "mycdn", "mixdrop", "yourupload", "primeload", "embedshortener",
              "fembed", "uqload", "upstream", "vudeo", "netu", "waaw", "hqq",
              "mega.nz", "mediafire", "akamaized", "akamaihd", "cloudfront", "fastly",
              "fbcdn", "twimg", "imgur", "tmdb", "themoviedb", "github", "gitlab",
              "wp.com", "wordpress", "disqus", "recaptcha", "sweet", "sweetalert"
          )

          def is_safe_to_block(domain):
              if not domain or len(domain) < 4 or "." not in domain:
                  return False
              for kw in PROTECTED_KEYWORDS:
                  if kw in domain:
                      return False
              return True

          adblock_domain_re = re.compile(
              r"^\|\|([a-z0-9.-]+\.[a-z]{2,})\^(\$(third-party|popup|all|doc|document|script|subdocument)(,(third-party|popup|all|doc|document|script|subdocument))*)?$"
          )
          plain_domain_re = re.compile(r"^[a-z0-9.-]+\.[a-z]{2,}$")

          for url in FILTER_URLS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode("utf-8", errors="ignore")
                      for raw_line in text.splitlines():
                          line = raw_line.strip().lower()
                          if not line or line.startswith("!") or line.startswith("#") or line.startswith("@@"):
                              continue
                          m = adblock_domain_re.match(line)
                          if m:
                              d = m.group(1).lstrip(".")
                              if is_safe_to_block(d):
                                  compiled_domains.add(d)
                          elif plain_domain_re.match(line):
                              if is_safe_to_block(line):
                                  compiled_domains.add(line)
              except Exception as e:
                  print("Aviso descargando lista:", url, e)

          print(f"Total de dominios publicitarios compilados en O(1) Set: {len(compiled_domains)}")

          manifest = {
              "manifest_version": 2,
              "name": "Bat TV Native Shield & Cinema 60FPS Engine",
              "version": "10.0.0",
              "description": "Motor nativo con listas uBlock/AdGuard/EasyList compiladas en O(1), cortafuegos anti-robot y soporte completo JKAnime.",
              "browser_specific_settings": {
                  "gecko": {
                      "id": "shield@battv.browser",
                      "strict_min_version": "115.0"
                  }
              },
              "permissions": [
                  "<all_urls>",
                  "webRequest",
                  "webRequestBlocking",
                  "storage",
                  "tabs",
                  "nativeMessaging",
                  "nativeMessagingFromContent",
                  "geckoViewAddons"
              ],
              "background": {
                  "scripts": ["background.js"]
              },
              "content_scripts": [
                  {
                      "matches": ["<all_urls>"],
                      "js": ["content_start.js"],
                      "run_at": "document_start",
                      "all_frames": True,
                      "match_about_blank": True
                  }
              ]
          }

          with open(os.path.join(SHIELD_DIR, "manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2, ensure_ascii=False)

          domains_json_array = json.dumps(sorted(list(compiled_domains)))

          background_js_template = r'''(function () {
            "use strict";

            // 1. Tabla Hash O(1) con todos los dominios de uBlock Origin, EasyList Spanish, AdGuard y Peter Lowe
            const COMPILED_AD_DOMAINS = new Set(__DOMAINS_JSON__);

            // 2. Sitios donde el documento raíz (frameId === 0) bloquea cualquier script de dominios aleatorios nuevos.
            //    NOTA CRÍTICA: jkanime.net NO se incluye en este bloqueo ciego de scripts para que su reproductor
            //    (Desu/Nozomi/etc.) siempre cargue al 100%, mientras que Doramasflix y DramaChino quedan blindados
            //    contra el script rotativo que inyecta "CONFIRMA QUE NO ERES UN ROBOT".
            const STRICT_ROOT_SCRIPT_SITES = [
              "doramasflix.io", "doramasflix.co", "dramachino.com",
              "tudorama.com", "asialiveaction.com", "kisskh.do", "kisskh.co"
            ];

            const ALLOWED_TECH_CDNS = [
              "doramasflix.io", "doramasflix.co", "dramachino.com",
              "tudorama.com", "asialiveaction.com", "kisskh.do", "kisskh.co",
              "cloudflare.com", "cdnjs.cloudflare.com", "cloudflareinsights.com",
              "jsdelivr.net", "unpkg.com", "gstatic.com", "googleapis.com",
              "google.com", "recaptcha.net", "jquery.com", "bootstrapcdn.com",
              "fontawesome.com", "jwpsrv.com", "jwpcdn.com", "jwplayer.com",
              "vimeocdn.com", "plyr.io", "zencdn.net", "videojs.com",
              "tmdb.org", "imgur.com", "wp.com", "gitlab.io", "github.io",
              "akamaihd.net", "fastly.net", "cloudfront.net", "disqus.com", "disquscdn.com"
            ];

            // 3. Patrones de URL publicitarios (Adsterra 32-hex, PopAds, 1xBet, banners y popunders)
            const AD_URL_REGEX = /(\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{32}\.js|\/[0-9a-f]{32}\/invoke\.js|\/invoke\.js\?|\/(popunder|tabunder|clickunder|socialbar|inpagepush|adframe|adscript)([\/._?-]|$)|\/(apu|afu)\.php(\?|$)|[?&](utm_source=pop|ad_type=pop|ali_trackid=|aff_fcid=|aff_fsk=|clickid=|zoneid=)|1xbet|mostbet|bet365|apuestasroyal)/i;

            function isDomainBlocked(hostname) {
              let curr = (hostname || "").toLowerCase().replace(/^www\./, "");
              while (curr && curr.includes(".")) {
                if (COMPILED_AD_DOMAINS.has(curr)) return true;
                const dotIdx = curr.indexOf(".");
                if (dotIdx === -1) break;
                curr = curr.slice(dotIdx + 1);
              }
              return false;
            }

            function getBaseBrand(hostname) {
              const clean = (hostname || "").toLowerCase().replace(/^www\./, "");
              const parts = clean.split(".");
              return parts.length >= 2 ? parts[parts.length - 2] : clean;
            }

            function isHostInList(host, list) {
              for (let i = 0; i < list.length; i++) {
                const item = list[i];
                if (host === item || host.endsWith("." + item)) return true;
              }
              return false;
            }

            if (typeof browser !== "undefined" && browser.webRequest && browser.webRequest.onBeforeRequest) {
              browser.webRequest.onBeforeRequest.addListener(
                function (details) {
                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");

                    // A. Bloqueo instantáneo O(1) por lista compilada de uBlock/AdGuard/EasyList o por patrón de URL
                    if (isDomainBlocked(reqHost) || AD_URL_REGEX.test(rawUrl)) {
                      if (details.type === "script") {
                        return { redirectUrl: "data:text/javascript;charset=utf-8," };
                      }
                      return { cancel: true };
                    }

                    const docUrl = details.originUrl || details.documentUrl || "";
                    if (!docUrl.startsWith("http")) return {};
                    const docHost = new URL(docUrl).hostname.toLowerCase().replace(/^www\./, "");

                    if (docHost.includes("chaturbate.com")) return {};

                    const isSameSite = (reqHost === docHost) ||
                                       reqHost.endsWith("." + docHost) ||
                                       docHost.endsWith("." + reqHost) ||
                                       (getBaseBrand(reqHost) === getBaseBrand(docHost));

                    // B. Cortafuegos de scripts de terceros desconocidos en el documento principal (frameId === 0)
                    //    de DramaChino, Doramasflix, TuDorama, AsiaLiveAction y KissKH:
                    //    Impide que dominios aleatorios recién registrados inyecten "CONFIRMA QUE NO ERES UN ROBOT".
                    if (details.type === "script" && details.frameId === 0 && !isSameSite) {
                      if (isHostInList(docHost, STRICT_ROOT_SCRIPT_SITES) &&
                          !isHostInList(reqHost, ALLOWED_TECH_CDNS)) {
                        return { redirectUrl: "data:text/javascript;charset=utf-8," };
                      }
                    }
                  } catch (_) {}
                  return {};
                },
                { urls: ["<all_urls>"] },
                ["blocking"]
              );
            }

            if (typeof browser !== "undefined" && browser.tabs && browser.tabs.onCreated) {
              browser.tabs.onCreated.addListener(function (tab) {
                if (tab && tab.openerTabId !== undefined && tab.id !== undefined) {
                  browser.tabs.remove(tab.id).catch(function () {});
                }
              });
            }
          })();
          '''

          background_js = background_js_template.replace("__DOMAINS_JSON__", domains_json_array)
          with open(os.path.join(SHIELD_DIR, "background.js"), "w", encoding="utf-8") as bf:
              bf.write(background_js.strip() + "\n")

          content_start_js = r'''(function () {
            "use strict";
            if (window.__battvNativeShieldActive) return;
            window.__battvNativeShieldActive = true;

            const isTopFrame = (window === window.top);
            const currentHost = (window.location.hostname || "").toLowerCase().replace(/^www\./, "");
            const isChaturbate = currentHost === "chaturbate.com" || currentHost.endsWith(".chaturbate.com");

            // 1. Inyección en el Main World:
            //    - En Chaturbate: activa MSE (hls.js) para directos 1080p sin cortes.
            //    - En el resto de páginas y reproductores: neutraliza window.open(), window.alert(),
            //      Notification.requestPermission() y clics sintéticos (a.click()) hacia dominios externos.
            const injectMainWorldEngine = function () {
              try {
                const s = document.createElement("script");
                if (isChaturbate) {
                  s.textContent = `(function(){
                    try {
                      const origCanPlay = HTMLMediaElement.prototype.canPlayType;
                      HTMLMediaElement.prototype.canPlayType = function(type) {
                        if (type && /mpegurl/i.test(type)) return "";
                        return origCanPlay.apply(this, arguments);
                      };
                    } catch(_) {}
                  })();`;
                } else {
                  s.textContent = `(function(){
                    try {
                      function createDummyPopupWindow(targetUrl) {
                        const resolvedUrl = (typeof targetUrl === "string" && targetUrl.length > 0) ? targetUrl : "https://localhost/";
                        const fakeLoc = {
                          href: resolvedUrl,
                          assign: function(u) { this.href = u; },
                          replace: function(u) { this.href = u; },
                          reload: function() {},
                          toString: function() { return this.href; }
                        };
                        const winObj = {
                          closed: false,
                          opener: window,
                          location: fakeLoc,
                          document: {
                            write: function() {},
                            writeln: function() {},
                            open: function() { return this; },
                            close: function() {},
                            body: { appendChild: function() {}, style: {} }
                          },
                          focus: function() {},
                          blur: function() {},
                          close: function() { this.closed = true; },
                          postMessage: function() {},
                          addEventListener: function() {},
                          removeEventListener: function() {},
                          setTimeout: function() { return 1; },
                          clearTimeout: function() {}
                        };
                        winObj.window = winObj;
                        winObj.self = winObj;
                        winObj.top = winObj;
                        return winObj;
                      }

                      window.open = function(url) {
                        if (url && typeof url === "string" && url.startsWith(location.origin) && window === window.top) {
                          location.href = url;
                        }
                        return createDummyPopupWindow(url);
                      };

                      const origAnchorClick = HTMLAnchorElement.prototype.click;
                      HTMLAnchorElement.prototype.click = function() {
                        try {
                          const href = (this.getAttribute("href") || "").trim();
                          const target = (this.getAttribute("target") || "").toLowerCase();
                          if (window !== window.top || target === "_blank" || (href.startsWith("http") && !href.includes(location.hostname))) {
                            return;
                          }
                        } catch (_) {}
                        return origAnchorClick.apply(this, arguments);
                      };

                      if ("Notification" in window) {
                        window.Notification.requestPermission = function() {
                          return Promise.resolve("denied");
                        };
                      }

                      const origAttachShadow = Element.prototype.attachShadow;
                      if (origAttachShadow) {
                        Element.prototype.attachShadow = function(init) {
                          const root = origAttachShadow.call(this, { mode: "open" });
                          this.setAttribute("data-battv-shadow", "1");
                          return root;
                        };
                      }
                    } catch(_) {}
                  })();`;
                }
                (document.head || document.documentElement).appendChild(s);
                s.remove();
              } catch (_) {}
            };

            if (document.documentElement) {
              injectMainWorldEngine();
            } else {
              document.addEventListener("DOMContentLoaded", injectMainWorldEngine, { once: true });
            }

            // 2. Desacortador automático (Exclusivo para dominios acortadores externos)
            if (isTopFrame && !isChaturbate) {
              const SHORTENER_HOSTS = [
                "ouo.io", "ouo.press", "exe.io", "exey.io", "fc.lc", "fc-lc.com",
                "shrtfly.com", "shrinke.me", "shrinkme.io", "linkvertise.com",
                "adfoc.us", "bc.vc", "shorte.st", "gestyy.com", "destyy.com",
                "corneey.com", "clk.sh", "clk.asia", "oko.sh", "za.gl",
                "cuty.io", "cety.app", "gplinks.co", "droplink.co", "tnshort.net",
                "rekonise.com", "sub2unlock.com", "boost.ink", "mboost.me",
                "short-jambo.com", "uii.io", "mitly.us"
              ];

              function tryDecodeBase64Url(str) {
                try {
                  const clean = decodeURIComponent(str).trim().replace(/-/g, "+").replace(/_/g, "/");
                  const decoded = atob(clean).trim();
                  if (/^https?:\/\/[^\s"']+$/i.test(decoded)) return decoded;
                } catch (_) {}
                return null;
              }

              try {
                const isShortener = SHORTENER_HOSTS.some(function (d) {
                  return currentHost === d || currentHost.endsWith("." + d);
                });
                if (isShortener) {
                  const params = new URLSearchParams(window.location.search);
                  const keys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                  for (let i = 0; i < keys.length; i++) {
                    const val = params.get(keys[i]);
                    if (!val) continue;
                    if (/^https?:\/\//i.test(val)) {
                      window.location.replace(val);
                      return;
                    }
                    const b64 = tryDecodeBase64Url(val);
                    if (b64) {
                      window.location.replace(b64);
                      return;
                    }
                  }
                }
              } catch (_) {}
            }

            // 3. Destructor de:
            //    - Modal "CONFIRMA QUE NO ERES UN ROBOT / Haz clic en el botón" (DramaChino y reproductores)
            //    - Banner horizontal "1XBET / ¡BONO 300% EN TUS PRIMEROS 4 DEPÓSITOS!" (JKAnime)
            //    - Tarjetas "¡Felicidades! BONUS €1500" y "¡Reclama tu bono AHORA! Ruleta Mundial"
            const EXACT_SCAM_PHRASES = [
              "confirma que no eres un robot",
              "haz clic en el botón",
              "haz clic en \"más\"",
              "haz clic en 'más'",
              "transferir dinero",
              "retirar dinero",
              "disponible €",
              "€1500",
              "reclama tu bono",
              "ruleta mundial",
              "empieza a ganar",
              "donde juegan los grandes",
              "apuestas royal",
              "bono de bienvenida",
              "primeros 4 depósitos",
              "cada apuesta, mil emociones",
              "limpia tu unknown"
            ];

            function hasExactScamPhrase(str) {
              if (!str) return false;
              const lower = str.toLowerCase();
              for (let i = 0; i < EXACT_SCAM_PHRASES.length; i++) {
                if (lower.includes(EXACT_SCAM_PHRASES[i])) return true;
              }
              return false;
            }

            function isProtectedPlayerHierarchy(el) {
              if (!el || !el.tagName) return false;
              const tag = el.tagName.toUpperCase();
              if (tag === "VIDEO" || tag === "BODY" || tag === "HTML") return true;
              if (el.id === "video_box" || el.id === "pframe" || el.id === "player" || el.id === "main_video_container") {
                return true;
              }
              if (el.classList && (
                  el.classList.contains("servers") ||
                  el.classList.contains("bg-servers") ||
                  el.classList.contains("player_conte") ||
                  el.classList.contains("video-player")
              )) {
                return true;
              }
              if (el.querySelector && el.querySelector("video, #video_box, #pframe, .player_conte, .servers, .bg-servers, iframe[src*='jkplayer'], iframe[src*='um.php']")) {
                return true;
              }
              return false;
            }

            function cleanAllAdsBannersAndRobotModals() {
              if (isChaturbate) return;
              try {
                // A. Si estamos dentro de un iframe publicitario que cargó "CONFIRMA QUE NO ERES UN ROBOT"
                //    y no contiene ningún <video>, ocultarlo de inmediato.
                if (!isTopFrame && document.body && !document.querySelector("video")) {
                  const bodyTxt = (document.body.textContent || "").trim();
                  if (bodyTxt.length > 5 && bodyTxt.length < 400 && hasExactScamPhrase(bodyTxt)) {
                    document.documentElement.style.setProperty("display", "none", "important");
                    return;
                  }
                }

                // B. Destruir Shadow DOMs que contengan anuncios ("BONUS €1500" / "CONFIRMA QUE NO ERES UN ROBOT")
                const shadowHosts = document.querySelectorAll("[data-battv-shadow]");
                for (let i = 0; i < shadowHosts.length; i++) {
                  const host = shadowHosts[i];
                  const sr = host.shadowRoot;
                  if (sr && !sr.querySelector("video")) {
                    const shadowDump = (sr.textContent || "") + " " + (sr.innerHTML || "");
                    if (hasExactScamPhrase(shadowDump)) {
                      host.remove();
                    }
                  }
                }

                // C. Eliminar banners horizontales externos (como el banner de 1XBET en JKAnime)
                //    y capas transparentes <a target="_blank"> sobre el reproductor
                const links = document.getElementsByTagName("a");
                for (let j = links.length - 1; j >= 0; j--) {
                  const a = links[j];
                  if (a.classList.contains("servers") || a.closest(".servers, .bg-servers, .dropdown-menu, #episodes-content")) {
                    a.removeAttribute("target");
                    continue;
                  }
