
name: Compilar Battv.2

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Battv.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version

      - name: Compilar APK Release
        working-directory: android-geckoview
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Battv.2-APK
          path: android-geckoview/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
