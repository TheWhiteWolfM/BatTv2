name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 (Evita error de SnakeYAML en GeckoView)
        run: |
          cat << 'EOF' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF

      - name: Generar Motor Nativo v13.0 (Doramasflix 100%, Anti-Robot/Casino 777 en DramaChino y JKAnime)
        run: |
          python3 - << 'EOF'
