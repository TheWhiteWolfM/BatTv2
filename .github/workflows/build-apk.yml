name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verificar aceleracion de hardware en AndroidManifest.xml
        run: |
          grep -q 'android:hardwareAccelerated="true"' android-geckoview/app/src/main/AndroidManifest.xml
          echo "android:hardwareAccelerated=true confirmado en AndroidManifest.xml"

      - name: Generar reglas ProGuard/R8 para reducir peso del APK
        run: |
          cat << 'EOF_PROGUARD' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -dontwarn androidx.**
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF_PROGUARD

      - name: Actualizar a versionCode 42 (v6.7), barra flotante sin relayout, ACTION_SCROLL y perfil 1080p/RAM
        run: |
          sed -i 's/\\vert{}\\vert{}/||/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/\\vert{}/|/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/versionCode [0-9]\+/versionCode 42/g' android-geckoview/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "6.7"/g' android-geckoview/app/build.gradle
          sed -i 's/shield_v[0-9]\+@battv.browser/shield_v42@battv.browser/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt
          sed -i 's/battv_shield_v[0-9]\+/battv_shield_v42/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt

          python3 - << 'EOF_PY'
          import re

          def replace_once(src, old, new, label):
              assert old in src, f"No se encontro el bloque esperado para: {label}"
              return src.replace(old, new, 1)

          # 1. Activar R8 (minifyEnabled + shrinkResources) en app/build.gradle
          gradle_path = "android-geckoview/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              g = f.read()

          new_build_types = (
              "buildTypes {\n"
              "        release {\n"
              "            minifyEnabled true\n"
              "            shrinkResources true\n"
              "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
              "            signingConfig signingConfigs.debug\n"
              "        }\n"
              "    }"
          )
          g, n_gradle = re.subn(
              r"buildTypes\s*\{\s*release\s*\{[\s\S]*?\}\s*\}",
              lambda _: new_build_types,
              g,
              count=1
          )
          assert n_gradle == 1, "No se pudo actualizar buildTypes en app/build.gradle"
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(g)

          # 2. Parchar MainActivity.kt (barra flotante en FrameLayout sin relayout, ACTION_SCROLL, cursor sin redibujo y cierre total)
          main_path = "android-geckoview/app/src/main/java/com/battv/browser/MainActivity.kt"
          with open(main_path, "r", encoding="utf-8") as f:
              code = f.read()

          code = re.sub(
              r"if \(geckoManager\.isKnownAdOrPopupUri\(url\) \|\| \(!isInitialNavigationInProgress && !geckoManager\.isSameOrTrustedNavigationTarget\(currentUrl, url\)\)\)",
              lambda _: "if (geckoManager.isKnownAdOrPopupUri(url))",
              code
          )

          code = replace_once(
              code,
              "private const val CURSOR_AUTO_HIDE_MS = 2500L",
              "private const val CURSOR_AUTO_HIDE_MS = 4500L",
              "CURSOR_AUTO_HIDE_MS"
          )

          code = replace_once(
              code,
              "private lateinit var rootLayout: LinearLayout\n  private lateinit var topBarLayout: LinearLayout",
              "private lateinit var rootLayout: FrameLayout\n"
              "  private lateinit var topBarContainer: LinearLayout\n"
              "  private lateinit var topBarLayout: LinearLayout\n"
              "  private var isTopBarOverlayVisible: Boolean = true\n"
              "  private var topBarHeightPx: Float = 0f\n"
              "  private val scrollPointerProps = arrayOf(\n"
              "    MotionEvent.PointerProperties().apply {\n"
              "      id = 0\n"
              "      toolType = MotionEvent.TOOL_TYPE_MOUSE\n"
              "    }\n"
              "  )\n"
              "  private val scrollPointerCoords = arrayOf(MotionEvent.PointerCoords())",
              "rootLayout FrameLayout + topBarContainer + ACTION_SCROLL"
          )

          code = replace_once(
              code,
              "private var isFullScreenVideo: Boolean = false",
              "private var isFullScreenVideo: Boolean = false\n  private var isExitingCompletely: Boolean = false",
              "isExitingCompletely"
          )

          code = replace_once(
              code,
              "private var lastFullscreenExitUptimeMs: Long = 0L",
              "private var lastFullscreenExitUptimeMs: Long = 0L\n"
              "  private var lastDismissedPlayerKey: String = \"\"\n"
              "  private var lastPromptedPlayerKey: String = \"\"\n"
              "  private var lastTopNavChangeUptimeMs: Long = 0L",
              "playerKey state"
          )

          code = replace_once(
              code,
              "private val hideCursorRunnable = Runnable {",
              "private val autoHideTopBarRunnable = Runnable {\n"
              "    if (isCursorModeActive && !isHomeScreenVisible && !isEditingUrlText && !isEditingWebInput) {\n"
              "      setTopBarOverlayVisible(false, animate = true)\n"
              "    }\n"
              "  }\n\n"
              "  private val hideCursorRunnable = Runnable {",
              "autoHideTopBarRunnable"
          )

          old_scroll_calc = (
              "        if (!isFullScreenVideo) {\n"
              "          val targetScrollSpeed = BASE_SCROLL_FRAME_SPEED_PX +\n"
              "            (MAX_SCROLL_FRAME_SPEED_PX - BASE_SCROLL_FRAME_SPEED_PX) * (accelFactor * accelFactor).toDouble()\n"
              "          currentScrollSpeedPx = currentScrollSpeedPx * 0.75 + targetScrollSpeed * 0.25\n\n"
              "          if (activeDpadKeyCode == KeyEvent.KEYCODE_DPAD_UP && cursorOverlay.cursorY <= EDGE_SCROLL_ZONE_PX) {\n"
              "            remainingShortTapScrollPx = 0.0\n"
              "            scrollWebPageNative(-currentScrollSpeedPx * dtScale)\n"
              "          } else if (activeDpadKeyCode == KeyEvent.KEYCODE_DPAD_DOWN &&\n"
              "            cursorOverlay.cursorY >= (webContainer.height - EDGE_SCROLL_ZONE_PX)\n"
              "          ) {\n"
              "            remainingShortTapScrollPx = 0.0\n"
              "            scrollWebPageNative(currentScrollSpeedPx * dtScale)\n"
              "          }\n"
              "        }"
          )
          new_scroll_calc = (
              "        if (!isFullScreenVideo) {\n"
              "          val constantScrollStep = 17.0 * dtScale\n"
              "          if (activeDpadKeyCode == KeyEvent.KEYCODE_DPAD_UP && cursorOverlay.cursorY <= EDGE_SCROLL_ZONE_PX) {\n"
              "            remainingShortTapScrollPx = 0.0\n"
              "            scrollWebPageNative(-constantScrollStep)\n"
              "          } else if (activeDpadKeyCode == KeyEvent.KEYCODE_DPAD_DOWN &&\n"
              "            cursorOverlay.cursorY >= (webContainer.height - EDGE_SCROLL_ZONE_PX)\n"
              "          ) {\n"
              "            remainingShortTapScrollPx = 0.0\n"
              "            scrollWebPageNative(constantScrollStep)\n"
              "          }\n"
              "        }"
          )
          code = replace_once(code, old_scroll_calc, new_scroll_calc, "constantScrollStep")

          old_on_resume = (
              "  override fun onResume() {\n"
              "    super.onResume()\n"
              "    geckoSession?.setActive(true)\n"
              "    geckoSession?.setFocused(true)\n"
              "    if (isFullScreenVideo) {\n"
              "      applyImmersiveSystemUi(true)\n"
              "    }\n"
              "  }"
          )
          new_on_resume = (
              "  override fun onResume() {\n"
              "    super.onResume()\n"
              "    if (!isHomeScreenVisible) {\n"
              "      geckoSession?.setActive(true)\n"
              "      geckoSession?.setFocused(true)\n"
              "    }\n"
              "    if (isFullScreenVideo) {\n"
              "      applyImmersiveSystemUi(true)\n"
              "    }\n"
              "  }"
          )
          code = replace_once(code, old_on_resume, new_on_resume, "onResume setActive guard")

          old_root_init = (
              "    rootLayout = LinearLayout(this).apply {\n"
              "      orientation = LinearLayout.VERTICAL\n"
              "      layoutParams = ViewGroup.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT\n"
              "      )\n"
              "      setBackgroundColor(Color.parseColor(\"#080B18\"))\n"
              "    }"
          )
          new_root_init = (
              "    rootLayout = FrameLayout(this).apply {\n"
              "      layoutParams = ViewGroup.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT\n"
              "      )\n"
              "      setBackgroundColor(Color.parseColor(\"#080B18\"))\n"
              "    }"
          )
          code = replace_once(code, old_root_init, new_root_init, "rootLayout FrameLayout init")

          old_progress_bar = (
              "    loadingProgressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {\n"
              "      max = 100\n"
              "      progress = 0\n"
              "      visibility = View.GONE\n"
              "      layoutParams = LinearLayout.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        dp(3)\n"
              "      )\n"
              "    }"
          )
          new_progress_bar = (
              "    loadingProgressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {\n"
              "      max = 100\n"
              "      progress = 0\n"
              "      visibility = View.GONE\n"
              "      elevation = 120f\n"
              "      layoutParams = FrameLayout.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        dp(3),\n"
              "        Gravity.TOP\n"
              "      )\n"
              "    }"
          )
          code = replace_once(code, old_progress_bar, new_progress_bar, "loadingProgressBar overlay")

          old_web_container = (
              "    webContainer = FrameLayout(this).apply {\n"
              "      clipChildren = false\n"
              "      layoutParams = LinearLayout.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        0,\n"
              "        1f\n"
              "      )\n"
              "    }"
          )
          new_web_container = (
              "    webContainer = FrameLayout(this).apply {\n"
              "      clipChildren = false\n"
              "      layoutParams = FrameLayout.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT\n"
              "      )\n"
              "    }"
          )
          code = replace_once(code, old_web_container, new_web_container, "webContainer MATCH_PARENT")

          old_gecko_touch = (
              "      setOnTouchListener { _, event ->\n"
              "        if (event.actionMasked == MotionEvent.ACTION_DOWN) {\n"
              "          lastUserWebClickTime = SystemClock.uptimeMillis()\n"
              "        }\n"
              "        if (!isSyntheticDpadTap) {\n"
              "          cursorOverlay.hideCursorUntilMoved()\n"
              "        }\n"
              "        false\n"
              "      }"
          )
          new_gecko_touch = (
              "      setDynamicToolbarMaxHeight(0)\n"
              "      setOnTouchListener { _, event ->\n"
              "        if (event.actionMasked == MotionEvent.ACTION_DOWN) {\n"
              "          lastUserWebClickTime = SystemClock.uptimeMillis()\n"
              "          if (!isSyntheticDpadTap && !isFullScreenVideo && !isHomeScreenVisible) {\n"
              "            if (!isTopBarOverlayVisible && event.y <= (38f * density)) {\n"
              "              setTopBarOverlayVisible(true, animate = true)\n"
              "              scheduleAutoHideTopBar(4200L)\n"
              "            } else if (isTopBarOverlayVisible && event.y > topBarHeightPx) {\n"
              "              setTopBarOverlayVisible(false, animate = true)\n"
              "            }\n"
              "          }\n"
              "        }\n"
              "        if (!isSyntheticDpadTap) {\n"
              "          cursorOverlay.hideCursorUntilMoved()\n"
              "        }\n"
              "        false\n"
              "      }"
          )
          code = replace_once(code, old_gecko_touch, new_gecko_touch, "geckoView setDynamicToolbarMaxHeight")

          code = replace_once(
              code,
              "setPadding(dp(36), dp(24), dp(36), dp(28))",
              "setPadding(dp(36), dp(72), dp(36), dp(28))",
              "homeContentContainer top padding"
          )

          old_root_adds = (
              "    rootLayout.addView(topBarLayout)\n"
              "    rootLayout.addView(loadingProgressBar)\n"
              "    rootLayout.addView(webContainer)"
          )
          new_root_adds = (
              "    topBarHeightPx = dp(56).toFloat()\n"
              "    topBarContainer = LinearLayout(this).apply {\n"
              "      orientation = LinearLayout.VERTICAL\n"
              "      elevation = 110f\n"
              "      setLayerType(View.LAYER_TYPE_HARDWARE, null)\n"
              "      layoutParams = FrameLayout.LayoutParams(\n"
              "        ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "        ViewGroup.LayoutParams.WRAP_CONTENT,\n"
              "        Gravity.TOP\n"
              "      )\n"
              "      addView(topBarLayout)\n"
              "    }\n"
              "    rootLayout.addView(webContainer)\n"
              "    rootLayout.addView(topBarContainer)\n"
              "    rootLayout.addView(loadingProgressBar)"
          )
          code = replace_once(code, old_root_adds, new_root_adds, "rootLayout overlay stacking")

          topbar_helpers = (
              "  private fun setTopBarOverlayVisible(visible: Boolean, animate: Boolean = true) {\n"
              "    if (!::topBarContainer.isInitialized) return\n"
              "    if (isTopBarOverlayVisible == visible && animate) return\n"
              "    isTopBarOverlayVisible = visible\n"
              "    topBarContainer.descendantFocusability = if (visible) {\n"
              "      ViewGroup.FOCUS_AFTER_DESCENDANTS\n"
              "    } else {\n"
              "      ViewGroup.FOCUS_BLOCK_DESCENDANTS\n"
              "    }\n"
              "    val targetY = if (visible) 0f else -topBarHeightPx\n"
              "    val targetAlpha = if (visible) 1f else 0f\n"
              "    topBarContainer.animate().cancel()\n"
              "    if (animate) {\n"
              "      topBarContainer.animate()\n"
              "        .translationY(targetY)\n"
              "        .alpha(targetAlpha)\n"
              "        .setDuration(140L)\n"
              "        .start()\n"
              "    } else {\n"
              "      topBarContainer.translationY = targetY\n"
              "      topBarContainer.alpha = targetAlpha\n"
              "    }\n"
              "  }\n\n"
              "  private fun scheduleAutoHideTopBar(delayMs: Long = 2200L) {\n"
              "    mainHandler.removeCallbacks(autoHideTopBarRunnable)\n"
              "    if (!isHomeScreenVisible && isCursorModeActive && !isEditingUrlText && !isEditingWebInput) {\n"
              "      mainHandler.postDelayed(autoHideTopBarRunnable, delayMs)\n"
              "    }\n"
              "  }\n\n"
          )
          code = replace_once(
              code,
              "  private fun promptAutoFullscreenIfEligible()",
              topbar_helpers + "  private fun promptAutoFullscreenIfEligible()",
              "topbar helpers"
          )

          new_apply_fs = (
              "private fun applyFullScreenState(fullScreen: Boolean) {\n"
              "    isFullScreenVideo = fullScreen\n"
              "    stopSmoothDpadMovement(immediate = true)\n"
              "    mainHandler.removeCallbacks(autoHideTopBarRunnable)\n\n"
              "    if (fullScreen) {\n"
              "      dismissFullscreenPromptDialog()\n"
              "      if (isEditingWebInput || isEditingUrlText) {\n"
              "        closeNativeWebInputBridge(submit = false)\n"
              "      }\n"
              "      homeOverlayLayout.visibility = View.GONE\n"
              "      loadingProgressBar.visibility = View.GONE\n"
              "      setTopBarOverlayVisible(false, animate = false)\n"
              "      applyImmersiveSystemUi(true)\n\n"
              "      isCursorModeActive = true\n"
              "      cursorOverlay.hideCursorUntilMoved()\n"
              "      geckoView.requestFocus()\n"
              "    } else {\n"
              "      lastFullscreenExitUptimeMs = SystemClock.uptimeMillis()\n"
              "      mainHandler.removeCallbacks(hideVideoSeekRunnable)\n"
              "      isUserSeekingVod = false\n"
              "      consecutiveSeekPresses = 0\n"
              "      cumulativeSeekDeltaSec = 0.0\n"
              "      videoSeekOverlay.hideOverlayImmediate()\n\n"
              "      applyImmersiveSystemUi(false)\n"
              "      if (isHomeScreenVisible) {\n"
              "        homeOverlayLayout.visibility = View.VISIBLE\n"
              "        setTopBarOverlayVisible(true, animate = false)\n"
              "      } else {\n"
              "        setTopBarOverlayVisible(false, animate = false)\n"
              "        activateCursorMode(showPointerNow = true)\n"
              "      }\n"
              "    }\n"
              "  }"
          )
          code, n_fs = re.subn(
              r"private fun applyFullScreenState\(fullScreen: Boolean\)\s*\{[\s\S]*?\n  \}",
              lambda _: new_apply_fs,
              code,
              count=1
          )
          assert n_fs == 1, "No se pudo actualizar applyFullScreenState"

          code = replace_once(
              code,
              "topBarLayout.visibility = View.VISIBLE",
              "mainHandler.removeCallbacks(autoHideTopBarRunnable)\n    setTopBarOverlayVisible(true, animate = true)",
              "startEditingUrlText show topBar"
          )

          code = replace_once(
              code,
              "    toolbarIndex = URL_BAR_INDEX\n    homeOverlayLayout.clearFocus()",
              "    toolbarIndex = URL_BAR_INDEX\n    mainHandler.removeCallbacks(autoHideTopBarRunnable)\n    setTopBarOverlayVisible(true, animate = true)\n    homeOverlayLayout.clearFocus()",
              "activateToolbarMode show topBar"
          )

          code = replace_once(
              code,
              "    geckoSession?.setActive(true)\n    geckoSession?.setFocused(true)\n  }",
              "    geckoSession?.setActive(true)\n    geckoSession?.setFocused(true)\n"
              "    if (vodIsPlaying || isFullScreenVideo) {\n"
              "      setTopBarOverlayVisible(false, animate = true)\n"
              "    } else {\n"
              "      scheduleAutoHideTopBar(2400L)\n"
              "    }\n  }",
              "activateCursorMode autoHideTopBar"
          )

          code = replace_once(
              code,
              "    if (keyCode == KeyEvent.KEYCODE_BACK) {",
              "    if (keyCode == KeyEvent.KEYCODE_MENU) {\n"
              "      if (action == KeyEvent.ACTION_UP && !isHomeScreenVisible && !isFullScreenVideo) {\n"
              "        activateToolbarMode()\n"
              "      }\n"
              "      return true\n"
              "    }\n\n"
              "    if (keyCode == KeyEvent.KEYCODE_BACK) {",
              "KEYCODE_MENU"
          )

          new_scroll_fn = (
              "private fun scrollWebPageNative(deltaYPixels: Double) {\n"
              "    if (abs(deltaYPixels) < 0.1) return\n"
              "    try {\n"
              "      val now = SystemClock.uptimeMillis()\n"
              "      val vScroll = (-deltaYPixels / 42.0).toFloat().coerceIn(-1.5f, 1.5f)\n"
              "      scrollPointerCoords[0].apply {\n"
              "        clear()\n"
              "        x = cursorOverlay.cursorX.coerceIn(12f, max(12f, webContainer.width - 12f))\n"
              "        y = cursorOverlay.cursorY.coerceIn(12f, max(12f, webContainer.height - 12f))\n"
              "        setAxisValue(MotionEvent.AXIS_VSCROLL, vScroll)\n"
              "      }\n"
              "      val scrollEvent = MotionEvent.obtain(\n"
              "        now, now, MotionEvent.ACTION_SCROLL,\n"
              "        1, scrollPointerProps, scrollPointerCoords,\n"
              "        0, 0, 1f, 1f, 0, 0,\n"
              "        InputDevice.SOURCE_MOUSE, 0\n"
              "      )\n"
              "      geckoSession?.panZoomController?.onMotionEvent(scrollEvent)\n"
              "      scrollEvent.recycle()\n"
              "    } catch (_: Exception) {\n"
              "      try {\n"
              "        geckoSession?.panZoomController?.scrollBy(\n"
              "          ScreenLength.zero(),\n"
              "          ScreenLength.fromPixels(deltaYPixels),\n"
              "          PanZoomController.SCROLL_BEHAVIOR_AUTO\n"
              "        )\n"
              "      } catch (_: Exception) {}\n"
              "    }\n"
              "  }"
          )
          code, n_scroll = re.subn(
              r"private fun scrollWebPageNative\(deltaYPixels: Double\)\s*\{[\s\S]*?\n  \}",
              lambda _: new_scroll_fn,
              code,
              count=1
          )
          assert n_scroll == 1, "No se pudo actualizar scrollWebPageNative"

          old_move_cursor = (
              "    fun moveCursorBy(dx: Float, dy: Float): Boolean {\n"
              "      val maxW = max(1f, webContainer.width.toFloat())\n"
              "      val maxH = max(1f, webContainer.height.toFloat())\n"
              "      val nextY = cursorY + dy\n"
              "      val hitTop = nextY <= 2f\n"
              "      cursorX = (cursorX + dx).coerceIn(4f, maxW - 4f)\n"
              "      cursorY = nextY.coerceIn(2f, maxH - 4f)\n\n"
              "      translationX = cursorX - hotspotOffsetPx\n"
              "      translationY = cursorY - hotspotOffsetPx\n\n"
              "      if (!cursorVisible || visibility != VISIBLE) {\n"
              "        cursorVisible = true\n"
              "        visibility = VISIBLE\n"
              "      }\n"
              "      return hitTop\n"
              "    }\n\n"
              "    fun showCursorAndScheduleFade() {\n"
              "      translationX = cursorX - hotspotOffsetPx\n"
              "      translationY = cursorY - hotspotOffsetPx\n"
              "      if (!cursorVisible || visibility != VISIBLE) {\n"
              "        cursorVisible = true\n"
              "        visibility = VISIBLE\n"
              "      }\n"
              "    }\n\n"
              "    fun hideCursorUntilMoved() {\n"
              "      cursorVisible = false\n"
              "      pulseRadius = 0f\n"
              "      visibility = GONE\n"
              "    }"
          )
          new_move_cursor = (
              "    fun moveCursorBy(dx: Float, dy: Float): Boolean {\n"
              "      val maxW = max(1f, webContainer.width.toFloat())\n"
              "      val maxH = max(1f, webContainer.height.toFloat())\n"
              "      val nextY = cursorY + dy\n"
              "      val hitTop = nextY <= 2f\n"
              "      val clampedX = (cursorX + dx).coerceIn(4f, maxW - 4f)\n"
              "      val clampedY = nextY.coerceIn(2f, maxH - 4f)\n"
              "      if (abs(clampedX - cursorX) >= 0.05f || abs(clampedY - cursorY) >= 0.05f) {\n"
              "        cursorX = clampedX\n"
              "        cursorY = clampedY\n"
              "        translationX = cursorX - hotspotOffsetPx\n"
              "        translationY = cursorY - hotspotOffsetPx\n"
              "      }\n"
              "      if (!cursorVisible || visibility != VISIBLE) {\n"
              "        cursorVisible = true\n"
              "        visibility = VISIBLE\n"
              "      }\n"
              "      return hitTop\n"
              "    }\n\n"
              "    fun showCursorAndScheduleFade() {\n"
              "      val targetX = cursorX - hotspotOffsetPx\n"
              "      val targetY = cursorY - hotspotOffsetPx\n"
              "      if (abs(translationX - targetX) >= 0.05f) translationX = targetX\n"
              "      if (abs(translationY - targetY) >= 0.05f) translationY = targetY\n"
              "      if (!cursorVisible || visibility != VISIBLE) {\n"
