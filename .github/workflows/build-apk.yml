name: Build Bat TV GeckoView Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-geckoview-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Evita errores si falta gradle-wrapper.jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Dependencies & Build Bat TV Web Bundle
        run: |
          npm install
          npm run build

      - name: Copy Web Bundle to Android Assets
        run: |
          mkdir -p android-geckoview/app/src/main/assets/www
          cp -r dist/* android-geckoview/app/src/main/assets/www/
          cp -r dist/* android-geckoview/app/src/main/assets/

      - name: Build Signed Android APK with Gradle
        working-directory: ./android-geckoview
        run: |
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatTV-GeckoView-APK
          path: android-geckoview/app/build/outputs/apk/debug/*.apk
