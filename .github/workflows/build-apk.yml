            // 2. Sitios donde aplicamos el cortafuegos estricto de scripts externos en la página principal:
            //    Impide que DramaChino o Doramasflix carguen el script del casino "777 ¡Felicidades! ¡Reclama tu bono!"
            //    NOTA: jkanime.net NO está aquí para no alterar su comportamiento actual.
            const STRICT_SCRIPT_FIREWALL_SITES = [
