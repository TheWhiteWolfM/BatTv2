                if (isShortener) {
                  const params = new URLSearchParams(window.location.search);
                  const keys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                  for (let i = 0; i < keys.length; i++) {
                    const val = params.get(keys[i]);
                    if (!val) continue;
                    if (/^https?:\/\//i.test(val)) {
                      window.location.replace(val);
                      return;
                    }
                    const b64 = tryDecodeBase64Url(val);
                    if (b64) {
