name: Compilar Battv.2

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Battv.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar las 3 extensiones oficiales (Pop-ups Blocker, uBlock Origin, Violentmonkey)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import shutil
          import urllib.request
          import zipfile

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)
          os.makedirs(EXT_BASE, exist_ok=True)

          EXTENSIONS = [
              {
                  "folder": "popup_blocker",
                  "id": "{54e2eb33-18eb-46ad-a4e4-1329c29f6e17}",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/popup-blocker/latest.xpi"
              },
              {
                  "folder": "ublock_origin",
                  "id": "uBlock0@raymondhill.net",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
              },
              {
                  "folder": "violentmonkey",
                  "id": "{aecec67f-0d10-4fa7-b7c7-609a2db280cf}",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/violentmonkey/latest.xpi"
              }
          ]

          KEEP_LOCALES = {"en", "en_US", "en_GB", "es", "es_ES", "es_419"}

          for ext in EXTENSIONS:
              dest_dir = os.path.join(EXT_BASE, ext["folder"])
              os.makedirs(dest_dir, exist_ok=True)
              xpi_path = os.path.join(EXT_BASE, ext["folder"] + ".xpi")
              print(f"Descargando {ext['folder']} desde {ext['url']}...")
              req = urllib.request.Request(
                  ext["url"],
                  headers={"User-Agent": "Mozilla/5.0 (Android 14; Mobile; rv:130.0) Gecko/130.0 Firefox/130.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as resp, open(xpi_path, "wb") as out_f:
                  shutil.copyfileobj(resp, out_f)

              with zipfile.ZipFile(xpi_path, "r") as zf:
                  zf.extractall(dest_dir)
              os.remove(xpi_path)

              meta_inf = os.path.join(dest_dir, "META-INF")
              if os.path.exists(meta_inf):
                  shutil.rmtree(meta_inf)

              locales_dir = os.path.join(dest_dir, "_locales")
              if os.path.isdir(locales_dir):
                  for loc in os.listdir(locales_dir):
                      loc_path = os.path.join(locales_dir, loc)
                      if os.path.isdir(loc_path) and loc not in KEEP_LOCALES:
                          shutil.rmtree(loc_path)

              # Eliminar mapas de código o documentación innecesaria para reducir tamaño del APK
              for root_d, _, files in os.walk(dest_dir):
                  for file_n in files:
                      if file_n.endswith(".map") or file_n in ("LICENSE.txt", "README.md"):
                          try:
                              os.remove(os.path.join(root_d, file_n))
                          except Exception:
                              pass

              manifest_path = os.path.join(dest_dir, "manifest.json")
              with open(manifest_path, "r", encoding="utf-8") as mf:
                  manifest = json.load(mf)

              bss = manifest.setdefault("browser_specific_settings", {})
              gecko = bss.setdefault("gecko", {})
              gecko["id"] = ext["id"]
              gecko.pop("update_url", None)
              if "applications" in manifest and "gecko" in manifest["applications"]:
                  manifest["applications"]["gecko"]["id"] = ext["id"]
                  manifest["applications"]["gecko"].pop("update_url", None)

              with open(manifest_path, "w", encoding="utf-8") as mf:
                  json.dump(manifest, mf, indent=2, ensure_ascii=False)

          # 1. Preconfigurar Pop-ups Blocker (strict) activo desde el primer inicio
          pb_dir = os.path.join(EXT_BASE, "popup_blocker")
          pb_manifest_path = os.path.join(pb_dir, "manifest.json")
          with open(pb_manifest_path, "r", encoding="utf-8") as mf:
              pb_manifest = json.load(mf)

          with open(os.path.join(pb_dir, "battv_pb_init.js"), "w", encoding="utf-8") as pbf:
              pbf.write("""(function () {
            try {
              if (typeof browser !== "undefined" && browser.storage && browser.storage.local) {
                browser.storage.local.get("battv_pb_ready").then(function (res) {
                  if (!res || !res.battv_pb_ready) {
                    browser.storage.local.set({
                      battv_pb_ready: true,
                      enabled: true,
                      immediate: true,
                      aggressive: true,
                      badge: false
                    });
                  }
                });
              }
            } catch (_) {}
          })();\n""")

          pb_bg = pb_manifest.setdefault("background", {})
          if "page" in pb_bg:
              pb_page_path = os.path.join(pb_dir, pb_bg["page"].lstrip("/"))
              if os.path.exists(pb_page_path):
                  with open(pb_page_path, "r", encoding="utf-8") as pf:
                      html = pf.read()
                  tag = '<script src="/battv_pb_init.js"></script>'
                  if tag not in html:
                      html = html.replace("</body>", tag + "\n</body>") if "</body>" in html else (html + "\n" + tag)
                      with open(pb_page_path, "w", encoding="utf-8") as pf:
                          pf.write(html)
          else:
              pb_scripts = bg_scripts = pb_bg.setdefault("scripts", [])
              if "battv_pb_init.js" not in pb_scripts:
                  pb_scripts.insert(0, "battv_pb_init.js")

          with open(pb_manifest_path, "w", encoding="utf-8") as mf:
              json.dump(pb_manifest, mf, indent=2, ensure_ascii=False)

          # 2. Integrar «Saltarse Todos los Enlaces Acortados» y el ayudante ligero de TV en Violentmonkey
          vm_dir = os.path.join(EXT_BASE, "violentmonkey")
          vm_manifest_path = os.path.join(vm_dir, "manifest.json")

          shortlink_userscript = r'''// ==UserScript==
          // @name         Saltarse Todos los Enlaces Acortados
          // @namespace    battv.shortlinks.bypass
          // @version      2.4.0
          // @description  Salta automaticamente enlaces acortados e intermedios compatibles sin esperas.
          // @author       BatTV
          // @run-at       document-start
          // @match        *://*/*
          // @grant        none
          // ==/UserScript==

          (function () {
            "use strict";
            if (window.__battvShortlinkBypassActive) return;
            window.__battvShortlinkBypassActive = true;

            const SHORTENER_HOSTS = [
              "ouo.io", "ouo.press", "exe.io", "exey.io", "fc.lc", "fc-lc.com",
              "shrtfly.com", "shrinke.me", "shrinkme.io", "linkvertise.com",
              "adfoc.us", "bc.vc", "shorte.st", "gestyy.com", "destyy.com",
              "corneey.com", "clk.sh", "clk.asia", "oko.sh", "za.gl",
              "cuty.io", "cety.app", "gplinks.co", "droplink.co", "tnshort.net",
              "rekonise.com", "sub2unlock.com", "boost.ink", "mboost.me",
              "embedshortener.co", "short-jambo.com", "uii.io", "mitly.us"
            ];

            function tryDecodeBase64Url(str) {
              try {
                const clean = decodeURIComponent(str).trim().replace(/-/g, "+").replace(/_/g, "/");
                const decoded = atob(clean).trim();
                if (/^https?:\/\/[^\s"']+$/i.test(decoded)) return decoded;
              } catch (_) {}
              return null;
            }

            function checkDirectRedirectParams() {
              try {
                const loc = window.location;
                const host = loc.hostname.toLowerCase();

                if (host.includes("embedshortener.co") && loc.pathname.startsWith("/e/")) {
                  const parts = loc.pathname.slice(3).split(".");
                  if (parts.length > 1) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
                    if (payload && payload.link) {
                      const target = tryDecodeBase64Url(payload.link);
                      if (target) {
                        loc.replace(target);
                        return true;
                      }
                    }
                  }
                }

                const isKnownShortener = SHORTENER_HOSTS.some(function (d) {
                  return host === d || host.endsWith("." + d);
                });
                if (!isKnownShortener) return false;

                const params = new URLSearchParams(loc.search);
                const candidateKeys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                for (let i = 0; i < candidateKeys.length; i++) {
                  const val = params.get(candidateKeys[i]);
                  if (!val) continue;
                  if (/^https?:\/\//i.test(val)) {
                    loc.replace(val);
                    return true;
                  }
                  const b64 = tryDecodeBase64Url(val);
                  if (b64) {
                    loc.replace(b64);
                    return true;
                  }
                }
              } catch (_) {}
              return false;
            }

            if (checkDirectRedirectParams()) return;

            function accelerateAndClickShortener() {
              try {
                const host = window.location.hostname.toLowerCase();
                const isKnownShortener = SHORTENER_HOSTS.some(function (d) {
                  return host === d || host.endsWith("." + d);
                });
                if (!isKnownShortener) return;

                const selectors = [
                  "a#btn-main.btn", "button#btn-main", "#invisibleCaptchaShortlink",
                  "a.get-link", "button.get-link", "#yuidea-btn", "#btn6",
                  "a[href*='https://'][class*='btn']", "form#go-link button[type='submit']"
                ];
                for (let i = 0; i < selectors.length; i++) {
                  const el = document.querySelector(selectors[i]);
                  if (el && !el.disabled) {
                    const href = el.getAttribute("href");
                    if (href && /^https?:\/\//i.test(href) && !href.includes(host)) {
                      window.location.replace(href);
                      return;
                    }
                    el.click();
                  }
                }
              } catch (_) {}
            }

            document.addEventListener("DOMContentLoaded", function () {
              accelerateAndClickShortener();
              setTimeout(accelerateAndClickShortener, 1200);
            });
          })();
          '''

          with open(os.path.join(vm_dir, "saltarse_enlaces_acortados.user.js"), "w", encoding="utf-8") as sf:
              sf.write(shortlink_userscript.strip() + "\n")

          preload_bg_js = r'''(function () {
            "use strict";
            const SEED_KEY = "battv_shortlink_script_seeded_v6";
            const SCRIPT_CODE = `''' + shortlink_userscript.strip().replace("\\", "\\\\").replace("`", "\\`").replace("$", "\\$") + r'''`;

            async function seedShortlinkScript() {
              try {
                if (typeof browser === "undefined" || !browser.storage || !browser.storage.local) return;
                const data = await browser.storage.local.get([SEED_KEY, "Ids"]);
                if (data && data[SEED_KEY]) return;

                const now = Date.now();
                const ids = Array.isArray(data.Ids) ? data.Ids : [];
                const scriptId = 1;
                if (!ids.includes(scriptId)) {
                  ids.push(scriptId);
                }

                const scriptObj = {
                  meta: {
                    name: "Saltarse Todos los Enlaces Acortados",
                    namespace: "battv.shortlinks.bypass",
                    version: "2.4.0",
                    description: "Salta automaticamente enlaces acortados e intermedios compatibles sin esperas.",
                    author: "BatTV",
                    runAt: "document-start",
                    match: ["*://*/*"],
                    include: [],
                    exclude: [],
                    excludeMatch: [],
                    grant: ["none"],
                    resources: {}
                  },
                  custom: {
                    origInclude: true,
                    origExclude: true,
                    origMatch: true,
                    origExcludeMatch: true
                  },
                  props: {
                    id: scriptId,
                    position: 1,
                    lastModified: now,
                    lastUpdated: now,
                    uri: "battv.shortlinks.bypass/Saltarse_Todos_los_Enlaces_Acortados"
                  },
                  config: {
                    enabled: 1,
                    shouldUpdate: 0,
                    notifyUpdates: 0
                  }
                };

                const payload = {};
                payload[SEED_KEY] = true;
                payload["Ids"] = ids;
                payload["script:" + scriptId] = scriptObj;
                payload["code:" + scriptId] = SCRIPT_CODE;
                payload["val:" + scriptId] = {};

                await browser.storage.local.set(payload);
              } catch (_) {}
            }

            seedShortlinkScript();
          })();
          '''

          with open(os.path.join(vm_dir, "preload_shortlinks.js"), "w", encoding="utf-8") as pf:
              pf.write(preload_bg_js.strip() + "\n")

          battv_tv_helper_js = r'''(function () {
            "use strict";
            if (window.__battvTvHelperLoaded) return;
            window.__battvTvHelperLoaded = true;

            const isTopFrame = (window === window.top);
            let port = null;
            let activeInputEl = null;
            let inputCounter = 1;
            let promptedVideosSet = new WeakSet();
            let watchedVideosSet = new WeakSet();
            let lastFullscreenPromptMs = 0;
            let userPausedManuallyUntil = 0;

            function ensureBridgeConnected() {
              if (port) return port;
              try {
                if (typeof browser !== "undefined" && browser.runtime && browser.runtime.connectNative) {
                  port = browser.runtime.connectNative("battv_bridge");
                  port.onMessage.addListener(handleNativeMessage);
                  port.onDisconnect.addListener(function () {
                    port = null;
                  });
                }
              } catch (_) {}
              return port;
            }

            function postToNative(obj) {
              try {
                const p = ensureBridgeConnected();
                if (p) p.postMessage(obj);
              } catch (_) {}
            }

            // 1. Estilos CSS ligeros para ocultar anuncios flotantes (Vidoomy/Viwom) y ajustar pantalla completa
            function injectFastTvStyles() {
              try {
                const styleId = "__battv_fullscreen_css";
                if (document.getElementById(styleId)) return;
                const style = document.createElement("style");
                style.id = styleId;
                style.textContent = `
                  [id*="vidoomy" i], [class*="vidoomy" i],
                  [id*="viwom" i], [class*="viwom" i],
                  [id*="aniview" i], [class*="aniview" i],
                  [id*="primis" i], [class*="primis" i],
                  [id*="adinplay" i], [class*="adinplay" i],
                  iframe[src*="vidoomy" i], iframe[src*="viwom" i],
                  iframe[src*="exoclick" i], iframe[src*="adsterra" i],
                  iframe[src*="magsrv" i], iframe[src*="realsrv" i],
                  iframe[src*="doubleclick" i], iframe[src*="googlesyndication" i],
                  iframe[src*="popads" i], iframe[src*="propellerads" i],
                  ins.eas6a97888e, div[class*="popunder" i], div[id*="popunder" i] {
                    display: none !important;
                    visibility: hidden !important;
                    opacity: 0 !important;
                    pointer-events: none !important;
                    width: 0 !important;
                    height: 0 !important;
                  }
                  html.__battv_lock_scroll,
                  html.__battv_lock_scroll body {
                    overflow: hidden !important;
                    background: #000 !important;
                  }
                  .__battv_fs_ancestor {
                    transform: none !important;
                    filter: none !important;
                    backdrop-filter: none !important;
                    perspective: none !important;
                    contain: none !important;
                    clip-path: none !important;
                    mask: none !important;
                    overflow: visible !important;
                    z-index: 2147483645 !important;
                  }
                  :fullscreen, :-moz-full-screen,
                  .__battv_iframe_fullscreen,
                  .__battv_player_fill_frame {
                    position: fixed !important;
                    inset: 0 !important;
                    top: 0 !important;
                    left: 0 !important;
                    right: 0 !important;
                    bottom: 0 !important;
                    width: 100vw !important;
                    height: 100vh !important;
                    max-width: 100vw !important;
                    max-height: 100vh !important;
                    min-width: 100vw !important;
                    min-height: 100vh !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    border: none !important;
                    z-index: 2147483646 !important;
                    background: #000 !important;
                    box-sizing: border-box !important;
                  }
                  :fullscreen video, :-moz-full-screen video,
                  .__battv_player_fill_frame video {
                    width: 100% !important;
                    height: 100% !important;
                    max-width: 100% !important;
                    max-height: 100% !important;
                    object-fit: contain !important;
                  }
                `;
                (document.head || document.documentElement).appendChild(style);
              } catch (_) {}
            }

            function enableIframeFullscreenAttrs() {
              try {
                const iframes = document.getElementsByTagName("iframe");
                for (let i = 0; i < iframes.length; i++) {
                  const f = iframes[i];
                  if (!f.hasAttribute("allowfullscreen")) {
                    f.setAttribute("allowfullscreen", "true");
                    f.setAttribute("webkitallowfullscreen", "true");
                    f.setAttribute("mozallowfullscreen", "true");
                  }
                  const allow = f.getAttribute("allow") || "";
                  if (!allow.includes("fullscreen")) {
                    f.setAttribute("allow", (allow ? allow + "; " : "") + "fullscreen *; autoplay *; encrypted-media *");
                  }
                }
              } catch (_) {}
            }

            function markFullscreenAncestors(el) {
              let curr = el ? el.parentElement : null;
              while (curr && curr !== document.body && curr !== document.documentElement) {
                curr.classList.add("__battv_fs_ancestor");
                curr = curr.parentElement;
              }
              if (document.documentElement) {
                document.documentElement.classList.add("__battv_lock_scroll");
              }
            }

            function clearCustomFullscreenClasses() {
              try {
                if (document.documentElement) {
                  document.documentElement.classList.remove("__battv_lock_scroll");
                }
                const nodes = document.querySelectorAll(".__battv_iframe_fullscreen, .__battv_player_fill_frame, .__battv_fs_ancestor");
                for (let i = 0; i < nodes.length; i++) {
                  nodes[i].classList.remove("__battv_iframe_fullscreen", "__battv_player_fill_frame", "__battv_fs_ancestor");
                }
              } catch (_) {}
            }

            function onDomFullscreenChanged() {
              const isDomFs = !!(document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement);
              if (!isDomFs) {
                clearCustomFullscreenClasses();
              }
              if (isTopFrame) {
                postToNative({
                  type: "WEB_FULLSCREEN_STATE",
                  enabled: isDomFs
                });
              }
              setTimeout(function () {
                try { window.dispatchEvent(new Event("resize")); } catch (_) {}
              }, 90);
            }

            document.addEventListener("fullscreenchange", onDomFullscreenChanged, true);
            document.addEventListener("mozfullscreenchange", onDomFullscreenChanged, true);

            // 2. Detección y estabilización de vídeos VOD y Directos en vivo (Chaturbate, Twitch, HLS)
            function isLiveOrLongContentVideo(v) {
              if (!v) return false;
              const rect = v.getBoundingClientRect();
              if (rect.width < 180 || rect.height < 100) return false;
              const dur = v.duration;
              if (!Number.isFinite(dur) || dur <= 0) {
                return v.readyState >= 2 || v.currentTime > 0.2;
              }
              return dur >= 90;
            }

            function attachLiveStreamStabilizer(v) {
              if (!v || watchedVideosSet.has(v)) return;
              watchedVideosSet.add(v);
              ensureBridgeConnected();

              const recoverIfStalled = function () {
                try {
                  if (Date.now() < userPausedManuallyUntil) return;
                  const isLive = !Number.isFinite(v.duration) || v.duration > 36000;
                  if (!isLive) return;
                  if (v.paused && !v.ended) {
                    v.play().catch(function () {});
                  }
                  if (v.buffered && v.buffered.length > 0) {
                    const liveEdge = v.buffered.end(v.buffered.length - 1);
                    if (liveEdge - v.currentTime > 6.5) {
                      v.currentTime = Math.max(0, liveEdge - 1.2);
                    }
                  }
                } catch (_) {}
              };

              v.addEventListener("stalled", recoverIfStalled);
              v.addEventListener("waiting", function () {
                setTimeout(recoverIfStalled, 1500);
              });
            }

            function findActiveVideo() {
              const all = document.getElementsByTagName("video");
              if (all.length === 0) return null;
              let best = null;
              let bestScore = -1;
              for (let i = 0; i < all.length; i++) {
                const v = all[i];
                if (!isLiveOrLongContentVideo(v)) continue;
                attachLiveStreamStabilizer(v);
                const r = v.getBoundingClientRect();
                const score = (r.width * r.height) + (v.paused ? 0 : 500000);
                if (score > bestScore) {
                  bestScore = score;
                  best = v;
                }
              }
              return best;
            }

            function getPlayerRootContainer(v) {
              if (!v) return null;
              return v.closest(
                ".jwplayer, .video-js, .plyr, .art-video-player, .fluid_video_wrapper, " +
                ".fp-player, .dplayer, .clappr-player, #player, .player, .video-player, #main_video_container"
              ) || v.parentElement || v;
            }

            function findMainPlayerIframeInCurrentDocument() {
              const iframes = document.getElementsByTagName("iframe");
              let best = null;
              let bestArea = 0;
              for (let i = 0; i < iframes.length; i++) {
                const f = iframes[i];
                const src = (f.getAttribute("src") || "").toLowerCase();
                if (src.includes("vidoomy") || src.includes("viwom") || src.includes("exoclick") ||
                    src.includes("adsterra") || src.includes("doubleclick") || src.includes("disqus") ||
                    src.includes("facebook")) {
                  continue;
                }
                const r = f.getBoundingClientRect();
                const area = r.width * r.height;
                if (r.width >= 240 && r.height >= 135 && area > bestArea) {
                  bestArea = area;
                  best = f;
                }
              }
              return best;
            }

            function enterFullscreenInCurrentFrame() {
              try {
                injectFastTvStyles();
                enableIframeFullscreenAttrs();

                const v = findActiveVideo();
                if (v) {
                  const playerRoot = getPlayerRootContainer(v);
                  if (playerRoot) {
                    playerRoot.classList.add("__battv_player_fill_frame");
                    markFullscreenAncestors(playerRoot);

                    const reqFn = playerRoot.requestFullscreen || playerRoot.mozRequestFullScreen || playerRoot.webkitRequestFullscreen;
                    if (reqFn && !document.fullscreenElement && !document.mozFullScreenElement) {
                      try {
                        const p = reqFn.call(playerRoot);
                        if (p && typeof p.catch === "function") p.catch(function () {});
                      } catch (_) {}
                    }
                  }
                  if (isTopFrame) {
                    postToNative({ type: "WEB_FULLSCREEN_STATE", enabled: true });
                  }
                  setTimeout(function () {
                    try { window.dispatchEvent(new Event("resize")); } catch (_) {}
                  }, 100);
                  return;
                }

                const playerIframe = findMainPlayerIframeInCurrentDocument();
                if (playerIframe) {
                  setTimeout(function () {
                    const alreadyDomFs = !!(document.fullscreenElement || document.mozFullScreenElement);
                    if (!alreadyDomFs) {
                      playerIframe.classList.add("__battv_iframe_fullscreen");
                      markFullscreenAncestors(playerIframe);
                      const reqFn = playerIframe.requestFullscreen || playerIframe.mozRequestFullScreen || playerIframe.webkitRequestFullscreen;
                      if (reqFn) {
                        try {
                          const p = reqFn.call(playerIframe);
                          if (p && typeof p.catch === "function") p.catch(function () {});
                        } catch (_) {}
                      }
                    }
                    if (isTopFrame) {
                      postToNative({ type: "WEB_FULLSCREEN_STATE", enabled: true });
                    }
                    setTimeout(function () {
                      try { window.dispatchEvent(new Event("resize")); } catch (_) {}
                    }, 100);
                  }, 80);
                }
              } catch (_) {}
            }

            function exitFullscreenInCurrentFrame() {
              try {
                clearCustomFullscreenClasses();
                if (document.fullscreenElement && document.exitFullscreen) {
                  document.exitFullscreen().catch(function () {});
                } else if (document.mozFullScreenElement && document.mozCancelFullScreen) {
                  document.mozCancelFullScreen();
                } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                  document.webkitExitFullscreen();
                }
                if (isTopFrame) {
                  postToNative({ type: "WEB_FULLSCREEN_STATE", enabled: false });
                }
                setTimeout(function () {
                  try { window.dispatchEvent(new Event("resize")); } catch (_) {}
                }, 100);
              } catch (_) {}
            }

            function isPlayerFullscreenButton(target) {
              if (!target || !target.closest) return false;
              const btn = target.closest(
                ".jw-icon-fullscreen, .vjs-fullscreen-control, [data-plyr='fullscreen'], " +
                ".art-icon-fullscreen, .fp-fullscreen, .dplayer-full-icon, " +
                "button[class*='fullscreen' i], div[class*='fullscreen' i], " +
                "[aria-label*='fullscreen' i], [aria-label*='pantalla completa' i], " +
                "[title*='fullscreen' i], [title*='pantalla completa' i]"
              );
              return !!btn;
            }

            // 3. Gestión de formularios web para control remoto
            function isEditableTextInput(el) {
              if (!el || el.disabled || el.readOnly) return false;
              const tag = (el.tagName || "").toUpperCase();
              if (tag === "TEXTAREA") return true;
              if (tag === "INPUT") {
                const type = (el.type || "text").toLowerCase();
                return ["text", "search", "email", "url", "tel", "password", "number"].includes(type);
              }
              return el.isContentEditable === true;
            }

            function getAllEditableInputs() {
              const list = Array.from(document.querySelectorAll("input, textarea, [contenteditable='true']"));
              return list.filter(function (el) {
                if (!isEditableTextInput(el)) return false;
                const rect = el.getBoundingClientRect();
                return rect.width > 10 && rect.height > 10;
              });
            }

            function ensureInputId(el) {
              if (!el.dataset.battvInputId) {
                el.dataset.battvInputId = "battv_inp_" + (inputCounter++);
              }
              return el.dataset.battvInputId;
            }

            function findInputById(id) {
              if (!id) return activeInputEl;
              const found = document.querySelector('[data-battv-input-id="' + id + '"]');
              return found || activeInputEl;
            }

            function notifyInputFocus(el) {
              if (!isEditableTextInput(el)) return;
              activeInputEl = el;
              const id = ensureInputId(el);
              const allInputs = getAllEditableInputs();
              const val = el.isContentEditable ? (el.textContent || "") : (el.value || "");
              const placeholder = el.getAttribute("placeholder") || el.getAttribute("aria-label") || el.name || "";
              postToNative({
                type: "WEB_INPUT_FOCUS",
                inputId: id,
                value: val,
                placeholder: placeholder,
                isMultiField: allInputs.length > 1
              });
            }

            document.addEventListener("click", function (e) {
              enableIframeFullscreenAttrs();

              const a = e.target && e.target.closest ? e.target.closest("a") : null;
              if (a && (a.getAttribute("target") || "").toLowerCase() === "_blank") {
                const href = (a.getAttribute("href") || "").trim();
                if (!href || href === "#" || href.startsWith("javascript:")) {
                  e.preventDefault();
                  e.stopPropagation();
                  return;
                }
                try {
                  const dest = new URL(href, location.href);
                  const curHost = location.hostname.replace(/^www\./i, "");
                  const dstHost = dest.hostname.replace(/^www\./i, "");
                  if (dstHost !== curHost && !dstHost.endsWith("." + curHost)) {
                    e.preventDefault();
                    e.stopPropagation();
                    a.remove();
                    return;
                  }
                  a.setAttribute("target", "_self");
                } catch (_) {}
              }

              if (isPlayerFullscreenButton(e.target)) {
                const hasCustomFs = document.querySelector(".__battv_player_fill_frame, .__battv_iframe_fullscreen") !== null;
                const hasDomFs = !!(document.fullscreenElement || document.mozFullScreenElement);
                setTimeout(function () {
                  const nowDomFs = !!(document.fullscreenElement || document.mozFullScreenElement);
                  if (hasCustomFs || hasDomFs) {
                    if (!nowDomFs && hasCustomFs) {
                      postToNative({ type: "REQUEST_UNIFIED_FULLSCREEN", enable: false });
                    }
                  } else if (!nowDomFs) {
                    postToNative({ type: "REQUEST_UNIFIED_FULLSCREEN", enable: true });
                  }
                }, 160);
                return;
              }

              const target = e.target ? e.target.closest("input, textarea, [contenteditable='true']") : null;
              if (target && isEditableTextInput(target)) {
                notifyInputFocus(target);
              }
            }, true);

            function setElementValue(el, value, submit) {
              if (!el) return;
              try {
                el.focus();
                if (el.isContentEditable) {
                  el.textContent = value;
                } else {
                  const proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
                  const setter = Object.getOwnPropertyDescriptor(proto, "value");
                  if (setter && setter.set) {
                    setter.set.call(el, value);
                  } else {
                    el.value = value;
                  }
                }
                el.dispatchEvent(new Event("input", { bubbles: true }));
                el.dispatchEvent(new Event("change", { bubbles: true }));

                if (submit) {
                  const enterDown = new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterPress = new KeyboardEvent("keypress", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterUp = new KeyboardEvent("keyup", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  el.dispatchEvent(enterDown);
                  el.dispatchEvent(enterPress);
                  el.dispatchEvent(enterUp);
                  if (el.form) {
                    if (typeof el.form.requestSubmit === "function") {
                      el.form.requestSubmit();
                    } else {
                      el.form.submit();
                    }
                  }
                }
              } catch (_) {}
            }

            setInterval(function () {
              try {
                if (document.getElementsByTagName("video").length === 0) return;
                const v = findActiveVideo();
                if (!v) return;

                const isPlaying = !v.paused && !v.ended && v.readyState >= 2;
                const rawDur = v.duration;
                const isLive = !Number.isFinite(rawDur) || rawDur <= 0 || rawDur > 36000;
                const dur = isLive ? 0 : rawDur;

                postToNative({
                  type: "VIDEO_STATE",
                  hasVod: !isLive && dur >= 90,
                  isLive: isLive,
                  playing: isPlaying,
                  currentTime: v.currentTime || 0,
                  duration: dur
                });

                const inDomFullscreen = !!(document.fullscreenElement || document.mozFullScreenElement);
                const inCustomFullscreen = document.querySelector(".__battv_player_fill_frame") !== null;
                const now = Date.now();
                if (isPlaying && v.currentTime >= 0.4 && !inDomFullscreen && !inCustomFullscreen &&
                    !promptedVideosSet.has(v) && (now - lastFullscreenPromptMs > 4500)) {
                  promptedVideosSet.add(v);
                  lastFullscreenPromptMs = now;
                  postToNative({
                    type: "VIDEO_PLAY_STARTED_PROMPT_FS",
                    duration: dur,
                    isLive: isLive
                  });
                }
              } catch (_) {}
            }, 1300);

            if (isTopFrame) {
              ensureBridgeConnected();
              function extractMediaMetadata() {
                try {
                  const h1 = document.querySelector("h1, .Title, .entry-title, .episodiotitle, .anime-title");
                  const ogTitle = document.querySelector("meta[property='og:title']");
                  const raw = (h1 ? h1.textContent : (ogTitle ? ogTitle.content : document.title)) || document.title || "";
                  const clean = raw.replace(/\s+/g, " ").trim();
                  if (clean) {
                    postToNative({
                      type: "PAGE_MEDIA_METADATA",
                      rawHeading: clean,
                      pageTitle: document.title || "",
                      url: window.location.href
                    });
                  }
                } catch (_) {}
              }
              window.addEventListener("load", extractMediaMetadata);
            }

            function handleNativeMessage(msg) {
              if (!msg || !msg.type) return;
              if (msg.type === "WEB_INPUT_UPDATE") {
                const el = findInputById(msg.inputId);
                setElementValue(el, msg.value || "", msg.submit === true);
              } else if (msg.type === "WEB_INPUT_COMMIT_ONLY") {
                const el = findInputById(msg.inputId);
                if (el) el.blur();
              } else if (msg.type === "REQUEST_ACTIVE_WEB_INPUT") {
                const active = document.activeElement;
                if (active && isEditableTextInput(active)) {
                  notifyInputFocus(active);
                } else {
                  const all = getAllEditableInputs();
                  if (all.length > 0) notifyInputFocus(all[0]);
                }
              } else if (msg.type === "WEB_FORM_NAVIGATE") {
                const all = getAllEditableInputs();
                if (all.length === 0) return;
                const current = findInputById(msg.inputId);
                let idx = all.indexOf(current);
                if (idx === -1) idx = 0;
                const nextIdx = (idx + (msg.direction || 1) + all.length) % all.length;
                const nextEl = all[nextIdx];
                if (nextEl) {
                  nextEl.focus();
                  notifyInputFocus(nextEl);
                }
              } else if (msg.type === "VIDEO_COMMAND") {
                if (msg.action === "ENTER_FULLSCREEN") {
                  enterFullscreenInCurrentFrame();
                  return;
                }
                if (msg.action === "EXIT_FULLSCREEN") {
                  exitFullscreenInCurrentFrame();
                  return;
                }
                const v = findActiveVideo();
                if (!v) return;
                if (msg.action === "SEEK_TO" && typeof msg.time === "number" && Number.isFinite(v.duration)) {
                  v.currentTime = Math.max(0, Math.min(v.duration || msg.time, msg.time));
                } else if (msg.action === "TOGGLE_PLAY") {
                  if (v.paused) {
                    userPausedManuallyUntil = 0;
                    v.play().catch(function () {});
                  } else {
                    userPausedManuallyUntil = Date.now() + 60000;
                    v.pause();
                  }
                }
              }
            }

            injectFastTvStyles();
            enableIframeFullscreenAttrs();
            window.addEventListener("load", enableIframeFullscreenAttrs);
          })();
          '''

          with open(os.path.join(vm_dir, "battv_tv_helper.js"), "w", encoding="utf-8") as hf:
              hf.write(battv_tv_helper_js.strip() + "\n")

          with open(vm_manifest_path, "r", encoding="utf-8") as mf:
              vm_manifest = json.load(mf)

          perms = vm_manifest.setdefault("permissions", [])
          for p in ["<all_urls>", "storage", "nativeMessaging", "nativeMessagingFromContent", "geckoViewAddons"]:
              if p not in perms:
                  perms.append(p)

          bg = vm_manifest.setdefault("background", {})
          if "page" in bg:
              bg_page_path = os.path.join(vm_dir, bg["page"].lstrip("/"))
              if os.path.exists(bg_page_path):
                  with open(bg_page_path, "r", encoding="utf-8") as bf:
                      html = bf.read()
                  script_tag = '<script src="/preload_shortlinks.js"></script>'
                  if script_tag not in html:
                      if "</body>" in html:
                          html = html.replace("</body>", script_tag + "\n</body>")
                      else:
                          html += "\n" + script_tag
                      with open(bg_page_path, "w", encoding="utf-8") as bf:
                          bf.write(html)
          else:
              bg_scripts = bg.setdefault("scripts", [])
              if "preload_shortlinks.js" not in bg_scripts:
                  bg_scripts.append("preload_shortlinks.js")

          cs_list = vm_manifest.setdefault("content_scripts", [])
          cs_list.append({
              "matches": ["<all_urls>"],
              "js": ["saltarse_enlaces_acortados.user.js"],
              "run_at": "document_start",
              "all_frames": False,
              "match_about_blank": False
          })
          cs_list.append({
              "matches": ["<all_urls>"],
              "js": ["battv_tv_helper.js"],
              "run_at": "document_end",
              "all_frames": True,
              "match_about_blank": False
          })

          with open(vm_manifest_path, "w", encoding="utf-8") as mf:
              json.dump(vm_manifest, mf, indent=2, ensure_ascii=False)

          installed_folders = sorted(os.listdir(EXT_BASE))
          print("Extensiones preparadas en assets/extensions:", installed_folders)
          assert installed_folders == ["popup_blocker", "ublock_origin", "violentmonkey"], \
              f"Error: se encontraron carpetas distintas a las 3 permitidas: {installed_folders}"
          EOF

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version

      - name: Compilar APK Release
        working-directory: android-geckoview
        run: gradle assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Verificar APK generado y comprobar que _locales está empaquetado
        run: |
          ls -lh android-geckoview/app/build/outputs/apk/release/*.apk
          unzip -l android-geckoview/app/build/outputs/apk/release/*.apk | grep "_locales" | head -n 15

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Battv.2-APK
          path: android-geckoview/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
