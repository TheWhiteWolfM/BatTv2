name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 (Evita error de SnakeYAML en GeckoView)
        run: |
          cat << 'EOF' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF

      - name: Generar Motor Nativo v12.0 (Doramasflix 100% funcional, Cortafuegos DramaChino y JKAnime intacto)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import shutil

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)

          SHIELD_DIR = os.path.join(EXT_BASE, "battv_shield")
          os.makedirs(SHIELD_DIR, exist_ok=True)

          manifest = {
              "manifest_version": 2,
              "name": "Bat TV Native Shield & Cinema 60FPS Engine",
              "version": "12.0.0",
              "description": "Cortafuegos estricto en DramaChino/Doramasflix, hidratación Next.js intacta en Doramasflix y compatibilidad total JKAnime.",
              "browser_specific_settings": {
                  "gecko": {
                      "id": "shield@battv.browser",
                      "strict_min_version": "115.0"
                  }
              },
              "permissions": [
                  "<all_urls>",
                  "webRequest",
                  "webRequestBlocking",
                  "storage",
                  "tabs",
                  "nativeMessaging",
                  "nativeMessagingFromContent",
                  "geckoViewAddons"
              ],
              "background": {
                  "scripts": ["background.js"]
              },
              "content_scripts": [
                  {
                      "matches": ["<all_urls>"],
                      "js": ["content_start.js"],
                      "run_at": "document_start",
                      "all_frames": True,
                      "match_about_blank": True
                  }
              ]
          }

          with open(os.path.join(SHIELD_DIR, "manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2, ensure_ascii=False)

          background_js = r'''(function () {
            "use strict";

            // 1. Lista negra curada de redes publicitarias, popups, casas de apuestas y tiendas hijack
