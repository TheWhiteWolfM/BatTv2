name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Actualizar a versionCode 28 (v5.3) y parchar dominios en Kotlin
        run: |
          sed -i 's/\\vert{}\\vert{}/||/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/\\vert{}/|/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/versionCode [0-9]\+/versionCode 28/g' android-geckoview/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "5.3"/g' android-geckoview/app/build.gradle
          sed -i 's/shield_v[0-9]\+@battv.browser/shield_v28@battv.browser/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt
          sed -i 's/battv_shield_v[0-9]\+/battv_shield_v28/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt

          python3 - << 'EOF_PY'
          import re

          main_path = "android-geckoview/app/src/main/java/com/battv/browser/MainActivity.kt"
          with open(main_path, "r", encoding="utf-8") as f:
              code = f.read()
          code = re.sub(
              r"if \(geckoManager\.isKnownAdOrPopupUri\(url\) \|\| \(!isInitialNavigationInProgress && !geckoManager\.isSameOrTrustedNavigationTarget\(currentUrl, url\)\)\)",
              "if (geckoManager.isKnownAdOrPopupUri(url))",
              code
          )
          with open(main_path, "w", encoding="utf-8") as f:
              f.write(code)

          mgr_path = "android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt"
          with open(mgr_path, "r", encoding="utf-8") as f:
              mgr = f.read()

          extra_domains = '"chatmate.tv", "chatmate.com", "t6r-rotator-marketingg.com", "rotator-marketingg.com", "rotator-marketing"'
          if "t6r-rotator-marketingg.com" not in mgr:
              if '"mondiad.com"' in mgr:
                  mgr = mgr.replace('"mondiad.com"', '"mondiad.com", ' + extra_domains, 1)
              elif '"yellowishgather.com"' in mgr:
                  mgr = mgr.replace('"yellowishgather.com"', '"yellowishgather.com", ' + extra_domains, 1)

          mgr = mgr.replace('path.startsWith("/b/")', 'path.contains("/0/P.")')
          with open(mgr_path, "w", encoding="utf-8") as f:
              f.write(mgr)
          EOF_PY

      - name: Generar Motor Nativo Ultraligero v28.0 (JSON-Prune Universal para BYSE y Filemoon + Resto Aislado)
        run: |
          set -e
          EXT_BASE="android-geckoview/app/src/main/assets/extensions"
          SHIELD_DIR="$EXT_BASE/battv_shield_v28"
          rm -rf "$EXT_BASE"
          mkdir -p "$SHIELD_DIR"

          cat << 'EOF_MANIFEST' > "$SHIELD_DIR/manifest.json"
          {
            "manifest_version": 2,
            "name": "Bat TV Native Shield & Cinema 60FPS Engine",
            "version": "28.0.0",
            "description": "Poda JSON universal (adblock_detection/force_disable_adblock) y deteccion dinamica para BYSE y Filemoon en cualquier dominio rotativo.",
            "browser_specific_settings": {
              "gecko": {
                "id": "shield_v28@battv.browser",
                "strict_min_version": "115.0"
              }
            },
            "permissions": [
              "<all_urls>",
              "webRequest",
              "webRequestBlocking",
              "storage",
              "tabs",
              "nativeMessaging",
              "nativeMessagingFromContent",
              "geckoViewAddons"
            ],
            "background": {
              "scripts": ["background.js"]
            },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content_start.js"],
                "run_at": "document_start",
                "all_frames": true,
                "match_about_blank": true
