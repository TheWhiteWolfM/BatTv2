                    el.remove();
                    return;
                  }
                  if (target === "_blank" && href.startsWith("http")) {
                    try {
                      const dstHost = new URL(href, location.href).hostname.toLowerCase().replace(/^www\./, "");
                      if (dstHost !== currentHost && !dstHost.endsWith("." + currentHost)) {
                        el.style.setProperty("display", "none", "important");
                        el.remove();
                        return;
                      }
                    } catch (_) {}
                  }
                }

                // Sin límite estricto de hijos: si un modal o tarjeta tiene el texto del casino 777 / "¡Reclama tu bono!",
                // subir hasta su contenedor directo de body y destruirlo en el acto.
                const txt = (el.textContent || "").trim();
                if (txt.length >= 8 && txt.length <= 380 && hasExactScamPhrase(txt)) {
                  let targetBox = el;
                  while (
                    targetBox.parentElement &&
                    targetBox.parentElement !== document.body &&
                    targetBox.parentElement !== document.documentElement &&
                    !isProtectedLayoutOrPlayer(targetBox.parentElement) &&
                    (targetBox.parentElement.textContent || "").trim().length <= 450
                  ) {
                    targetBox = targetBox.parentElement;
                  }
                  if (!isProtectedLayoutOrPlayer(targetBox)) {
