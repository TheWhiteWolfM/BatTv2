              "manifest_version": 2,
              "name": "Bat TV Native Shield & Cinema 60FPS Engine",
              "version": "13.0.0",
              "description": "Destructor de modales Robot/Casino 777 en DramaChino, soporte completo Next.js en Doramasflix y JKAnime.",
              "browser_specific_settings": {
