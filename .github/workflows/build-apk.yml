name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Actualizar versionCode a 24 (v4.9) y ajustar navegacion inicial en Kotlin
        run: |
          sed -i 's/\\vert{}\\vert{}/||/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/\\vert{}/|/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/versionCode [0-9]\+/versionCode 24/g' android-geckoview/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9"/g' android-geckoview/app/build.gradle
          sed -i 's/shield_v[0-9]\+@battv.browser/shield_v24@battv.browser/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt
          sed -i 's/battv_shield_v[0-9]\+/battv_shield_v24/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt

          python3 - << 'EOF_PY'
          import re
          main_path = "android-geckoview/app/src/main/java/com/battv/browser/MainActivity.kt"
          with open(main_path, "r", encoding="utf-8") as f:
              code = f.read()
          code = re.sub(
              r"if \(geckoManager\.isKnownAdOrPopupUri\(url\) \|\| \(!isInitialNavigationInProgress && !geckoManager\.isSameOrTrustedNavigationTarget\(currentUrl, url\)\)\)",
              "if (geckoManager.isKnownAdOrPopupUri(url))",
              code
          )
          with open(main_path, "w", encoding="utf-8") as f:
              f.write(code)
          EOF_PY

      - name: Generar Motor Nativo Ultraligero v24.0 (Filemoon Activo + Cero Anuncios en Doramasflix)
        run: |
          set -e
          EXT_BASE="android-geckoview/app/src/main/assets/extensions"
          SHIELD_DIR="$EXT_BASE/battv_shield_v24"
          rm -rf "$EXT_BASE"
          mkdir -p "$SHIELD_DIR"

          cat << 'EOF_MANIFEST' > "$SHIELD_DIR/manifest.json"
