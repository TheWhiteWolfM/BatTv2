name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 (Evita error de SnakeYAML en GeckoView)
        run: |
          cat << 'EOF' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF

      - name: Generar Motor Nativo v11.0 (Play en 1 Clic, 0ms Flash de Anuncios y Soporte Doramasflix/JKAnime)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import shutil
          import urllib.request

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)

          SHIELD_DIR = os.path.join(EXT_BASE, "battv_shield")
          os.makedirs(SHIELD_DIR, exist_ok=True)

          # Descargar únicamente la lista verificada de servidores de anuncios puros (Peter Lowe)
          # + nuestra lista curada de redes de popups/scam en sitios de anime y doramas,
          # evitando falsos positivos que bloqueen miniaturas o scripts de Doramasflix.
          compiled_domains = {
              "vidoomy.com", "viwom.com", "wortise.com", "aniview.com", "primis.tech",
              "adinplay.com", "brid.tv", "doubleclick.net", "googlesyndication.com",
              "googleadservices.com", "google-analytics.com", "googletagmanager.com",
              "googletagservices.com", "popads.net", "popcash.net", "propellerads.com",
              "exoclick.com", "magsrv.com", "realsrv.com", "juicyads.com", "adsterra.com",
              "monetag.com", "acscdn.com", "onclickads.net", "hilltopads.net",
              "galaksion.com", "clickadu.com", "adcash.com", "richads.com",
              "admaven.com", "bidgear.com", "trafficjunky.net", "trafficstars.com",
              "tsyndicate.com", "rollerads.com", "evadav.com", "optad360.io",
              "teads.tv", "taboola.com", "outbrain.com", "mgid.com", "revcontent.com",
              "criteo.com", "pubmatic.com", "rubiconproject.com", "openx.net",
              "smartadserver.com", "1xbet.com", "1xstavka.ru", "bet365.com", "mostbet.com",
              "caliente.mx", "codere.mx", "betano.com", "bwin.com", "pin-up.bet",
              "pin-up.casino", "20bet.com", "22bet.com", "melbet.com", "parimatch.com",
              "stake.com", "leon.bet", "1win.pro", "1win.com", "apuestasroyal.com",
              "pushground.com", "yllix.com", "plugrush.com", "adspyglass.com",
              "clksite.com", "clkmon.com", "betteradsystem.com", "blurtsbrerd.com",
              "capsidsflyleaf.com", "skypipevatican.com", "21wiz.com", "aarems.org",
              "twinrdsyn.com", "adsco.re", "a-ads.com", "adskeeper.com", "adskeeper.co.uk",
              "wpadmngr.com", "onmarshtompor.com", "alwingulla.com", "profitablecpmrate.com",
              "highperformanceformat.com", "surfe.pro", "histats.com", "yandex.ru",
              "mc.yandex.ru", "clarity.ms", "bebi.com", "adsbyvli.com", "vlitag.com",
              "adtng.com", "ero-advertising.com", "adform.net", "quantserve.com",
              "scorecardresearch.com", "dtscout.com", "acint.net", "adkernel.com",
              "aliexpress.com", "aliexpress.us", "aliexpress.ru", "alibaba.com",
              "mmstat.com", "aliapp.org", "temu.com", "shein.com", "shopee.com", "lazada.com"
          }

          PROTECTED_KEYWORDS = (
              "jkanime", "jkdesu", "doramasflix", "dramachino", "tudorama",
              "asialiveaction", "kisskh", "chaturbate", "mmcdn", "highwebmedia",
              "google.", "gstatic", "googleapis", "youtube", "ytimg", "cloudflare",
              "jsdelivr", "unpkg", "jquery", "bootstrap", "fontawesome", "jwplayer",
              "jwpcdn", "jwpsrv", "plyr", "videojs", "zencdn", "vimeocdn", "vimeo",
              "dailymotion", "dmcdn", "voe.", "streamtape", "dood", "d000d", "ds2play",
              "filemoon", "streamwish", "wishembed", "vidhide", "mp4upload", "ok.ru",
              "mycdn", "mixdrop", "yourupload", "primeload", "embedshortener",
              "fembed", "uqload", "upstream", "vudeo", "netu", "waaw", "hqq",
              "mega.nz", "mediafire", "akamaized", "akamaihd", "cloudfront", "fastly",
              "fbcdn", "twimg", "imgur", "tmdb", "themoviedb", "github", "gitlab",
              "wp.com", "wordpress", "disqus", "recaptcha", "sweet", "sweetalert",
              "amazonaws", "bunnycdn", "b-cdn", "sibnet", "sendvid", "vk.com"
          )

          def is_safe_to_block(domain):
              if not domain or len(domain) < 4 or "." not in domain:
                  return False
              for kw in PROTECTED_KEYWORDS:
                  if kw in domain:
                      return False
              return True

          plain_domain_re = re.compile(r"^[a-z0-9.-]+\.[a-z]{2,}$")
          try:
              req = urllib.request.Request(
                  "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext",
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  for raw_line in resp.read().decode("utf-8", errors="ignore").splitlines():
                      line = raw_line.strip().lower()
                      if plain_domain_re.match(line) and is_safe_to_block(line):
                          compiled_domains.add(line)
          except Exception as e:
              print("Aviso descargando lista Peter Lowe:", e)

          print(f"Dominios de anuncios verificados: {len(compiled_domains)}")

          manifest = {
              "manifest_version": 2,
              "name": "Bat TV Native Shield & Cinema 60FPS Engine",
              "version": "11.0.0",
              "description": "Bloqueador instantáneo 0ms sin parpadeo, Play al primer clic en JKAnime y carga completa en Doramasflix.",
              "browser_specific_settings": {
                  "gecko": {
                      "id": "shield@battv.browser",
                      "strict_min_version": "115.0"
                  }
              },
              "permissions": [
                  "<all_urls>",
                  "webRequest",
                  "webRequestBlocking",
                  "storage",
                  "tabs",
                  "nativeMessaging",
                  "nativeMessagingFromContent",
                  "geckoViewAddons"
              ],
              "background": {
                  "scripts": ["background.js"]
              },
              "content_scripts": [
                  {
                      "matches": ["<all_urls>"],
                      "js": ["content_start.js"],
                      "run_at": "document_start",
                      "all_frames": True,
                      "match_about_blank": True
                  }
              ]
          }

          with open(os.path.join(SHIELD_DIR, "manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2, ensure_ascii=False)

          domains_json_array = json.dumps(sorted(list(compiled_domains)))

          background_js_template = r'''(function () {
            "use strict";

            const COMPILED_AD_DOMAINS = new Set(__DOMAINS_JSON__);

            // Firmas exactas de scripts de popunders, Adsterra Social Bar (32-hex), In-Page Push y banners de apuestas
            const AD_URL_REGEX = /(\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{32}\.js|\/[0-9a-f]{32}\/invoke\.js|\/invoke\.js\?|\/(popunder|tabunder|clickunder|socialbar|inpagepush|adframe|adscript|pop\.js|pop2\.js)([\/._?-]|$)|\/(apu|afu)\.php(\?|$)|[?&](utm_source=pop|ad_type=pop|ali_trackid=|aff_fcid=|aff_fsk=|clickid=)|1xbet|mostbet|bet365|apuestasroyal)/i;

            function isDomainBlocked(hostname) {
              let curr = (hostname || "").toLowerCase().replace(/^www\./, "");
              while (curr && curr.includes(".")) {
                if (COMPILED_AD_DOMAINS.has(curr)) return true;
                const dotIdx = curr.indexOf(".");
                if (dotIdx === -1) break;
                curr = curr.slice(dotIdx + 1);
              }
              return false;
            }

            if (typeof browser !== "undefined" && browser.webRequest && browser.webRequest.onBeforeRequest) {
              browser.webRequest.onBeforeRequest.addListener(
                function (details) {
                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    // REGLA CRÍTICA PARA DORAMASFLIX Y MINIATURAS:
                    // Nunca bloquear imágenes (miniaturas/portadas) salvo que vengan de 1xbet/mostbet/adsterra/exoclick
                    if (details.type === "image" || details.type === "imageset") {
                      if (/1xbet|mostbet|bet365|apuestasroyal|exoclick|adsterra|juicyads/i.test(rawUrl)) {
                        return { cancel: true };
                      }
                      return {};
                    }

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");

                    if (isDomainBlocked(reqHost) || AD_URL_REGEX.test(rawUrl)) {
                      if (details.type === "script") {
                        return { redirectUrl: "data:text/javascript;charset=utf-8," };
                      }
                      return { cancel: true };
                    }
                  } catch (_) {}
                  return {};
                },
                { urls: ["<all_urls>"] },
                ["blocking"]
              );
            }

            if (typeof browser !== "undefined" && browser.tabs && browser.tabs.onCreated) {
              browser.tabs.onCreated.addListener(function (tab) {
                if (tab && tab.openerTabId !== undefined && tab.id !== undefined) {
                  browser.tabs.remove(tab.id).catch(function () {});
                }
              });
            }
          })();
          '''

          background_js = background_js_template.replace("__DOMAINS_JSON__", domains_json_array)
          with open(os.path.join(SHIELD_DIR, "background.js"), "w", encoding="utf-8") as bf:
              bf.write(background_js.strip() + "\n")

          content_start_js = r'''(function () {
            "use strict";
            if (window.__battvNativeShieldActive) return;
            window.__battvNativeShieldActive = true;

            const isTopFrame = (window === window.top);
            const currentHost = (window.location.hostname || "").toLowerCase().replace(/^www\./, "");
            const isChaturbate = currentHost === "chaturbate.com" || currentHost.endsWith(".chaturbate.com");

            // 1. Inyección inmediata en el Main World (document_start):
            //    - Intercepta EventTarget.prototype.addEventListener para IMPEDIR que los reproductores
            //      de JKAnime (Desu/Nozomi/Streamwish/Voe) y DramaChino registren eventos click/mousedown
            //      en window/document/body que absorben tus primeros 2 o 3 clics sobre el botón Play.
            //    - Neutraliza window.open() devolviendo un objeto ventana simulado.
            const injectMainWorldEngine = function () {
              try {
                const s = document.createElement("script");
                if (isChaturbate) {
                  s.textContent = `(function(){
                    try {
                      const origCanPlay = HTMLMediaElement.prototype.canPlayType;
                      HTMLMediaElement.prototype.canPlayType = function(type) {
                        if (type && /mpegurl/i.test(type)) return "";
                        return origCanPlay.apply(this, arguments);
                      };
                    } catch(_) {}
                  })();`;
                } else {
                  s.textContent = `(function(){
                    try {
                      function createDummyPopupWindow(targetUrl) {
                        const resolvedUrl = (typeof targetUrl === "string" && targetUrl.length > 0) ? targetUrl : "https://localhost/";
                        const fakeLoc = {
                          href: resolvedUrl,
                          assign: function(u) { this.href = u; },
                          replace: function(u) { this.href = u; },
                          reload: function() {},
                          toString: function() { return this.href; }
                        };
                        const winObj = {
                          closed: false,
                          opener: window,
                          location: fakeLoc,
                          document: {
                            write: function() {},
                            writeln: function() {},
                            open: function() { return this; },
                            close: function() {},
                            body: { appendChild: function() {}, style: {} }
                          },
                          focus: function() {},
                          blur: function() {},
                          close: function() { this.closed = true; },
                          postMessage: function() {},
                          addEventListener: function() {},
                          removeEventListener: function() {},
                          setTimeout: function() { return 1; },
                          clearTimeout: function() {}
                        };
                        winObj.window = winObj;
                        winObj.self = winObj;
                        winObj.top = winObj;
                        return winObj;
                      }

                      window.open = function(url) {
                        if (url && typeof url === "string" && url.startsWith(location.origin) && window === window.top) {
                          location.href = url;
                        }
                        return createDummyPopupWindow(url);
                      };

                      const origAnchorClick = HTMLAnchorElement.prototype.click;
                      HTMLAnchorElement.prototype.click = function() {
                        try {
                          const href = (this.getAttribute("href") || "").trim();
                          const target = (this.getAttribute("target") || "").toLowerCase();
                          if (window !== window.top || target === "_blank" || (href.startsWith("http") && !href.includes(location.hostname))) {
                            return;
                          }
                        } catch (_) {}
                        return origAnchorClick.apply(this, arguments);
                      };

                      // BLOQUEO DE ESCUCHADORES DE POPUNDER QUE ROBAN EL CLIC DE PLAY:
                      // Impide que los scripts publicitarios registren capturadores de clic en window o document
                      const origAddEventListener = EventTarget.prototype.addEventListener;
                      const INTERCEPTED_EVENTS = new Set(["click", "mousedown", "mouseup", "pointerdown", "pointerup", "touchstart", "touchend"]);
                      const AD_LISTENER_REGEX = /window\.open|\.open\s*\(|popunder|tabunder|clickunder|_blank|BetterJsPop|jsPopunder|atOptions|_pop|createElement\s*\(\s*['"]a['"]\s*\)/i;

                      EventTarget.prototype.addEventListener = function(type, listener, options) {
                        try {
                          if (INTERCEPTED_EVENTS.has(type) && typeof listener === "function") {
                            const fnStr = Function.prototype.toString.call(listener);
                            if (AD_LISTENER_REGEX.test(fnStr)) {
                              return;
                            }
                            // Dentro de iframes de reproductores, bloquear listeners globales en window/document
                            // que intenten detener la propagación del clic hacia el botón Play
                            if (window !== window.top && (this === window || this === document || this === document.body || this === document.documentElement)) {
                              const wrappedListener = function(ev) {
                                try {
                                  ev.stopPropagation = function() {};
                                  ev.stopImmediatePropagation = function() {};
                                } catch (_) {}
                                return listener.apply(this, arguments);
                              };
                              return origAddEventListener.call(this, type, wrappedListener, options);
                            }
                          }
                        } catch (_) {}
                        return origAddEventListener.apply(this, arguments);
                      };

                      const origAttachShadow = Element.prototype.attachShadow;
                      if (origAttachShadow) {
                        Element.prototype.attachShadow = function(init) {
                          const root = origAttachShadow.call(this, { mode: "open" });
                          this.setAttribute("data-battv-shadow", "1");
                          return root;
                        };
                      }
                    } catch(_) {}
                  })();`;
                }
                (document.head || document.documentElement).appendChild(s);
                s.remove();
              } catch (_) {}
            };

            if (document.documentElement) {
              injectMainWorldEngine();
            } else {
              document.addEventListener("DOMContentLoaded", injectMainWorldEngine, { once: true });
            }

            // 2. Desacortador automático (Exclusivo para dominios acortadores externos)
            if (isTopFrame && !isChaturbate) {
              const SHORTENER_HOSTS = [
                "ouo.io", "ouo.press", "exe.io", "exey.io", "fc.lc", "fc-lc.com",
                "shrtfly.com", "shrinke.me", "shrinkme.io", "linkvertise.com",
                "adfoc.us", "bc.vc", "shorte.st", "gestyy.com", "destyy.com",
                "corneey.com", "clk.sh", "clk.asia", "oko.sh", "za.gl",
                "cuty.io", "cety.app", "gplinks.co", "droplink.co", "tnshort.net",
                "rekonise.com", "sub2unlock.com", "boost.ink", "mboost.me",
                "short-jambo.com", "uii.io", "mitly.us"
              ];

              function tryDecodeBase64Url(str) {
                try {
                  const clean = decodeURIComponent(str).trim().replace(/-/g, "+").replace(/_/g, "/");
                  const decoded = atob(clean).trim();
                  if (/^https?:\/\/[^\s"']+$/i.test(decoded)) return decoded;
                } catch (_) {}
                return null;
              }

              try {
                const isShortener = SHORTENER_HOSTS.some(function (d) {
                  return currentHost === d || currentHost.endsWith("." + d);
                });
                if (isShortener) {
                  const params = new URLSearchParams(window.location.search);
                  const keys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                  for (let i = 0; i < keys.length; i++) {
                    const val = params.get(keys[i]);
                    if (!val) continue;
                    if (/^https?:\/\//i.test(val)) {
                      window.location.replace(val);
                      return;
                    }
                    const b64 = tryDecodeBase64Url(val);
                    if (b64) {
                      window.location.replace(b64);
                      return;
                    }
                  }
                }
              } catch (_) {}
            }

            // 3. Limpieza instantánea (0ms sin parpadeo) de anuncios de esquina, capas invisibles sobre Play
            //    y modales de "CONFIRMA QUE NO ERES UN ROBOT" / "BONUS €1500"
            const EXACT_SCAM_PHRASES = [
              "confirma que no eres un robot",
              "haz clic en el botón",
              "haz clic en \"más\"",
              "haz clic en 'más'",
              "transferir dinero",
              "retirar dinero",
              "disponible €",
              "€1500",
              "reclama tu bono",
              "ruleta mundial",
              "empieza a ganar",
              "donde juegan los grandes",
              "apuestas royal",
              "bono de bienvenida",
              "primeros 4 depósitos",
              "cada apuesta, mil emociones",
              "limpia tu unknown"
            ];

            function hasExactScamPhrase(str) {
              if (!str) return false;
              const lower = str.toLowerCase();
              for (let i = 0; i < EXACT_SCAM_PHRASES.length; i++) {
                if (lower.includes(EXACT_SCAM_PHRASES[i])) return true;
              }
              return false;
            }

            function isProtectedPlayerOrLayoutElement(el) {
              if (!el || !el.tagName) return true;
              const tag = el.tagName.toUpperCase();
              if (tag === "VIDEO" || tag === "BODY" || tag === "HTML" || tag === "MAIN" || tag === "HEADER" || tag === "NAV") {
                return true;
              }
              const id = (el.id || "").toLowerCase();
              if (id === "video_box" || id === "pframe" || id === "player" || id === "main_video_container" ||
                  id === "__next" || id === "app" || id === "root" || id === "episodes-content") {
                return true;
              }
              const cls = (typeof el.className === "string") ? el.className.toLowerCase() : "";
              if (cls.includes("servers") || cls.includes("player") || cls.includes("jw-") ||
                  cls.includes("vjs-") || cls.includes("plyr") || cls.includes("navbar") ||
                  cls.includes("header") || cls.includes("container")) {
                return true;
              }
              if (el.querySelector && el.querySelector(
                  "video, #video_box, #pframe, .player_conte, .servers, .bg-servers, " +
                  "iframe[src*='jkplayer'], iframe[src*='um.php'], iframe[src*='nozomi'], " +
                  "iframe[src*='desu'], iframe[src*='embedshortener'], iframe[src*='primeload'], " +
                  "iframe[src*='voe'], iframe[src*='dood'], iframe[src*='streamtape'], iframe[src*='streamwish']"
              )) {
                return true;
              }
              return false;
            }

            // Evalúa un único nodo recién insertado en el DOM y lo elimina ANTES de que se pinte en pantalla (0ms flash)
            function inspectAndNeutralizeAdNode(el) {
              if (!el || el.nodeType !== 1 || isChaturbate) return;
              try {
                if (isProtectedPlayerOrLayoutElement(el)) return;

                // 1. Si es un host de Shadow DOM con anuncio de esquina o Bonus
                if (el.hasAttribute("data-battv-shadow") && el.shadowRoot) {
                  if (!el.shadowRoot.querySelector("video")) {
                    el.style.setProperty("display", "none", "important");
                    el.remove();
                    return;
                  }
                }

                // 2. Si es un enlace <a target="_blank"> hacia un dominio externo o capa vacía
                if (el.tagName === "A") {
                  if (el.classList.contains("servers") || el.closest(".servers, .bg-servers, .dropdown-menu")) {
                    el.removeAttribute("target");
                    return;
                  }
                  const target = (el.getAttribute("target") || "").toLowerCase();
                  const href = (el.getAttribute("href") || "").trim();
                  if (!isTopFrame && (target === "_blank" || (href && !href.startsWith("#") && !href.startsWith("javascript:")))) {
                    el.style.setProperty("display", "none", "important");
                    el.remove();
                    return;
                  }
                  if (target === "_blank" && href.startsWith("http")) {
                    try {
                      const dstHost = new URL(href, location.href).hostname.toLowerCase().replace(/^www\./, "");
                      if (dstHost !== currentHost && !dstHost.endsWith("." + currentHost)) {
                        el.style.setProperty("display", "none", "important");
                        el.remove();
                        return;
                      }
                    } catch (_) {}
                  }
                }

                // 3. Si contiene texto de "CONFIRMA QUE NO ERES UN ROBOT" / "BONUS €1500" / "Reclama tu bono"
                if (el.children.length <= 14) {
                  const txt = (el.textContent || "").trim();
                  if (txt.length >= 8 && txt.length <= 360 && hasExactScamPhrase(txt)) {
                    el.style.setProperty("display", "none", "important");
                    el.remove();
                    return;
                  }
                }

                // 4. Detector de anuncios flotantes en las esquinas (JKAnime / DramaChino) y capas transparentes sobre el reproductor:
                //    Si es hijo directo de <body> (o dentro de un iframe de reproductor) con position: fixed o z-index gigante
                if (el.parentElement === document.body || !isTopFrame) {
                  const cs = window.getComputedStyle(el);
                  const pos = cs.position;
                  const zIdx = parseInt(cs.zIndex, 10) || 0;

                  if (pos === "fixed" || pos === "sticky" || (pos === "absolute" && zIdx >= 999)) {
                    const rect = el.getBoundingClientRect();
                    // Caso A: Anuncio flotante en una esquina (como en JKAnime)
                    if (pos === "fixed" && rect.width > 20 && rect.width < 520 && rect.height > 20 && rect.height < 420) {
                      el.style.setProperty("display", "none", "important");
                      el.remove();
                      return;
                    }
                    // Caso B: Capa transparente de clickjacking colocada encima del botón Play
                    const opacity = parseFloat(cs.opacity);
                    const bg = cs.backgroundColor || "";
                    const isTransparent = (opacity < 0.12) || bg === "transparent" || bg === "rgba(0, 0, 0, 0)";
                    if (isTransparent && zIdx >= 50 && (el.textContent || "").trim().length === 0) {
                      el.style.setProperty("pointer-events", "none", "important");
                      el.style.setProperty("display", "none", "important");
                      el.remove();
                      return;
                    }
                  }
                }
              } catch (_) {}
            }

            function sweepExistingAdNodes() {
              if (isChaturbate || !document.body) return;
              try {
                if (!isTopFrame && !document.querySelector("video")) {
