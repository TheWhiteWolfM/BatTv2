name: Build Bat TV Next (GeckoView mas reciente)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/build-next.yml"
      - ".github/workflows/build-apk.yml"
      - "android-geckoview/**"
  workflow_dispatch:
    inputs:
      gecko_version:
        description: "Version de GeckoView (latest = la mas nueva disponible)"
        required: false
        default: "latest"

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GECKO_INPUT: ${{ github.event.inputs.gecko_version || 'latest' }}

jobs:
  build-apk:
    name: Compilar Bat TV Next (GeckoView nuevo / armeabi-v7a / JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-geckoview

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Preparar proyecto y herramientas mas recientes (AGP, Gradle, Kotlin)
        shell: bash
        run: |
          set +o pipefail
          set -e
          # Conservar MainActivity.kt versionada en android-geckoview/app/src/main/java/com/battv/browser.
          rm -rf app/src/main/kotlin app/src/main/res
          MAIN_KT="app/src/main/java/com/battv/browser/MainActivity.kt"
          if [ ! -s "$MAIN_KT" ]; then
            echo "::error::No se encontró MainActivity.kt en: $(pwd)/$MAIN_KT"
            echo "Archivos Kotlin disponibles:"
            find app/src/main/java -type f -name '*.kt' -print || true
            exit 1
          fi
          mkdir -p app/src/main/java/com/battv/browser
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/extensions/ublock
          mkdir -p app/src/main/assets/extensions/violentmonkey
          mkdir -p app/src/main/assets/extensions/battv_scripts
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        maven { url "https://maven.mozilla.org/maven2/" }' \
            '    }' \
            '}' \
            'rootProject.name = "BatTV"' \
            'include ":app"' > settings.gradle
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'kotlin.code.style=official' \
            'android.suppressUnsupportedCompileSdk=34,35,36,37' > gradle.properties

          resolve() {
          python3 - "$@" <<'PYEOF'
          import sys, re, urllib.request
          url, pattern, fallback = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              xml = urllib.request.urlopen(url, timeout=60).read().decode()
              vs = [v for v in re.findall(r'<version>([^<]+)</version>', xml) if re.fullmatch(pattern, v)]
              key = lambda v: tuple(int(x) for x in v.split('.'))
              print(max(vs, key=key) if vs else fallback)
          except Exception:
              print(fallback)
          PYEOF
          }
          resolve_gradle() {
          python3 - "$@" <<'PYEOF'
          import sys, re, json, urllib.request
          fallback = sys.argv[1]
          try:
              data = json.load(urllib.request.urlopen('https://services.gradle.org/versions/all', timeout=60))
              vs = [d['version'] for d in data if re.fullmatch(r'8\.\d+(\.\d+)?', d['version']) and not d.get('broken')]
              key = lambda v: tuple(int(x) for x in (v.split('.') + ['0'])[:3])
              print(max(vs, key=key) if vs else fallback)
          except Exception:
              print(fallback)
          PYEOF
          }
          AGP_VER=$(resolve "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml" '8\.[0-9]+\.[0-9]+' 8.13.0)
          KGP_VER=$(resolve "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml" '2\.2\.[0-9]+' 2.2.21)
          GRADLE_VER=$(resolve_gradle 8.14.3)
          echo "Herramientas: AGP $AGP_VER | Kotlin $KGP_VER | Gradle $GRADLE_VER"
          {
            echo "AGP_VER=$AGP_VER"
            echo "KGP_VER=$KGP_VER"
            echo "GRADLE_VER=$GRADLE_VER"
          } >> "${GITHUB_ENV:-/dev/null}"

          cat > build.gradle <<EOF
          plugins {
              id "com.android.application" version "$AGP_VER" apply false
              id "org.jetbrains.kotlin.android" version "$KGP_VER" apply false
          }
          EOF
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:installLocation="auto">' \
            '' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' \
            '    <uses-permission android:name="android.permission.WAKE_LOCK" />' \
            '' \
            '    <uses-feature' \
            '        android:name="android.software.leanback"' \
            '        android:required="false" />' \
            '    <uses-feature' \
            '        android:name="android.hardware.touchscreen"' \
            '        android:required="false" />' \
            '    <uses-feature' \
            '        android:name="android.hardware.faketouch"' \
            '        android:required="false" />' \
            '' \
            '    <application' \
            '        android:allowBackup="false"' \
            '        android:extractNativeLibs="true"' \
            '        android:banner="@drawable/tv_banner"' \
            '        android:hardwareAccelerated="true"' \
            '        android:icon="@drawable/ic_bat_logo"' \
            '        android:roundIcon="@drawable/ic_bat_logo"' \
            '        android:label="Bat TV Next"' \
            '        android:largeHeap="false"' \
            '        android:supportsRtl="true"' \
            '        android:usesCleartextTraffic="true"' \
            '        android:theme="@style/Theme.AppCompat.NoActionBar">' \
            '' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:banner="@drawable/tv_banner"' \
            '            android:icon="@drawable/ic_bat_logo"' \
            '            android:roundIcon="@drawable/ic_bat_logo"' \
            '            android:label="Bat TV Next"' \
            '            android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"' \
            '            android:exported="true"' \
            '            android:hardwareAccelerated="true"' \
            '            android:screenOrientation="landscape"' \
            '            android:windowSoftInputMode="stateHidden|adjustNothing">' \
            '' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' \
            '            </intent-filter>' \
            '' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.VIEW" />' \
            '                <category android:name="android.intent.category.DEFAULT" />' \
            '                <category android:name="android.intent.category.BROWSABLE" />' \
            '                <data android:scheme="http" />' \
            '                <data android:scheme="https" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '' \
            '    </application>' \
            '' \
            '</manifest>' > app/src/main/AndroidManifest.xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <item>' \
            '        <shape android:shape="rectangle">' \
            '            <size android:width="320dp" android:height="180dp" />' \
            '            <gradient' \
            '                android:angle="135"' \
            '                android:startColor="#0B0F29"' \
            '                android:centerColor="#1E1145"' \
            '                android:endColor="#3B0D4A"' \
            '                android:type="linear" />' \
            '        </shape>' \
            '    </item>' \
            '    <item' \
            '        android:width="154dp"' \
            '        android:height="154dp"' \
            '        android:drawable="@drawable/ic_bat_logo"' \
            '        android:gravity="center" />' \
            '</layer-list>' > app/src/main/res/drawable/tv_banner.xml
          # La clave de firma se lee de GitHub Secrets durante la compilación.
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          def geckoVer = project.findProperty("geckoVer")
          def minSdkVer = (project.findProperty("minSdkVer") ?: "26").toString().toInteger()
          def buildNum = (project.findProperty("buildNum") ?: "1").toString().toInteger()
          def kotlinLang = (project.findProperty("kotlinLang") ?: "default").toString()
          def releaseStore = System.getenv("BATTV_KEYSTORE_PATH")
          def releaseStorePassword = System.getenv("BATTV_KEYSTORE_PASSWORD")
          def releaseKeyAlias = System.getenv("BATTV_KEY_ALIAS")
          def releaseKeyPassword = System.getenv("BATTV_KEY_PASSWORD")

          android {
              namespace "com.tvbrowser.gecko"
              compileSdk 36

              defaultConfig {
                  applicationId "com.battv.browser.next"
                  minSdk minSdkVer
                  targetSdk 34
                  versionCode 2000 + buildNum
                  versionName "Next-" + geckoVer
                  resConfigs "es"
                  ndk {
                      abiFilters "armeabi-v7a"
                  }
              }
              signingConfigs {
                  if (releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                      release {
                          storeFile file(releaseStore)
                          storePassword releaseStorePassword
                          keyAlias releaseKeyAlias
                          keyPassword releaseKeyPassword
                          v1SigningEnabled true
                          v2SigningEnabled true
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      if (releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                          signingConfig signingConfigs.release
                      } else {
                          signingConfig signingConfigs.debug
                      }
                  }
                  debug {
                      signingConfig signingConfigs.debug
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              aaptOptions {
                  noCompress "ja"
                  ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
              }
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
                  resources {
                      excludes += ["META-INF/*.kotlin_module", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/AL2.0", "META-INF/LGPL2.1", "DebugProbesKt.bin", "kotlin/**"]
                  }
              }
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  if (kotlinLang == "1.9") {
                      languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)
                      apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)
                  }
              }
          }

          // Evita que un minCompileSdk mas alto de GeckoView/androidx tumbe el build
          tasks.configureEach { t ->
              if (t.name.startsWith("check") && t.name.endsWith("AarMetadata")) {
                  t.enabled = false
              }
          }

          dependencies {
              implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:${geckoVer}"
              implementation "androidx.core:core-ktx:1.16.0"
              implementation "androidx.appcompat:appcompat:1.7.0"
          }
          EOF

      - name: 4. Generar Nuevo Logo Circular de Dramas Asiaticos y Multimedia
        shell: bash
        run: |
          set -e
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' | base64 -d | xz -d > app/src/main/res/drawable/ic_bat_logo.png

      - name: 5. Usar MainActivity.kt versionada en android-geckoview
        shell: bash
        run: |
          set -e
          echo "Directorio de trabajo: $(pwd)"
          if [ ! -s app/src/main/java/com/battv/browser/MainActivity.kt ]; then
            echo "::error::No se encontró MainActivity.kt en: $(pwd)/app/src/main/java/com/battv/browser/"
            find app/src/main/java -type f -name '*.kt' -print || true
            exit 1
          fi
          echo "Se conserva la MainActivity.kt versionada en android-geckoview."

      - name: 6. Generar Motor de Scripts Multimedia de Bat TV 20.32
        shell: bash
        run: |
          set +o pipefail
          set -e
          printf '%s\n' \
            '{' \
            '  "manifest_version": 2,' \
            '  "name": "Bat TV Built-in Userscripts",' \
            '  "version": "20.32.0",' \
            '  "description": "Cinema 60FPS & 1080p60 Live Stream Stabilizer + Native TV Keyboard Search Bridge + Anti-Tab-Under Shield.",' \
            '  "browser_specific_settings": {' \
            '    "gecko": {' \
            '      "id": "battv-scripts@battv.local"' \
            '    }' \
            '  },' \
            '  "permissions": [' \
            '    "<all_urls>",' \
            '    "storage",' \
            '    "geckoViewAddons",' \
            '    "nativeMessaging",' \
            '    "nativeMessagingFromContent"' \
            '  ],' \
            '  "content_scripts": [' \
            '    {' \
            '      "matches": ["<all_urls>"],' \
            '      "exclude_matches": [' \
            '        "*://*.cloudflare.com/*",' \
            '        "*://challenges.cloudflare.com/*"' \
            '      ],' \
            '      "js": ["userscripts_bundle.js"],' \
            '      "run_at": "document_start",' \
            '      "all_frames": true' \
            '    }' \
            '  ]' \
            '}' > app/src/main/assets/extensions/battv_scripts/manifest.json
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' | base64 -d | xz -d > app/src/main/assets/extensions/battv_scripts/userscripts_bundle.js

      - name: 6b. Preinstalar y Acelerar uBlock Origin y Violentmonkey
        shell: bash
        run: |
          set +o pipefail
          set -e
          curl -fL --retry 3 "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi" -o /tmp/ublock.xpi
          unzip -q -o /tmp/ublock.xpi -d app/src/main/assets/extensions/ublock/ || true
          rm -rf app/src/main/assets/extensions/ublock/META-INF
          if [ -d "app/src/main/assets/extensions/ublock/_locales" ]; then
            find app/src/main/assets/extensions/ublock/_locales -mindepth 1 -maxdepth 1 -type d ! -name 'es*' ! -name 'en*' -exec rm -rf {} + || true
          fi
          find app/src/main/assets/extensions/ublock -type f \( -name "*.map" -o -name "*.md" -o -name "LICENSE*" -o -name "*.txt.gz" \) -delete || true

          curl -fL --retry 3 "https://addons.mozilla.org/firefox/downloads/latest/violentmonkey/latest.xpi" -o /tmp/violentmonkey.xpi
          unzip -q -o /tmp/violentmonkey.xpi -d app/src/main/assets/extensions/violentmonkey/ || true
          rm -rf app/src/main/assets/extensions/violentmonkey/META-INF
          if [ -d "app/src/main/assets/extensions/violentmonkey/_locales" ]; then
            find app/src/main/assets/extensions/violentmonkey/_locales -mindepth 1 -maxdepth 1 -type d ! -name 'es*' ! -name 'en*' -exec rm -rf {} + || true
          fi
          find app/src/main/assets/extensions/violentmonkey -type f \( -name "*.map" -o -name "*.md" -o -name "LICENSE*" \) -delete || true

          python3 - <<'PYEOF'
          import json, os, re

          base = 'app/src/main/assets/extensions/ublock'

          # 1) Desactivar listas pesadas no publicitarias para ahorrar RAM en Google TV / Onn TV (conservando intactos todos los filtros de anuncios y popups).
          path = os.path.join(base, 'assets', 'assets.json')
          try:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              for key in ('urlhaus-1',):
                  if isinstance(data.get(key), dict):
                      data[key]['off'] = True
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              print('uBO: URLhaus desactivada por defecto')
          except Exception as e:
              print('uBO: assets.json sin cambios:', e)

          # 2) A甯絘dir reglas de aceleraci璐竛 directa para reproductores (PrimeLoad, VOE, Filemoon, StreamTape, Doramasflix, DramaChino)
          qf_path = os.path.join(base, 'assets', 'ublock', 'quick-fixes.txt')
          extra_rules = """
          ! Aceleracion de reproductores en Bat TV
          @@||doramasflix.io^$ghide
          @@||dramachino.com^$ghide
          @@||voe.sx^$ghide
          @@||filemoon.sx^$ghide
          @@||filemoon.to^$ghide
          @@||streamtape.com^$ghide
          @@||streamtape.to^$ghide
          @@||primeload.*^$ghide
          """
          try:
              if os.path.exists(qf_path):
                  with open(qf_path, 'a', encoding='utf-8') as f:
                      f.write('\n' + extra_rules.strip() + '\n')
                  print('uBO: Reglas de aceleraci璐竛 de reproductores inyectadas')
          except Exception as e:
              print('uBO: quick-fixes.txt sin cambios:', e)

          # 3) Desactivar cnameUncloakEnabled con regex compatible y mantener suspendUntilListsAreLoaded activo para carga limpia y completa.
          path = os.path.join(base, 'js', 'background.js')
          try:
              with open(path, encoding='utf-8') as f:
                  src = f.read()
              src = re.sub(r'cnameUncloakEnabled:\s*(true|!0)', 'cnameUncloakEnabled: false', src)
              src = re.sub(r'selfieDelayInSeconds:\s*\d+', 'selfieDelayInSeconds: 15', src)
              src = re.sub(r'autoUpdateDelayAfterLaunch:\s*\d+', 'autoUpdateDelayAfterLaunch: 1800', src)
              src = re.sub(r'autoUpdateAssetFetchPeriod:\s*\d+', 'autoUpdateAssetFetchPeriod: 30', src)
              src = re.sub(r'autoUpdatePeriod:\s*\d+', 'autoUpdatePeriod: 3', src)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(src)
              print('uBO: background.js optimizado')
          except Exception as e:
              print('uBO: background.js sin cambios:', e)
          PYEOF

      - name: 7. Compilar con la GeckoView mas nueva (reintenta con otras si una falla)
        shell: bash
        run: |
          set +o pipefail
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

          curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp/
          GRADLE_BIN="/tmp/gradle-${GRADLE_VER}/bin/gradle"

          curl -fsL --retry 3 "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/maven-metadata.xml" -o /tmp/gecko_metadata.xml
          python3 - <<'PYEOF' > /tmp/gecko_candidates.txt
          import re, os, sys
          inp = os.environ.get('GECKO_INPUT', 'latest').strip()
          xml = open('/tmp/gecko_metadata.xml', encoding='utf-8').read()
          vs = sorted(set((int(a), int(b), c) for a, b, c in re.findall(r'<version>(\d+)\.(\d+)\.(\d{14})</version>', xml)))
          fmt = lambda t: '%d.%d.%s' % t
          open('/tmp/gecko_recent.txt', 'w').write('\n'.join(fmt(t) for t in vs[-12:][::-1]) + '\n')
          if inp and inp.lower() != 'latest':
              print(inp)
              sys.exit(0)
          out = []
          if vs:
              top = vs[-1]
              out.append(fmt(top))
              older = [t for t in vs if t[0] <= top[0] - 3]
              if older:
                  out.append(fmt(older[-1]))
          base = [t for t in vs if t[0] <= 130]
          out.append(fmt(base[-1]) if base else '130.0.20241007143137')
          seen = []
          for v in out:
              if v not in seen:
                  seen.append(v)
          print('\n'.join(seen))
          PYEOF
          echo "Candidatas de GeckoView (en orden):"
          cat /tmp/gecko_candidates.txt
          [ -s /tmp/gecko_candidates.txt ] || { echo "::error::No se pudo leer la lista de versiones de GeckoView"; exit 1; }

          MAIN_KT="app/src/main/java/com/battv/browser/MainActivity.kt"
          test -s "$MAIN_KT" || { echo "::error::No existe $MAIN_KT"; exit 1; }
          cp "$MAIN_KT" /tmp/MainActivity.orig.kt
          if [ -n "${{ secrets.BATTV_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.BATTV_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.BATTV_KEY_ALIAS }}" ] && [ -n "${{ secrets.BATTV_KEY_PASSWORD }}" ]; then
            printf '%s' "${{ secrets.BATTV_KEYSTORE_BASE64 }}" | base64 -d > /tmp/battv-release.jks
            export BATTV_KEYSTORE_PATH=/tmp/battv-release.jks
            export BATTV_KEYSTORE_PASSWORD="${{ secrets.BATTV_KEYSTORE_PASSWORD }}"
            export BATTV_KEY_ALIAS="${{ secrets.BATTV_KEY_ALIAS }}"
            export BATTV_KEY_PASSWORD="${{ secrets.BATTV_KEY_PASSWORD }}"
          else
            echo "No se configuró una firma privada; se utilizará la firma debug de Android."
          fi
          SUCCESS=0
          GECKO_USED=""
          for V in $(cat /tmp/gecko_candidates.txt); do
            echo "=============== GeckoView $V ==============="
            AAR_URL="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/${V}/geckoview-armeabi-v7a-${V}.aar"
            MIN_SDK=26
            if curl -fsL --retry 3 "$AAR_URL" -o /tmp/gecko_check.aar; then
              M=$(unzip -p /tmp/gecko_check.aar AndroidManifest.xml 2>/dev/null | grep -oP 'minSdkVersion="\K[0-9]+' | head -n 1 || true)
              if [ -n "$M" ] && [ "$M" -gt 26 ]; then MIN_SDK="$M"; fi
              rm -f /tmp/gecko_check.aar
            else
              echo "No se pudo descargar $V, se prueba la siguiente"
              continue
            fi
            for LANG_MODE in default 1.9; do
              echo "--- Compilando con GeckoView $V (modo Kotlin: $LANG_MODE, minSdk $MIN_SDK) ---"
              cp /tmp/MainActivity.orig.kt "$MAIN_KT"
              sed -i "s/Bat TV 20.32 Turbo 60FPS/Bat TV Next (Gecko ${V%%.*})/" "$MAIN_KT"
              rm -rf app/build
              if "$GRADLE_BIN" assembleRelease --no-daemon --console=plain \
                   -PgeckoVer="$V" -PminSdkVer="$MIN_SDK" -PbuildNum="${GITHUB_RUN_NUMBER:-1}" -PkotlinLang="$LANG_MODE" \
                   > "/tmp/build_${V}_${LANG_MODE}.log" 2>&1; then
                SUCCESS=1
                GECKO_USED="$V"
                break 2
              else
                echo ">>> FALLO con GeckoView $V (modo $LANG_MODE). Lineas clave del error:"
                grep -E "^e: |What went wrong|error:|Execution failed|Could not " -A3 "/tmp/build_${V}_${LANG_MODE}.log" | head -n 60 || true
              fi
            done
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "::error::Ninguna version de GeckoView compilo. Copia las lineas que empiezan con FALLO y enviaselas a Claude."
            exit 1
          fi
          echo "Compilado con GeckoView $GECKO_USED"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="BatTV-Next-${GECKO_USED}-armeabi-v7a.apk"
          cp -f "$RAW_APK" "$APK_NAME"
          echo "APK copiado sin modificar su firma digital."
          {
            echo "APK_NAME=$APK_NAME"
            echo "GECKO_USED=$GECKO_USED"
          } >> "$GITHUB_ENV"
          ls -lh "$APK_NAME"

      - name: 8. Publicar APK en GitHub Releases (tag next-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail
          TAG_NAME="next-latest"
          gh release delete "$TAG_NAME" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG_NAME" "$APK_NAME" \
            --title "Bat TV Next (GeckoView ${GECKO_USED})" \
            --notes "APK de prueba con GeckoView ${GECKO_USED}. Se instala junto a Bat TV (paquete com.battv.browser.next). Para Chromecast con Google TV y onn 1080p." || true
          DL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
          REL_PAGE="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          {
            echo "## Bat TV Next compilado"
            echo ""
            echo "GeckoView usado: ${GECKO_USED}"
            echo ""
            echo "Descarga directa: [${APK_NAME}](${DL_URL})"
            echo ""
            echo "Pagina del release: ${REL_PAGE}"
            echo ""
            echo "Versiones recientes de GeckoView (para elegir una a mano en Run workflow):"
            sed 's/^/- /' /tmp/gecko_recent.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK publicado en: $DL_URL"

      - name: 9. Subir a Artifacts (respaldo de 1 dia)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BatTV-Next-APK
          retention-days: 1
          path: android-geckoview/BatTV-Next-*-armeabi-v7a.apk
