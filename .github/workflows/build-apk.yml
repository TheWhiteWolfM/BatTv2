            const AD_URL_REGEX = /(\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{32}\.js|\/[0-9a-f]{32}\/invoke\.js|\/invoke\.js\?|\/(popunder|tabunder|clickunder|socialbar|inpagepush|adframe|adscript|pop\.js|pop2\.js)([\/._?-]|$)|\/(apu|afu)\.php(\?|$)|[?&](utm_source=pop|ad_type=pop|ali_trackid=|aff_fcid=|aff_fsk=|clickid=)|1xbet|mostbet|bet365|apuestasroyal)/i;

            function isHostInList(host, list) {
              for (let i = 0; i < list.length; i++) {
                const item = list[i];
                if (host === item || host.endsWith("." + item)) return true;
              }
              return false;
            }

            function getBaseBrand(hostname) {
              const clean = (hostname || "").toLowerCase().replace(/^www\./, "");
              const parts = clean.split(".");
              return parts.length >= 2 ? parts[parts.length - 2] : clean;
            }

            if (typeof browser !== "undefined" && browser.webRequest && browser.webRequest.onBeforeRequest) {
              browser.webRequest.onBeforeRequest.addListener(
                function (details) {
                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    // NUNCA bloquear imágenes/portadas, fuentes, estilos ni peticiones de datos API/JSON (fetch/XHR)
                    // para que Doramasflix cargue el 100% de sus miniaturas y lista de capítulos al instante.
                    if (details.type === "image" || details.type === "imageset" ||
                        details.type === "font" || details.type === "stylesheet" ||
                        details.type === "xmlhttprequest") {
                      if (/1xbet|mostbet|bet365|apuestasroyal|exoclick|adsterra|juicyads/i.test(rawUrl)) {
                        return { cancel: true };
                      }
                      return {};
                    }

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");

                    // 1. Bloquear redes publicitarias conocidas en cualquier sitio
                    if (isHostInList(reqHost, BLOCKED_AD_DOMAINS) || AD_URL_REGEX.test(rawUrl)) {
                      if (details.type === "script") {
                        return { redirectUrl: "data:text/javascript;charset=utf-8," };
                      }
                      return { cancel: true };
                    }

                    const docUrl = details.originUrl || details.documentUrl || "";
                    if (!docUrl.startsWith("http")) return {};
                    const docHost = new URL(docUrl).hostname.toLowerCase().replace(/^www\./, "");

                    // Dejar Chaturbate y JKAnime sin filtro de terceros extra
                    if (docHost.includes("chaturbate.com") || docHost.includes("jkanime.")) {
                      return {};
                    }

                    const isSameSite = (reqHost === docHost) ||
                                       reqHost.endsWith("." + docHost) ||
                                       docHost.endsWith("." + reqHost) ||
                                       (getBaseBrand(reqHost) === getBaseBrand(docHost));

