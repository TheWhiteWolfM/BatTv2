            function extractHostAndPathFast(rawUrl) {
              const schemeEnd = rawUrl.indexOf("://");
              if (schemeEnd === -1) return { host: "", path: "" };
              const hostStart = schemeEnd + 3;
              let slashIdx = rawUrl.indexOf("/", hostStart);
              if (slashIdx === -1) slashIdx = rawUrl.length;
              let hostPart = rawUrl.slice(hostStart, slashIdx);
              const atIdx = hostPart.lastIndexOf("@");
              if (atIdx !== -1) hostPart = hostPart.slice(atIdx + 1);
              const colonIdx = hostPart.indexOf(":");
              if (colonIdx !== -1) hostPart = hostPart.slice(0, colonIdx);
              hostPart = hostPart.toLowerCase();
              if (hostPart.startsWith("www.")) hostPart = hostPart.slice(4);
              const qIdx = rawUrl.indexOf("?", slashIdx);
              const path = slashIdx < rawUrl.length
