          PROTECTED_KEYWORDS = (
              "jkanime", "jkdesu", "doramasflix", "dramachino", "tudorama",
              "asialiveaction", "kisskh", "chaturbate", "mmcdn", "highwebmedia",
              "google.", "gstatic", "googleapis", "youtube", "ytimg", "cloudflare",
              "jsdelivr", "unpkg", "jquery", "bootstrap", "fontawesome", "jwplayer",
              "jwpcdn", "jwpsrv", "plyr", "videojs", "zencdn", "vimeocdn", "vimeo",
              "dailymotion", "dmcdn", "voe.", "streamtape", "dood", "d000d", "ds2play",
              "filemoon", "streamwish", "wishembed", "vidhide", "mp4upload", "ok.ru",
              "mycdn", "mixdrop", "yourupload", "primeload", "embedshortener",
              "fembed", "uqload", "upstream", "vudeo", "netu", "waaw", "hqq",
