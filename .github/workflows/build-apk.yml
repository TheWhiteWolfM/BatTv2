                  const bodyTxt = (document.body.textContent || "").trim();
                  if (bodyTxt.length >= 6 && bodyTxt.length <= 500 && hasExactScamPhrase(bodyTxt)) {
                    document.documentElement.style.cssText = "display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important;background:transparent!important;";
                    try {
                      if (window.frameElement) {
                        window.frameElement.style.setProperty("display", "none", "important");
                        window.frameElement.remove();
                      }
                    } catch (_) {}
                    try { window.parent.postMessage({ __battvNukeFrame: true }, "*"); } catch (_) {}
                    try { window.top.postMessage({ __battvNukeFrame: true }, "*"); } catch (_) {}
                    return;
                  }
                }

                // B. Destruir cualquier Shadow DOM abierto que contenga anuncios o carezca de <video>
                const shadowHosts = document.querySelectorAll("[data-battv-shadow]");
                for (let i = shadowHosts.length - 1; i >= 0; i--) {
                  const host = shadowHosts[i];
                  if (containsRealVideoPlayer(host)) continue;
                  const sr = host.shadowRoot;
                  if (sr && !sr.querySelector("video")) {
                    host.style.setProperty("display", "none", "important");
                    host.remove();
                  }
                }

                // C. Buscar desde los nodos de texto internos ("CONFIRMA QUE NO ERES UN ROBOT",
                //    "¡Reclama tu bono!", "¡Felicitaciones!") y subir hasta el contenedor del modal
                //    para borrarlo completo aunque tenga 50 elementos de confeti o imágenes dentro
                const textNodes = document.querySelectorAll("h1, h2, h3, h4, p, span, b, strong, button, a, div");
                for (let j = textNodes.length - 1; j >= 0; j--) {
                  const node = textNodes[j];
                  if (!node || !node.isConnected || containsRealVideoPlayer(node)) continue;
                  const txt = (node.textContent || "").trim();
                  if (txt.length >= 8 && txt.length <= 280 && hasExactScamPhrase(txt)) {
                    let modalRoot = node;
                    while (
                      modalRoot.parentElement &&
                      modalRoot.parentElement !== document.body &&
                      modalRoot.parentElement !== document.documentElement &&
                      !containsRealVideoPlayer(modalRoot.parentElement) &&
                      (modalRoot.parentElement.textContent || "").trim().length <= 550
                    ) {
                      modalRoot = modalRoot.parentElement;
                    }
                    if (!containsRealVideoPlayer(modalRoot)) {
                      modalRoot.style.setProperty("display", "none", "important");
                      modalRoot.remove();
                    }
                  }
                }

                // D. Limpiar enlaces trampa <a target="_blank"> colocados sobre el botón Play
                const blankLinks = document.querySelectorAll("a[target='_blank']");
                for (let k = blankLinks.length - 1; k >= 0; k--) {
                  const a = blankLinks[k];
                  if (a.classList.contains("servers") || a.closest(".servers, .bg-servers, .dropdown-menu, #episodes-content")) {
                    a.removeAttribute("target");
                    continue;
                  }
                  const href = (a.getAttribute("href") || "").trim();
                  if (!isTopFrame) {
                    a.style.setProperty("display", "none", "important");
                    a.remove();
                    continue;
                  }
                  if (href.startsWith("http")) {
                    try {
                      const dstHost = new URL(href, location.href).hostname.toLowerCase().replace(/^www\./, "");
                      if (dstHost !== currentHost && !dstHost.endsWith("." + currentHost)) {
                        if ((a.textContent || "").trim().length === 0) {
                          a.style.setProperty("display", "none", "important");
                          a.remove();
                        }
                      }
                    } catch (_) {}
                  }
