name: Compilar Battv.2

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Battv.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar las 3 extensiones oficiales (Pop-ups Blocker, uBlock Origin, Violentmonkey)
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import shutil
          import urllib.request
          import zipfile

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)
          os.makedirs(EXT_BASE, exist_ok=True)

          EXTENSIONS = [
              {
                  "folder": "popup_blocker",
                  "id": "{54e2eb33-18eb-46ad-a4e4-1329c29f6e17}",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/popup-blocker/latest.xpi"
              },
              {
                  "folder": "ublock_origin",
                  "id": "uBlock0@raymondhill.net",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
              },
              {
                  "folder": "violentmonkey",
                  "id": "{aecec67f-0d10-4fa7-b7c7-609a2db280cf}",
                  "url": "https://addons.mozilla.org/firefox/downloads/latest/violentmonkey/latest.xpi"
              }
          ]

          KEEP_LOCALES = {"en", "en_US", "en_GB", "es", "es_ES", "es_419"}

          for ext in EXTENSIONS:
              dest_dir = os.path.join(EXT_BASE, ext["folder"])
              os.makedirs(dest_dir, exist_ok=True)
              xpi_path = os.path.join(EXT_BASE, ext["folder"] + ".xpi")
              print(f"Descargando {ext['folder']} desde {ext['url']}...")
              req = urllib.request.Request(
                  ext["url"],
                  headers={"User-Agent": "Mozilla/5.0 (Android 14; Mobile; rv:130.0) Gecko/130.0 Firefox/130.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as resp, open(xpi_path, "wb") as out_f:
                  shutil.copyfileobj(resp, out_f)

              with zipfile.ZipFile(xpi_path, "r") as zf:
                  zf.extractall(dest_dir)
              os.remove(xpi_path)

              meta_inf = os.path.join(dest_dir, "META-INF")
              if os.path.exists(meta_inf):
                  shutil.rmtree(meta_inf)

              locales_dir = os.path.join(dest_dir, "_locales")
              if os.path.isdir(locales_dir):
                  for loc in os.listdir(locales_dir):
                      loc_path = os.path.join(locales_dir, loc)
                      if os.path.isdir(loc_path) and loc not in KEEP_LOCALES:
                          shutil.rmtree(loc_path)

              manifest_path = os.path.join(dest_dir, "manifest.json")
              with open(manifest_path, "r", encoding="utf-8") as mf:
                  manifest = json.load(mf)

              bss = manifest.setdefault("browser_specific_settings", {})
              gecko = bss.setdefault("gecko", {})
              gecko["id"] = ext["id"]
              gecko.pop("update_url", None)
              if "applications" in manifest and "gecko" in manifest["applications"]:
                  manifest["applications"]["gecko"]["id"] = ext["id"]
                  manifest["applications"]["gecko"].pop("update_url", None)

              with open(manifest_path, "w", encoding="utf-8") as mf:
                  json.dump(manifest, mf, indent=2, ensure_ascii=False)

          # 1. Preconfigurar Pop-ups Blocker (strict) en modo bloqueo inmediato silencioso
          pb_dir = os.path.join(EXT_BASE, "popup_blocker")
          pb_manifest_path = os.path.join(pb_dir, "manifest.json")
          with open(pb_manifest_path, "r", encoding="utf-8") as mf:
              pb_manifest = json.load(mf)

          with open(os.path.join(pb_dir, "battv_pb_init.js"), "w", encoding="utf-8") as pbf:
              pbf.write("""(function () {
            try {
              if (typeof browser !== "undefined" && browser.storage && browser.storage.local) {
                browser.storage.local.set({
                  battv_pb_ready: true,
                  enabled: true,
                  immediate: true,
                  aggressive: true,
                  badge: false,
                  "popup-hosts": [],
                  "block-page-redirection": true
                });
              }
            } catch (_) {}
          })();\n""")

          pb_bg = pb_manifest.setdefault("background", {})
          if "page" in pb_bg:
              pb_page_path = os.path.join(pb_dir, pb_bg["page"].lstrip("/"))
              if os.path.exists(pb_page_path):
                  with open(pb_page_path, "r", encoding="utf-8") as pf:
                      html = pf.read()
                  tag = '<script src="/battv_pb_init.js"></script>'
                  if tag not in html:
                      html = html.replace("<script", tag + "\n<script", 1) if "<script" in html else (tag + "\n" + html)
                      with open(pb_page_path, "w", encoding="utf-8") as pf:
                          pf.write(html)
          else:
              pb_scripts = pb_bg.setdefault("scripts", [])
              if "battv_pb_init.js" not in pb_scripts:
                  pb_scripts.insert(0, "battv_pb_init.js")

          with open(pb_manifest_path, "w", encoding="utf-8") as mf:
              json.dump(pb_manifest, mf, indent=2, ensure_ascii=False)

          # 2. Reforzar las listas preinstaladas de uBlock Origin
          ub_dir = os.path.join(EXT_BASE, "ublock_origin")
          extra_ublock_rules = """
          ! Filtros integrados Battv.2 para sitios de streaming
          ||vidoomy.com^$all
          ||viwom.com^$all
          ||wortise.com^$all
          ||aniview.com^$all
          ||primis.tech^$all
          ||adinplay.com^$all
          ||brid.tv^$all
          ||exoclick.com^$all
          ||magsrv.com^$all
          ||realsrv.com^$all
          ||adsterra.com^$all
          ||monetag.com^$all
          ||acscdn.com^$all
          ||onclickads.net^$all
          ||popads.net^$all
          ||popcash.net^$all
          ||propellerads.com^$all
          ||hilltopads.net^$all
          ||galaksion.com^$all
          ||clickadu.com^$all
          ||juicyads.com^$all
          ||bidgear.com^$all
          ||optad360.io^$all
          ||teads.tv^$all
          ||tsyndicate.com^$all
          ||trafficjunky.net^$all
          ||rollerads.com^$all
          ||evadav.com^$all
          ||richads.com^$all
          ||admaven.com^$all
          ||adcash.com^$all
          ||1xbet.com^$all
          ||bet365.com^$all
          *##div[id*="vidoomy"]
          *##div[class*="vidoomy"]
          *##div[id*="viwom"]
          *##div[class*="viwom"]
          *##div[id*="aniview"]
          *##div[class*="aniview"]
          *##iframe[src*="vidoomy"]
          *##iframe[src*="viwom"]
          *##iframe[src*="exoclick"]
          """
          ub_filter_files = glob.glob(os.path.join(ub_dir, "assets", "ublock", "*.txt"))
          for ff in ub_filter_files:
              if "filters" in os.path.basename(ff) or "badware" in os.path.basename(ff) or "quick-fixes" in os.path.basename(ff):
                  with open(ff, "a", encoding="utf-8") as ubf:
                      ubf.write("\n" + extra_ublock_rules.strip() + "\n")

          ub_assets_json = os.path.join(ub_dir, "assets", "assets.json")
          if os.path.exists(ub_assets_json):
              try:
                  with open(ub_assets_json, "r", encoding="utf-8") as ajf:
                      assets_data = json.load(ajf)
                  for key in ["spa-0", "spa-1"]:
                      if key in assets_data and isinstance(assets_data[key], dict):
                          assets_data[key]["off"] = False
                  with open(ub_assets_json, "w", encoding="utf-8") as ajf:
                      json.dump(assets_data, ajf, indent=2, ensure_ascii=False)
              except Exception as e:
                  print("Aviso en assets.json:", e)

          # 3. Integrar «Saltarse Todos los Enlaces Acortados» y el puente de TV en Violentmonkey
          vm_dir = os.path.join(EXT_BASE, "violentmonkey")
          vm_manifest_path = os.path.join(vm_dir, "manifest.json")

          shortlink_userscript = r'''// ==UserScript==
          // @name         Saltarse Todos los Enlaces Acortados
          // @namespace    battv.shortlinks.bypass
          // @version      2.2.0
          // @description  Salta automaticamente enlaces acortados e intermedios compatibles sin esperas.
          // @author       BatTV
          // @run-at       document-start
          // @match        *://*/*
          // @grant        none
          // ==/UserScript==

          (function () {
            "use strict";
            if (window.__battvShortlinkBypassActive) return;
            window.__battvShortlinkBypassActive = true;

            const SHORTENER_HOSTS = [
              "ouo.io", "ouo.press", "exe.io", "exey.io", "fc.lc", "fc-lc.com",
              "shrtfly.com", "shrinke.me", "shrinkme.io", "linkvertise.com",
              "adfoc.us", "bc.vc", "shorte.st", "gestyy.com", "destyy.com",
              "corneey.com", "clk.sh", "clk.asia", "oko.sh", "za.gl",
              "cuty.io", "cety.app", "gplinks.co", "droplink.co", "tnshort.net",
              "rekonise.com", "sub2unlock.com", "boost.ink", "mboost.me",
              "embedshortener.co", "short-jambo.com", "uii.io", "mitly.us"
            ];

            function tryDecodeBase64Url(str) {
              try {
                const clean = decodeURIComponent(str).trim().replace(/-/g, "+").replace(/_/g, "/");
                const decoded = atob(clean).trim();
                if (/^https?:\/\/[^\s"']+$/i.test(decoded)) return decoded;
              } catch (_) {}
              return null;
            }

            function checkDirectRedirectParams() {
              try {
                const loc = window.location;
                const host = loc.hostname.toLowerCase();

                if (host.includes("embedshortener.co") && loc.pathname.startsWith("/e/")) {
                  const parts = loc.pathname.slice(3).split(".");
                  if (parts.length > 1) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
                    if (payload && payload.link) {
                      const target = tryDecodeBase64Url(payload.link);
                      if (target) {
                        loc.replace(target);
                        return true;
                      }
                    }
                  }
                }

                const isKnownShortener = SHORTENER_HOSTS.some(function (d) {
                  return host === d || host.endsWith("." + d);
                });
                if (!isKnownShortener) return false;

                const params = new URLSearchParams(loc.search);
                const candidateKeys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                for (let i = 0; i < candidateKeys.length; i++) {
                  const val = params.get(candidateKeys[i]);
                  if (!val) continue;
                  if (/^https?:\/\//i.test(val)) {
                    loc.replace(val);
                    return true;
                  }
                  const b64 = tryDecodeBase64Url(val);
                  if (b64) {
                    loc.replace(b64);
                    return true;
                  }
                }
              } catch (_) {}
              return false;
            }

            if (checkDirectRedirectParams()) return;

            function accelerateAndClickShortener() {
              try {
                const host = window.location.hostname.toLowerCase();
                const isKnownShortener = SHORTENER_HOSTS.some(function (d) {
                  return host === d || host.endsWith("." + d);
                });
                if (!isKnownShortener) return;

                const selectors = [
                  "a#btn-main.btn", "button#btn-main", "#invisibleCaptchaShortlink",
                  "a.get-link", "button.get-link", "#yuidea-btn", "#btn6",
                  "a[href*='https://'][class*='btn']", "form#go-link button[type='submit']"
                ];
                for (let i = 0; i < selectors.length; i++) {
                  const el = document.querySelector(selectors[i]);
                  if (el && !el.disabled) {
                    const href = el.getAttribute("href");
                    if (href && /^https?:\/\//i.test(href) && !href.includes(host)) {
                      window.location.replace(href);
                      return;
                    }
                    el.click();
                  }
                }
              } catch (_) {}
            }

            document.addEventListener("DOMContentLoaded", function () {
              accelerateAndClickShortener();
              setTimeout(accelerateAndClickShortener, 1200);
              setTimeout(accelerateAndClickShortener, 2800);
            });
          })();
          '''

          with open(os.path.join(vm_dir, "saltarse_enlaces_acortados.user.js"), "w", encoding="utf-8") as sf:
              sf.write(shortlink_userscript.strip() + "\n")

          preload_bg_js = r'''(function () {
            "use strict";
            const SEED_KEY = "battv_shortlink_script_seeded_v3";
            const SCRIPT_CODE = `''' + shortlink_userscript.strip().replace("\\", "\\\\").replace("`", "\\`").replace("$", "\\$") + r'''`;

            async function seedShortlinkScript() {
              try {
                if (typeof browser === "undefined" || !browser.storage || !browser.storage.local) return;
                const data = await browser.storage.local.get([SEED_KEY, "Ids"]);
                if (data && data[SEED_KEY]) return;

                const now = Date.now();
                const ids = Array.isArray(data.Ids) ? data.Ids : [];
                const scriptId = 1;
                if (!ids.includes(scriptId)) {
                  ids.push(scriptId);
                }

                const scriptObj = {
                  meta: {
                    name: "Saltarse Todos los Enlaces Acortados",
                    namespace: "battv.shortlinks.bypass",
                    version: "2.2.0",
                    description: "Salta automaticamente enlaces acortados e intermedios compatibles sin esperas.",
                    author: "BatTV",
                    runAt: "document-start",
                    match: ["*://*/*"],
                    include: [],
                    exclude: [],
                    excludeMatch: [],
                    grant: ["none"],
                    resources: {}
                  },
                  custom: {
                    origInclude: true,
                    origExclude: true,
                    origMatch: true,
                    origExcludeMatch: true
                  },
                  props: {
                    id: scriptId,
                    position: 1,
                    lastModified: now,
                    lastUpdated: now,
                    uri: "battv.shortlinks.bypass/Saltarse_Todos_los_Enlaces_Acortados"
                  },
                  config: {
                    enabled: 1,
                    shouldUpdate: 0,
                    notifyUpdates: 0
                  }
                };

                const payload = {};
                payload[SEED_KEY] = true;
                payload["Ids"] = ids;
                payload["script:" + scriptId] = scriptObj;
                payload["code:" + scriptId] = SCRIPT_CODE;
                payload["val:" + scriptId] = {};

                await browser.storage.local.set(payload);

                setTimeout(function () {
                  try {
                    browser.runtime.sendMessage({
                      cmd: "ParseScript",
                      data: {
                        code: SCRIPT_CODE,
                        url: "https://greasyfork.org/scripts/431691/code/bypass.user.js",
                        from: "battv",
                        config: { enabled: 1, shouldUpdate: 0 }
                      }
                    }).catch(function () {});
                  } catch (_) {}
                }, 1500);
              } catch (e) {
                console.error("Error al inicializar script en Violentmonkey:", e);
              }
            }

            seedShortlinkScript();
          })();
          '''

          with open(os.path.join(vm_dir, "preload_shortlinks.js"), "w", encoding="utf-8") as pf:
              pf.write(preload_bg_js.strip() + "\n")

          battv_tv_helper_js = r'''(function () {
            "use strict";
            if (window.__battvTvHelperLoaded) return;
            window.__battvTvHelperLoaded = true;

            const isTopFrame = (window === window.top);
            let port = null;
            let activeInputEl = null;
            let inputCounter = 1;
            let promptedVideosSet = new WeakSet();
            let lastFullscreenPromptMs = 0;

            // 1. Inyectar en el Main World:
            //    - Bloqueo de window.open
            //    - Permiso allowfullscreen inmediato al crear iframes
            //    - Puente en Element.prototype.requestFullscreen para que el boton propio de la
            //      esquina inferior derecha del reproductor funcione siempre (incluso en iframes anidados)
            try {
              const mainWorldScript = document.createElement("script");
              mainWorldScript.textContent = `(function(){
                try {
                  const dummyWin = {
                    closed: false,
                    focus: function(){},
                    blur: function(){},
                    close: function(){},
                    postMessage: function(){},
                    location: { href: "about:blank", assign: function(){}, replace: function(){} }
                  };
                  Object.defineProperty(window, "open", {
                    value: function(url) {
                      if (url && typeof url === "string" && url.startsWith(location.origin)) {
                        location.href = url;
                      }
                      return dummyWin;
                    },
                    writable: false,
                    configurable: false
                  });

                  function patchIframeEl(el) {
                    if (el && el.tagName === "IFRAME") {
                      el.setAttribute("allowfullscreen", "true");
                      el.setAttribute("webkitallowfullscreen", "true");
                      el.setAttribute("mozallowfullscreen", "true");
                      el.setAttribute("allow", "fullscreen *; autoplay *; encrypted-media *; picture-in-picture *");
                    }
                  }

                  const origCreateElement = Document.prototype.createElement;
                  Document.prototype.createElement = function(tagName) {
                    const el = origCreateElement.apply(this, arguments);
                    if (typeof tagName === "string" && tagName.toLowerCase() === "iframe") {
                      patchIframeEl(el);
                    }
                    return el;
                  };

                  const origReqFs = Element.prototype.requestFullscreen || Element.prototype.mozRequestFullScreen || Element.prototype.webkitRequestFullscreen;
                  if (origReqFs) {
                    const wrappedReqFs = function() {
                      if (window !== window.top && !document.fullscreenEnabled && !document.mozFullScreenEnabled) {
                        window.dispatchEvent(new CustomEvent("__battv_req_parent_fs"));
                        return Promise.resolve();
                      }
                      try {
                        const res = origReqFs.apply(this, arguments);
                        if (res && typeof res.catch === "function") {
                          res.catch(function() {
                            window.dispatchEvent(new CustomEvent("__battv_req_parent_fs"));
                          });
                        }
                        return res;
                      } catch (err) {
                        window.dispatchEvent(new CustomEvent("__battv_req_parent_fs"));
                        return Promise.resolve();
                      }
                    };
                    Element.prototype.requestFullscreen = wrappedReqFs;
                    Element.prototype.mozRequestFullScreen = wrappedReqFs;
                    Element.prototype.webkitRequestFullscreen = wrappedReqFs;
                  }
                } catch(_) {}
              })();`;
              (document.head || document.documentElement).appendChild(mainWorldScript);
              mainWorldScript.remove();
            } catch (_) {}

            function connectBridge() {
              try {
                if (typeof browser !== "undefined" && browser.runtime && browser.runtime.connectNative) {
                  port = browser.runtime.connectNative("battv_bridge");
                  port.onMessage.addListener(handleNativeMessage);
                  port.onDisconnect.addListener(function () {
                    port = null;
                  });
                }
              } catch (_) {}
            }

            function postToNative(obj) {
              try {
                if (!port) connectBridge();
                if (port) port.postMessage(obj);
              } catch (_) {}
            }

            // Si el boton de la esquina inferior derecha del reproductor pide pantalla completa desde un iframe
            // que no tiene permiso directo, avisar al documento principal para expandir solo el iframe del reproductor
            window.addEventListener("__battv_req_parent_fs", function () {
              postToNative({ type: "REQUEST_IFRAME_FULLSCREEN" });
            });

            // 2. Limpiar exclusivamente anuncios flotantes conocidos (Vidoomy/Viwom/Aniview) y carteles falsos
            //    sin tocar jamas los controles ni capas de los reproductores de video
            function purgeFloatingAdOverlays() {
              try {
                const adSelectors = [
                  "[id*='vidoomy' i]", "[class*='vidoomy' i]",
                  "[id*='viwom' i]", "[class*='viwom' i]",
                  "[id*='aniview' i]", "[class*='aniview' i]",
                  "[id*='primis' i]", "[class*='primis' i]",
                  "[id*='adinplay' i]", "[class*='adinplay' i]",
                  "iframe[src*='vidoomy' i]", "iframe[src*='viwom' i]",
                  "iframe[src*='exoclick' i]", "iframe[src*='adsterra' i]",
                  "iframe[src*='doubleclick' i]", "iframe[src*='googlesyndication' i]"
                ];
                const badNodes = document.querySelectorAll(adSelectors.join(","));
                for (let i = 0; i < badNodes.length; i++) {
                  badNodes[i].remove();
                }

                if (isTopFrame) {
                  const fixedEls = document.querySelectorAll("div, aside, ins");
                  for (let j = 0; j < fixedEls.length; j++) {
                    const el = fixedEls[j];
                    const style = window.getComputedStyle(el);
                    if (style.position === "fixed" || style.position === "sticky") {
                      const txt = (el.innerText || "").trim();
                      if (txt.length > 0 && txt.length < 160 && txt.includes("Haz clic en") &&
                          (txt.includes("continuar") || txt.includes("Atenci")) &&
                          !el.querySelector("video, iframe")) {
                        el.remove();
                      }
                    }
                  }
                }
              } catch (_) {}
            }

            // 3. Estilos limpios para que el elemento en pantalla completa (video, reproductor o iframe del reproductor)
            //    ocupe el 100% de la pantalla sin tapar los controles internos del reproductor
            function injectFullscreenFixStyles() {
              try {
                const styleId = "__battv_fullscreen_css";
                if (document.getElementById(styleId)) return;
                const style = document.createElement("style");
                style.id = styleId;
                style.textContent = `
                  :fullscreen, :-moz-full-screen {
                    width: 100vw !important;
                    height: 100vh !important;
                    max-width: 100vw !important;
                    max-height: 100vh !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    background: #000 !important;
                    box-sizing: border-box !important;
                  }
                  iframe:fullscreen, iframe:-moz-full-screen {
                    width: 100vw !important;
                    height: 100vh !important;
                    max-width: 100vw !important;
                    max-height: 100vh !important;
                    border: 0 !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    background: #000 !important;
                  }
                  video:fullscreen, video:-moz-full-screen {
                    width: 100vw !important;
                    height: 100vh !important;
                    max-width: 100vw !important;
                    max-height: 100vh !important;
                    object-fit: contain !important;
                    background: #000 !important;
                  }
                `;
                (document.head || document.documentElement).appendChild(style);
              } catch (_) {}
            }

            function enableIframeFullscreenAttrs() {
              try {
                const iframes = document.querySelectorAll("iframe");
                for (let i = 0; i < iframes.length; i++) {
                  const f = iframes[i];
                  if (!f.hasAttribute("allowfullscreen")) f.setAttribute("allowfullscreen", "true");
                  if (!f.hasAttribute("webkitallowfullscreen")) f.setAttribute("webkitallowfullscreen", "true");
                  if (!f.hasAttribute("mozallowfullscreen")) f.setAttribute("mozallowfullscreen", "true");
                  const allow = f.getAttribute("allow") || "";
                  if (!allow.includes("fullscreen")) {
                    f.setAttribute("allow", (allow ? allow + "; " : "") + "fullscreen *; autoplay *; encrypted-media *; picture-in-picture *");
                  }
                }
              } catch (_) {}
            }

            function onFullscreenChanged() {
              setTimeout(function () {
                try { window.dispatchEvent(new Event("resize")); } catch (_) {}
              }, 80);
              setTimeout(function () {
                try { window.dispatchEvent(new Event("resize")); } catch (_) {}
              }, 240);
            }

            document.addEventListener("fullscreenchange", onFullscreenChanged, true);
            document.addEventListener("mozfullscreenchange", onFullscreenChanged, true);

            // 4. Gestion de formularios para control remoto
            function isEditableTextInput(el) {
              if (!el || el.disabled || el.readOnly) return false;
              const tag = (el.tagName || "").toUpperCase();
              if (tag === "TEXTAREA") return true;
              if (tag === "INPUT") {
                const type = (el.type || "text").toLowerCase();
                return ["text", "search", "email", "url", "tel", "password", "number"].includes(type);
              }
              return el.isContentEditable === true;
            }

            function getAllEditableInputs() {
              const list = Array.from(document.querySelectorAll("input, textarea, [contenteditable='true']"));
              return list.filter(function (el) {
                if (!isEditableTextInput(el)) return false;
                const rect = el.getBoundingClientRect();
                return rect.width > 10 && rect.height > 10;
              });
            }

            function ensureInputId(el) {
              if (!el.dataset.battvInputId) {
                el.dataset.battvInputId = "battv_inp_" + (inputCounter++);
              }
              return el.dataset.battvInputId;
            }

            function findInputById(id) {
              if (!id) return activeInputEl;
              const found = document.querySelector('[data-battv-input-id="' + id + '"]');
              return found || activeInputEl;
            }

            function notifyInputFocus(el) {
              if (!isEditableTextInput(el)) return;
              activeInputEl = el;
              const id = ensureInputId(el);
              const allInputs = getAllEditableInputs();
              const val = el.isContentEditable ? (el.textContent || "") : (el.value || "");
              const placeholder = el.getAttribute("placeholder") || el.getAttribute("aria-label") || el.name || "";
              postToNative({
                type: "WEB_INPUT_FOCUS",
                inputId: id,
                value: val,
                placeholder: placeholder,
                isMultiField: allInputs.length > 1
              });
            }

            document.addEventListener("click", function (e) {
              enableIframeFullscreenAttrs();
              purgeFloatingAdOverlays();
              const target = e.target ? e.target.closest("input, textarea, [contenteditable='true']") : null;
              if (target && isEditableTextInput(target)) {
                notifyInputFocus(target);
              }
            }, true);

            function setElementValue(el, value, submit) {
              if (!el) return;
              try {
                el.focus();
                if (el.isContentEditable) {
                  el.textContent = value;
                } else {
                  const proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
                  const setter = Object.getOwnPropertyDescriptor(proto, "value");
                  if (setter && setter.set) {
                    setter.set.call(el, value);
                  } else {
                    el.value = value;
                  }
                }
                el.dispatchEvent(new Event("input", { bubbles: true }));
                el.dispatchEvent(new Event("change", { bubbles: true }));

                if (submit) {
                  const enterDown = new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterPress = new KeyboardEvent("keypress", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterUp = new KeyboardEvent("keyup", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  el.dispatchEvent(enterDown);
                  el.dispatchEvent(enterPress);
                  el.dispatchEvent(enterUp);
                  if (el.form) {
                    if (typeof el.form.requestSubmit === "function") {
                      el.form.requestSubmit();
                    } else {
                      el.form.submit();
                    }
                  }
                }
              } catch (_) {}
            }

            // 5. Deteccion de video real y apertura de pantalla completa SOLO sobre el reproductor
            function isRealContentVideo(v) {
              if (!v) return false;
              const rect = v.getBoundingClientRect();
              if (rect.width < 200 || rect.height < 115) return false;
              const dur = v.duration;
              if (Number.isFinite(dur) && dur > 0 && dur < 90) return false;
              return (Number.isFinite(dur) && dur >= 90) || (!Number.isFinite(dur) && v.readyState >= 2);
            }

            function findActiveVideo() {
              const videos = Array.from(document.querySelectorAll("video")).filter(isRealContentVideo);
              if (videos.length === 0) return null;
              videos.sort(function (a, b) {
                const durA = Number.isFinite(a.duration) ? a.duration : 3600;
                const durB = Number.isFinite(b.duration) ? b.duration : 3600;
                return durB - durA;
              });
              return videos[0];
            }

            // Busca en la pagina principal el iframe del reproductor de video (excluyendo iframes pequeños o de anuncios)
            function findMainPlayerIframe() {
              enableIframeFullscreenAttrs();
              const iframes = Array.from(document.querySelectorAll("iframe")).filter(function (f) {
                const src = (f.getAttribute("src") || "").toLowerCase();
                if (src.includes("vidoomy") || src.includes("viwom") || src.includes("exoclick") ||
                    src.includes("adsterra") || src.includes("doubleclick") || src.includes("googlesyndication") ||
                    src.includes("disqus") || src.includes("facebook")) {
                  return false;
                }
                const r = f.getBoundingClientRect();
                return r.width >= 240 && r.height >= 135;
              });
              if (iframes.length === 0) return null;
              iframes.sort(function (a, b) {
                const ra = a.getBoundingClientRect();
                const rb = b.getBoundingClientRect();
                return (rb.width * rb.height) - (ra.width * ra.height);
              });
              return iframes[0];
            }

            function requestFullscreenOnElement(targetEl) {
              if (!targetEl) return Promise.reject();
              injectFullscreenFixStyles();
              const fn = targetEl.requestFullscreen || targetEl.mozRequestFullScreen || targetEl.webkitRequestFullscreen;
              if (!fn) return Promise.reject();
              try {
                const p = fn.call(targetEl);
                return (p && typeof p.then === "function") ? p : Promise.resolve();
              } catch (e) {
                return Promise.reject(e);
              }
            }

