              "€1500",
              "ruleta mundial",
              "empieza a ganar",
              "donde juegan los grandes",
              "apuestas royal",
              "bono de bienvenida",
              "primeros 4 depósitos",
              "cada apuesta, mil emociones"
            ];

            function hasExactScamPhrase(str) {
              if (!str) return false;
              const lower = str.toLowerCase();
              for (let i = 0; i < EXACT_SCAM_PHRASES.length; i++) {
                if (lower.includes(EXACT_SCAM_PHRASES[i])) return true;
              }
              return false;
            }

            function containsRealVideoPlayer(el) {
              if (!el || !el.tagName) return false;
              const tag = el.tagName.toUpperCase();
              if (tag === "VIDEO" || tag === "BODY" || tag === "HTML" || tag === "MAIN" || tag === "HEADER" || tag === "NAV") {
                return true;
              }
              const id = (el.id || "").toLowerCase();
              if (id === "__next" || id === "app" || id === "root" || id === "video_box" ||
                  id === "pframe" || id === "player" || id === "main_video_container" || id === "episodes-content") {
                return true;
              }
              if (el.classList && (el.classList.contains("servers") || el.classList.contains("bg-servers") || el.classList.contains("player_conte"))) {
                return true;
              }
              if (el.querySelector && el.querySelector(
                  "video, #__next, #video_box, #pframe, .player_conte, .servers, .bg-servers, " +
                  "iframe[src*='embed'], iframe[src*='jkplayer'], iframe[src*='um.php'], " +
                  "iframe[src*='nozomi'], iframe[src*='desu'], iframe[src*='primeload'], " +
