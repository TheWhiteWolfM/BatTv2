name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 para reducir peso del APK
        run: |
          cat << 'EOF_PROGUARD' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -dontwarn androidx.**
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF_PROGUARD

      - name: Actualizar a versionCode 33 (v5.8), optimizar memoria Google TV, aviso FS exacto y cierre total
        run: |
          sed -i 's/\\vert{}\\vert{}/||/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/\\vert{}/|/g' android-geckoview/app/src/main/java/com/battv/browser/*.kt
          sed -i 's/versionCode [0-9]\+/versionCode 33/g' android-geckoview/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "5.8"/g' android-geckoview/app/build.gradle
          sed -i 's/shield_v[0-9]\+@battv.browser/shield_v33@battv.browser/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt
          sed -i 's/battv_shield_v[0-9]\+/battv_shield_v33/g' android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt

          python3 - << 'EOF_PY'
          import re

          # 1. Activar R8 (minifyEnabled + shrinkResources) en app/build.gradle
          gradle_path = "android-geckoview/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              g = f.read()

          new_build_types = (
              "buildTypes {\n"
              "        release {\n"
              "            minifyEnabled true\n"
              "            shrinkResources true\n"
              "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
              "            signingConfig signingConfigs.debug\n"
              "        }\n"
              "    }"
          )
          g = re.sub(
              r"buildTypes\s*\{\s*release\s*\{[\s\S]*?\}\s*\}",
              lambda _: new_build_types,
              g,
              count=1
          )
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(g)

          # 2. Parchar MainActivity.kt (aviso FS por playerKey sin fantasmas, limpieza SPA en onLocationChange, cursor 4.5s y cierre total)
          main_path = "android-geckoview/app/src/main/java/com/battv/browser/MainActivity.kt"
          with open(main_path, "r", encoding="utf-8") as f:
              code = f.read()

          code = re.sub(
              r"if \(geckoManager\.isKnownAdOrPopupUri\(url\) \|\| \(!isInitialNavigationInProgress && !geckoManager\.isSameOrTrustedNavigationTarget\(currentUrl, url\)\)\)",
              lambda _: "if (geckoManager.isKnownAdOrPopupUri(url))",
              code
          )

          code = code.replace(
              "private const val CURSOR_AUTO_HIDE_MS = 2500L",
              "private const val CURSOR_AUTO_HIDE_MS = 4500L"
          )

          if "private var isExitingCompletely" not in code:
              code = code.replace(
                  "private var isFullScreenVideo: Boolean = false",
                  "private var isFullScreenVideo: Boolean = false\n  private var isExitingCompletely: Boolean = false",
                  1
              )

          if "private var lastDismissedPlayerKey" not in code:
              code = code.replace(
                  "private var lastFullscreenExitUptimeMs: Long = 0L",
                  "private var lastFullscreenExitUptimeMs: Long = 0L\n  private var lastDismissedPlayerKey: String = \"\"\n  private var lastPromptedPlayerKey: String = \"\"\n  private var lastTopNavChangeUptimeMs: Long = 0L",
                  1
              )

          new_prompt_fn = (
              "private fun promptAutoFullscreenIfEligible(playerKey: String = \"\") {\n"
              "    if (isHomeScreenVisible || isFullScreenVideo) return\n"
              "    if (fullscreenPromptDialog?.isShowing == true) return\n"
              "    val now = SystemClock.uptimeMillis()\n"
              "    if (now - lastTopNavChangeUptimeMs < 900L) return\n"
              "    val isNewPlayer = playerKey.isNotBlank() && playerKey != lastDismissedPlayerKey && playerKey != lastPromptedPlayerKey\n"
              "    if (isNewPlayer) {\n"
              "      fullscreenPromptDismissedForPage = false\n"
              "    } else {\n"
              "      if (fullscreenPromptDismissedForPage) return\n"
              "      if (playerKey.isNotBlank() && playerKey == lastDismissedPlayerKey) return\n"
              "      if (now - lastFullscreenExitUptimeMs < 3500L) return\n"
              "    }\n"
              "    lastPromptedPlayerKey = playerKey\n"
              "    stopSmoothDpadMovement(immediate = true)\n"
              "    val dialog = AlertDialog.Builder(this)\n"
              "      .setTitle(\"\\uD83C\\uDFAC Reproducir en pantalla completa\")\n"
              "      .setMessage(\"\\u00BFQuieres abrir el v\\u00EDdeo en pantalla completa ahora?\")\n"
              "      .setCancelable(true)\n"
              "      .setPositiveButton(\"Aceptar\") { d, _ ->\n"
              "        d.dismiss()\n"
              "        fullscreenPromptDialog = null\n"
              "        enterVideoFullscreenAutomatically()\n"
              "      }\n"
              "      .setNegativeButton(\"Cancelar\") { d, _ ->\n"
              "        fullscreenPromptDismissedForPage = true\n"
              "        lastDismissedPlayerKey = playerKey\n"
              "        d.dismiss()\n"
              "        fullscreenPromptDialog = null\n"
              "      }\n"
              "      .setOnCancelListener {\n"
              "        fullscreenPromptDismissedForPage = true\n"
              "        lastDismissedPlayerKey = playerKey\n"
              "        fullscreenPromptDialog = null\n"
              "      }\n"
              "      .create()\n"
              "    fullscreenPromptDialog = dialog\n"
              "    dialog.show()\n"
              "    dialog.getButton(AlertDialog.BUTTON_POSITIVE)?.requestFocus()\n"
              "  }"
          )
          code = re.sub(
              r"private fun promptAutoFullscreenIfEligible\(\)\s*\{[\s\S]*?\n  \}",
              lambda _: new_prompt_fn,
              code,
              count=1
          )

          new_enter_fs = (
              "private fun enterVideoFullscreenAutomatically() {\n"
              "    applyFullScreenState(true)\n"
              "    sendVideoCommandToWeb(\"ENTER_FULLSCREEN\", 0.0)\n"
              "  }"
          )
          code = re.sub(
              r"private fun enterVideoFullscreenAutomatically\(\)\s*\{[\s\S]*?\n  \}",
              lambda _: new_enter_fs,
              code,
              count=1
          )

          code = code.replace(
              "fullscreenPromptDismissedForPage = true\n    lastFullscreenExitUptimeMs = SystemClock.uptimeMillis()",
              "fullscreenPromptDismissedForPage = true\n    lastDismissedPlayerKey = lastPromptedPlayerKey\n    lastFullscreenExitUptimeMs = SystemClock.uptimeMillis()",
              1
          )

          old_loc_assign = (
              "          currentUrl = url\n"
              "          if (url.startsWith(\"http\", ignoreCase = true)) {\n"
              "            isInitialNavigationInProgress = false\n"
              "          }"
          )
          new_loc_assign = (
              "          val changedPage = (url != currentUrl)\n"
              "          if (changedPage) {\n"
              "            dismissFullscreenPromptDialog()\n"
              "            fullscreenPromptDismissedForPage = false\n"
              "            lastDismissedPlayerKey = \"\"\n"
              "            lastPromptedPlayerKey = \"\"\n"
              "            lastTopNavChangeUptimeMs = SystemClock.uptimeMillis()\n"
              "            hasActiveVodVideo = false\n"
              "            isLiveStreamVideo = false\n"
              "            vodIsPlaying = false\n"
              "            vodDurationSec = 0.0\n"
              "            videoSeekOverlay.hideOverlayImmediate()\n"
              "            if (isFullScreenVideo) { applyFullScreenState(false) }\n"
              "          }\n"
              "          currentUrl = url\n"
              "          if (url.startsWith(\"http\", ignoreCase = true)) {\n"
              "            isInitialNavigationInProgress = false\n"
              "          }"
          )
          if old_loc_assign in code:
              code = code.replace(old_loc_assign, new_loc_assign, 1)

          code = code.replace(
              "fullscreenPromptDismissedForPage = false\n          latestExtractedHeading = \"\"",
              "fullscreenPromptDismissedForPage = false\n          lastDismissedPlayerKey = \"\"\n          lastPromptedPlayerKey = \"\"\n          lastTopNavChangeUptimeMs = SystemClock.uptimeMillis()\n          latestExtractedHeading = \"\"",
              1
          )
          code = code.replace(
              "fullscreenPromptDismissedForPage = false\n    isInitialNavigationInProgress = true",
              "fullscreenPromptDismissedForPage = false\n    lastDismissedPlayerKey = \"\"\n    lastPromptedPlayerKey = \"\"\n    lastTopNavChangeUptimeMs = SystemClock.uptimeMillis()\n    hasActiveVodVideo = false\n    isLiveStreamVideo = false\n    vodIsPlaying = false\n    vodDurationSec = 0.0\n    isInitialNavigationInProgress = true",
              1
          )

          code = re.sub(
              r"if \(vodDurationSec >= 20\.0 \|\| isLiveStreamVideo\) \{\s*promptAutoFullscreenIfEligible\(\)\s*\}",
              lambda _: "",
              code
          )
          code = re.sub(
              r"if \(vodIsPlaying && state\.position >= 0\.4\) \{\s*promptAutoFullscreenIfEligible\(\)\s*\}",
              lambda _: "",
              code
          )

          new_started_playing = (
              "if (startedPlayingNow && (hasActiveVodVideo || isLiveStreamVideo)) {\n"
              "                    loadingProgressBar.visibility = View.GONE\n"
              "                    if (!isSmoothDpadLoopRunning) {\n"
              "                      mainHandler.removeCallbacks(hideCursorRunnable)\n"
              "                      mainHandler.postDelayed(hideCursorRunnable, 900L)\n"
              "                    }\n"
              "                  }"
          )
          code = re.sub(
              r"if \(startedPlayingNow && \(hasActiveVodVideo \|\| isLiveStreamVideo\)\) \{[\s\S]*?promptAutoFullscreenIfEligible\(\)\s*\}",
              lambda _: new_started_playing,
              code
          )

          old_prompt_msg = (
              '              "VIDEO_PLAY_STARTED_PROMPT_FS" -> {\n'
              '                val dur = json.optDouble("duration", 0.0)\n'
              '                val isLive = json.optBoolean("isLive", false)\n'
              '                runOnUiThread {\n'
              '                  isLiveStreamVideo = isLive\n'
              '                  hasActiveVodVideo = !isLive && dur >= 20.0\n'
              '                  if (dur > 0.0) vodDurationSec = dur\n'
              '                  loadingProgressBar.visibility = View.GONE\n'
              '                  if (isLive || dur >= 20.0) {\n'
              '                    promptAutoFullscreenIfEligible()\n'
              '                  }\n'
              '                }\n'
              '              }'
          )
          new_prompt_msg = (
              '              "VIDEO_PLAY_STARTED_PROMPT_FS" -> {\n'
              '                val dur = json.optDouble("duration", 0.0)\n'
              '                val isLive = json.optBoolean("isLive", false)\n'
              '                val pKey = json.optString("playerKey", "")\n'
              '                runOnUiThread {\n'
              '                  isLiveStreamVideo = isLive\n'
              '                  hasActiveVodVideo = !isLive && dur >= 20.0\n'
              '                  if (dur > 0.0) vodDurationSec = dur\n'
              '                  loadingProgressBar.visibility = View.GONE\n'
              '                  if (isLive || dur >= 20.0) {\n'
              '                    promptAutoFullscreenIfEligible(pKey)\n'
              '                  }\n'
              '                }\n'
              '              }'
          )
          if old_prompt_msg in code:
              code = code.replace(old_prompt_msg, new_prompt_msg, 1)

          new_fs_exit_only = (
              "if (!fullScreen) {\n"
              "            sendVideoCommandToWeb(\"EXIT_FULLSCREEN\", 0.0)\n"
              "          }"
          )
          new_enabled_exit_only = (
              "if (!enabled) {\n"
              "            sendVideoCommandToWeb(\"EXIT_FULLSCREEN\", 0.0)\n"
              "          }"
          )
          code = re.sub(
              r"if \(fullScreen\) \{\s*sendVideoCommandToWeb\(\"ENTER_FULLSCREEN\", 0\.0\)\s*\} else \{\s*sendVideoCommandToWeb\(\"EXIT_FULLSCREEN\", 0\.0\)\s*\}",
              lambda _: new_fs_exit_only,
              code
          )
          code = re.sub(
              r"if \(enabled\) \{\s*sendVideoCommandToWeb\(\"ENTER_FULLSCREEN\", 0\.0\)\s*\} else \{\s*sendVideoCommandToWeb\(\"EXIT_FULLSCREEN\", 0\.0\)\s*\}",
              lambda _: new_enabled_exit_only,
              code
          )

          if "EXPAND_PLAYER_IFRAME_FALLBACK" not in code:
              code = code.replace(
                  '"WEB_FULLSCREEN_STATE" -> {',
                  '"EXPAND_PLAYER_IFRAME_FALLBACK" -> {\n'
                  '                runOnUiThread {\n'
                  '                  applyFullScreenState(true)\n'
                  '                  sendVideoCommandToWeb("EXPAND_PLAYER_IFRAME_FALLBACK", 0.0)\n'
                  '                }\n'
                  '              }\n'
                  '              "WEB_FULLSCREEN_STATE" -> {',
                  1
              )

          if "override fun onStop()" not in code:
              on_stop_suffix = (
                  "\n\n"
                  "  override fun onStop() {\n"
                  "    super.onStop()\n"
                  "    if (!isChangingConfigurations && !isExitingCompletely) {\n"
                  "      exitBrowserCleanly()\n"
                  "    }\n"
                  "  }"
              )
              code = re.sub(
                  r"(override fun onPause\(\)\s*\{[\s\S]*?\n  \})",
                  lambda m: m.group(1) + on_stop_suffix,
                  code,
                  count=1
              )

          new_exit_fn = (
              "private fun exitBrowserCleanly() {\n"
              "    if (isExitingCompletely) return\n"
              "    isExitingCompletely = true\n"
              "    stopSmoothDpadMovement(immediate = true)\n"
              "    dismissFullscreenPromptDialog()\n"
              "    mainHandler.removeCallbacksAndMessages(null)\n"
              "    try {\n"
              "      geckoSession?.stop()\n"
              "      geckoSession?.loadUri(\"about:blank\")\n"
              "    } catch (_: Exception) {}\n"
              "    if (::geckoManager.isInitialized) {\n"
              "      geckoManager.closeSessionCleanly()\n"
              "    }\n"
              "    try {\n"
              "      finishAndRemoveTask()\n"
              "    } catch (_: Exception) {\n"
              "      finish()\n"
              "    }\n"
              "    mainHandler.postDelayed({\n"
              "      try {\n"
              "        android.os.Process.killProcess(android.os.Process.myPid())\n"
              "      } catch (_: Exception) {}\n"
              "      kotlin.system.exitProcess(0)\n"
              "    }, 180L)\n"
              "  }"
          )
          code = re.sub(
              r"private fun exitBrowserCleanly\(\)\s*\{[\s\S]*?\n  \}",
              lambda _: new_exit_fn,
              code,
              count=1
          )

          with open(main_path, "w", encoding="utf-8") as f:
              f.write(code)

          # 3. Parchar BatTvGeckoViewManager.kt (perfil ligero anti-lag para Google TV de poca RAM + purga de caches)
          mgr_path = "android-geckoview/app/src/main/java/com/battv/browser/BatTvGeckoViewManager.kt"
          with open(mgr_path, "r", encoding="utf-8") as f:
              mgr = f.read()

          pref_replacements = [
              ("browser.cache.memory.capacity: 20480", "browser.cache.memory.capacity: 16384"),
              ("content.notify.interval: 16666", "content.notify.interval: 50000"),
              ("media.cache_size: 49152", "media.cache_size: 24576"),
              ("media.memory_cache_max_size: 24576", "media.memory_cache_max_size: 16384"),
              ("media.memory_caches_combined_limit_kb: 49152", "media.memory_caches_combined_limit_kb: 24576"),
              ("media.cache_readahead_limit: 50", "media.cache_readahead_limit: 20"),
              ("media.cache_resume_threshold: 6", "media.cache_resume_threshold: 8"),
              ("media.decoder.skip-to-next-key-frame.enabled: false", "media.decoder.skip-to-next-key-frame.enabled: true"),
              ("network.http.max-connections: 36", "network.http.max-connections: 24"),
              ("network.http.max-persistent-connections-per-server: 8", "network.http.max-persistent-connections-per-server: 6")
          ]
          for old_p, new_p in pref_replacements:
              mgr = mgr.replace(old_p, new_p)

          if "image.decode-immediately.enabled" not in mgr:
              mgr = mgr.replace(
                  "image.mem.shared: true",
                  "image.mem.shared: true\n"
                  "                  image.decode-immediately.enabled: false\n"
                  "                  image.mem.surfacecache.max_size_kb: 32768\n"
                  "                  dom.image-lazy-loading.enabled: true\n"
                  "                  gfx.webrender.picture-caching: true\n"
                  "                  apz.allow_zooming: false",
                  1
              )

          extra_domains = '"chatmate.tv", "chatmate.com", "t6r-rotator-marketingg.com", "rotator-marketingg.com", "rotator-marketing"'
          if "t6r-rotator-marketingg.com" not in mgr:
              if '"mondiad.com"' in mgr:
                  mgr = mgr.replace('"mondiad.com"', '"mondiad.com", ' + extra_domains, 1)
              elif '"yellowishgather.com"' in mgr:
                  mgr = mgr.replace('"yellowishgather.com"', '"yellowishgather.com", ' + extra_domains, 1)

          mgr = mgr.replace('path.startsWith("/b/")', 'path.contains("/0/P.")')

          old_storage_branch = 'else if (child.name != "storage" && child.name != "extensions") {'
          new_storage_branch = (
              'else if (child.name == "storage") {\n'
              '                    val tempDir = File(child, "temporary")\n'
              '                    if (tempDir.exists()) {\n'
              '                        bytes += getFolderSize(tempDir)\n'
              '                        tempDir.deleteRecursively()\n'
              '                    }\n'
              '                    val defaultDir = File(child, "default")\n'
              '                    defaultDir.listFiles()?.forEach { siteDir ->\n'
              '                        val siteCache = File(siteDir, "cache")\n'
              '                        if (siteCache.exists()) {\n'
              '                            bytes += getFolderSize(siteCache)\n'
              '                            siteCache.deleteRecursively()\n'
              '                        }\n'
              '                    }\n'
              '                } else if (child.name != "extensions") {'
          )
          if old_storage_branch in mgr:
              mgr = mgr.replace(old_storage_branch, new_storage_branch, 1)

          new_close_fn = (
              "fun closeSessionCleanly() {\n"
              "        try {\n"
              "            if (::runtime.isInitialized) {\n"
              "                runtime.storageController.clearData(StorageController.ClearFlags.ALL_CACHES)\n"
              "            }\n"
              "        } catch (_: Exception) {}\n"
              "        try {\n"
              "            if (::session.isInitialized) {\n"
              "                session.stop()\n"
              "                session.setActive(false)\n"
              "                session.close()\n"
              "            }\n"
              "        } catch (_: Exception) {}\n"
              "        try {\n"
              "            deleteDirectoryContents(context.cacheDir)\n"
              "            context.externalCacheDir?.let { deleteDirectoryContents(it) }\n"
              "            val mozillaDir = File(context.filesDir, \"mozilla\")\n"
              "            if (mozillaDir.exists()) {\n"
              "                cleanDisposableGeckoDirs(mozillaDir)\n"
              "            }\n"
              "        } catch (_: Exception) {}\n"
              "        try {\n"
              "            if (::runtime.isInitialized) {\n"
              "                runtime.shutdown()\n"
              "            }\n"
              "        } catch (_: Exception) {}\n"
              "    }"
          )
          mgr = re.sub(
              r"fun closeSessionCleanly\(\)\s*\{[\s\S]*?\n    \}",
              lambda _: new_close_fn,
              mgr,
              count=1
          )

          with open(mgr_path, "w", encoding="utf-8") as f:
              f.write(mgr)

          print("Parches v5.8 aplicados correctamente.")
          EOF_PY

      - name: Generar Motor Nativo Ultraligero v33.0 (Adblock Generico + Cero Lag Doramasflix/BYSE + Aviso FS Exacto)
        run: |
          set -e
          EXT_BASE="android-geckoview/app/src/main/assets/extensions"
          SHIELD_DIR="$EXT_BASE/battv_shield_v33"
          rm -rf "$EXT_BASE"
          mkdir -p "$SHIELD_DIR"

          cat << 'EOF_NOOP_JS' > "$SHIELD_DIR/noop.js"
          (function () {
            "use strict";
            try {
              window.canRunAds = true;
              window.isAdBlockActive = false;
              window.adBlockEnabled = false;
            } catch (_) {}
          })();
          EOF_NOOP_JS

          printf 'ok\n' > "$SHIELD_DIR/noop.txt"
          printf '<VAST version="3.0"></VAST>\n' > "$SHIELD_DIR/vast.xml"

          cat << 'EOF_MANIFEST' > "$SHIELD_DIR/manifest.json"
          {
            "manifest_version": 2,
            "name": "Bat TV Native Shield & Cinema 60FPS Engine",
            "version": "33.0.0",
            "description": "Bloqueador generico sin lag para Doramasflix, DramaChino y BYSE/Filemoon + Aviso FS exacto por servidor + Sitios aislados intactos.",
            "browser_specific_settings": {
              "gecko": {
                "id": "shield_v33@battv.browser",
                "strict_min_version": "115.0"
              }
            },
            "permissions": [
              "<all_urls>",
              "webRequest",
              "webRequestBlocking",
              "storage",
              "tabs",
              "nativeMessaging",
              "nativeMessagingFromContent",
              "geckoViewAddons"
            ],
            "web_accessible_resources": [
              "noop.js",
              "noop.txt",
              "vast.xml"
            ],
            "background": {
              "scripts": ["background.js"]
            },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content_start.js"],
                "run_at": "document_start",
                "all_frames": true,
                "match_about_blank": true
              }
            ]
          }
          EOF_MANIFEST

          cat << 'EOF_BG' > "$SHIELD_DIR/background.js"
          (function () {
            "use strict";

            const NOOP_JS_URL = (typeof browser !== "undefined" && browser.runtime && browser.runtime.getURL)
              ? browser.runtime.getURL("noop.js")
              : "";
            const NOOP_TXT_URL = (typeof browser !== "undefined" && browser.runtime && browser.runtime.getURL)
              ? browser.runtime.getURL("noop.txt")
              : "";
            const VAST_XML_URL = (typeof browser !== "undefined" && browser.runtime && browser.runtime.getURL)
              ? browser.runtime.getURL("vast.xml")
              : "";

            const BLOCKED_AD_DOMAINS = [
              "vidoomy.com", "viwom.com", "wortise.com", "aniview.com", "primis.tech",
              "adinplay.com", "brid.tv", "doubleclick.net", "googlesyndication.com",
              "googleadservices.com", "google-analytics.com", "googletagmanager.com",
              "popads.net", "popcash.net", "propellerads.com", "exoclick.com", "exosrv.com",
              "exdynsrv.com", "orbsrv.com", "magsrv.com", "realsrv.com", "juicyads.com",
              "adsterra.com", "monetag.com", "acscdn.com", "onclckmn.com", "onclicka.com",
              "onclickads.net", "hilltopads.net", "yellowishgather.com", "galaksion.com",
              "clickadu.com", "adcash.com", "richads.com", "admaven.com", "bidgear.com",
              "trafficjunky.net", "trafficstars.com", "tsyndicate.com", "rollerads.com",
              "evadav.com", "optad360.io", "teads.tv", "taboola.com", "outbrain.com",
