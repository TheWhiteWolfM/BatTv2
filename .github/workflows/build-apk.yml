                  "storage",
                  "tabs",
                  "nativeMessaging",
                  "nativeMessagingFromContent",
                  "geckoViewAddons"
              ],
              "background": {
                  "scripts": ["background.js"]
              },
              "content_scripts": [
                  {
                      "matches": ["<all_urls>"],
                      "js": ["content_start.js"],
                      "run_at": "document_start",
                      "all_frames": True,
                      "match_about_blank": True
