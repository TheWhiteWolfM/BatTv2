name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generar reglas ProGuard/R8 (Evita error de SnakeYAML en GeckoView)
        run: |
          cat << 'EOF' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF

      - name: Generar Motor Nativo v14.0 (Doramasflix Next.js Intacto, Cortafuegos BYSE/DramaChino y JKAnime)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import shutil

          EXT_BASE = "android-geckoview/app/src/main/assets/extensions"
          if os.path.exists(EXT_BASE):
              shutil.rmtree(EXT_BASE)

          SHIELD_DIR = os.path.join(EXT_BASE, "battv_shield")
          os.makedirs(SHIELD_DIR, exist_ok=True)

          manifest = {
              "manifest_version": 2,
              "name": "Bat TV Native Shield & Cinema 60FPS Engine",
              "version": "14.0.0",
              "description": "Hidratación limpia Next.js en Doramasflix, cortafuegos de scripts en BYSE/DramaChino y soporte JKAnime.",
              "browser_specific_settings": {
                  "gecko": {
                      "id": "shield@battv.browser",
                      "strict_min_version": "115.0"
                  }
              },
              "permissions": [
                  "<all_urls>",
                  "webRequest",
                  "webRequestBlocking",
                  "storage",
                  "tabs",
                  "nativeMessaging",
                  "nativeMessagingFromContent",
                  "geckoViewAddons"
              ],
              "background": {
                  "scripts": ["background.js"]
              },
              "content_scripts": [
                  {
                      "matches": ["<all_urls>"],
                      "js": ["content_start.js"],
                      "run_at": "document_start",
                      "all_frames": True,
                      "match_about_blank": True
                  }
              ]
          }

          with open(os.path.join(SHIELD_DIR, "manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2, ensure_ascii=False)

          # background.js basado en la arquitectura probada de codigo_battv_2.txt:
          # 1. Desacorta automáticamente embedshortener.co/e/<jwt> para Doramasflix.
          # 2. Aplica el cortafuegos de scripts de terceros sobre DramaChino y sobre TODOS los reproductores
          #    embebidos (/e/, /embed, byse, voe, streamtape, primeload, dood, filemoon, streamwish),
          #    bloqueando de raíz el script que inyecta "CONFIRMA QUE NO ERES UN ROBOT" y "777 ¡Felicitaciones!".
          # 3. Deja las páginas principales de doramasflix.io, doramasflix.co y jkanime.net libres de bloqueos
          #    ciegos para que Next.js y los selectores de servidores carguen al 100%.
          background_js = r'''(function () {
            "use strict";

            const BLOCKED_AD_DOMAINS = [
              "vidoomy.com", "viwom.com", "wortise.com", "aniview.com", "primis.tech",
              "adinplay.com", "brid.tv", "doubleclick.net", "googlesyndication.com",
              "googleadservices.com", "google-analytics.com", "googletagmanager.com",
              "googletagservices.com", "popads.net", "popcash.net", "propellerads.com",
              "exoclick.com", "magsrv.com", "realsrv.com", "juicyads.com", "adsterra.com",
              "monetag.com", "acscdn.com", "onclickads.net", "hilltopads.net",
              "galaksion.com", "clickadu.com", "adcash.com", "richads.com",
              "admaven.com", "bidgear.com", "trafficjunky.net", "trafficstars.com",
              "tsyndicate.com", "rollerads.com", "evadav.com", "optad360.io",
              "teads.tv", "taboola.com", "outbrain.com", "mgid.com", "revcontent.com",
              "criteo.com", "pubmatic.com", "rubiconproject.com", "openx.net",
              "smartadserver.com", "1xbet.com", "1xstavka.ru", "bet365.com", "mostbet.com",
              "caliente.mx", "codere.mx", "betano.com", "bwin.com", "pin-up.bet",
              "pin-up.casino", "20bet.com", "22bet.com", "melbet.com", "parimatch.com",
              "stake.com", "leon.bet", "1win.pro", "1win.com", "apuestasroyal.com",
              "pushground.com", "yllix.com", "plugrush.com", "adspyglass.com",
              "clksite.com", "clkmon.com", "betteradsystem.com", "blurtsbrerd.com",
              "capsidsflyleaf.com", "skypipevatican.com", "21wiz.com", "aarems.org",
              "twinrdsyn.com", "adsco.re", "a-ads.com", "adskeeper.com", "adskeeper.co.uk",
              "wpadmngr.com", "onmarshtompor.com", "alwingulla.com", "profitablecpmrate.com",
              "highperformanceformat.com", "surfe.pro", "histats.com", "yandex.ru",
              "mc.yandex.ru", "clarity.ms", "bebi.com", "adsbyvli.com", "vlitag.com",
              "adtng.com", "ero-advertising.com", "adform.net", "quantserve.com",
              "scorecardresearch.com", "dtscout.com", "acint.net", "adkernel.com",
              "aliexpress.com", "aliexpress.us", "aliexpress.ru", "alibaba.com",
              "mmstat.com", "aliapp.org", "temu.com", "shein.com", "shopee.com", "lazada.com"
            ];

            // Sitios y reproductores donde bloqueamos cualquier <script> de dominios externos desconocidos
            // (incluye DramaChino y todos los servidores BYSE, Primeload, Voe, Streamtape, Filemoon, Streamwish)
            const PROTECTED_STREAMING_AND_PLAYERS = [
              "dramachino.com", "tudorama.com", "asialiveaction.com", "kisskh.do", "kisskh.co",
              "hdfull.one", "primeload.co", "voe.sx", "streamtape.com",
              "filemoon.sx", "streamwish.to", "wishembed.pro", "vidhidevip.com", "do7go.com",
              "byse.sx", "bysebuho.com", "bysefujedu.com", "bysetayico.com", "bysevepoin.com",
              "f16px.com", "n1mwq.org", "pkaa.top", "dood.watch", "dood.to", "dood.la", "d000d.com", "ds2play.com"
            ];

            const ALLOWED_TECH_CDNS = [
              "cloudflare.com", "cdnjs.cloudflare.com", "cloudflareinsights.com",
              "jsdelivr.net", "unpkg.com", "gstatic.com", "googleapis.com",
              "google.com", "recaptcha.net", "jquery.com", "bootstrapcdn.com",
              "fontawesome.com", "jwpsrv.com", "jwpcdn.com", "jwplayer.com",
              "vimeocdn.com", "plyr.io", "vjs.zencdn.net", "zencdn.net", "videojs.com",
              "tmdb.org", "themoviedb.org", "imgur.com", "wp.com", "gitlab.io", "github.io",
              "akamaihd.net", "akamaized.net", "fastly.net", "cloudfront.net",
              "jkanime.net", "jkanime.bz", "doramasflix.io", "doramasflix.co",
              "ok.ru", "mycdn.me", "vk.com", "mp4upload.com", "mixdrop.co", "mixdrop.ag", "yourupload.com"
            ];

            const AD_SCRIPT_REGEX = /(\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{32}\.js|\/[0-9a-f]{32}\/invoke\.js|\/invoke\.js|\/popunder|\/tabunder|\/clickunder|\/apu\.php|\/afu\.php|utm_source=pop|ad_type=pop|zoneid=|directlink|reclama-tu|felicitaciones|ruleta)/i;

            function getBaseBrand(hostname) {
              const clean = (hostname || "").toLowerCase().replace(/^www\./, "");
              const parts = clean.split(".");
              return parts.length >= 2 ? parts[parts.length - 2] : clean;
            }

            function isHostInList(host, list) {
              for (let i = 0; i < list.length; i++) {
                const item = list[i];
                if (host === item || host.endsWith("." + item)) return true;
              }
              return false;
            }

            if (typeof browser !== "undefined" && browser.webRequest && browser.webRequest.onBeforeRequest) {
              browser.webRequest.onBeforeRequest.addListener(
                function (details) {
                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");

                    // 1. Desacortar automáticamente embedshortener.co/e/<jwt> (usado por Doramasflix)
                    if (reqHost.includes("embedshortener.co") && parsed.pathname.startsWith("/e/")) {
                      const token = parsed.pathname.slice(3).split(".")[1];
                      if (token) {
                        const payload = JSON.parse(atob(token.replace(/-/g, "+").replace(/_/g, "/")));
                        if (payload && payload.link) {
                          const decodedUrl = atob(payload.link).trim();
                          if (/^https?:\/\//i.test(decodedUrl)) {
                            return { redirectUrl: decodedUrl };
                          }
                        }
                      }
                    }

                    // 2. Bloquear dominios publicitarios conocidos y firmas de Adsterra / PopAds
                    if (isHostInList(reqHost, BLOCKED_AD_DOMAINS) || AD_SCRIPT_REGEX.test(rawUrl)) {
                      return { cancel: true };
                    }

                    // 3. Cortafuegos de scripts de terceros en DramaChino y en TODOS los reproductores (/e/, /embed, byse, etc.):
                    //    Cancela cualquier <script> de dominios rotativos desconocidos que inyectan
                    //    "CONFIRMA QUE NO ERES UN ROBOT" o "777 ¡Felicitaciones! ¡Reclama tu bono!".
                    const docUrl = details.originUrl || details.documentUrl || "";
                    if (docUrl.startsWith("http") && details.type === "script") {
                      const docHost = new URL(docUrl).hostname.toLowerCase().replace(/^www\./, "");

                      // Dejar las páginas raíz (frameId === 0) de doramasflix.io, doramasflix.co, jkanime.net y chaturbate.com
                      // libres de este filtro para que Next.js y los selectores de servidores carguen siempre al 100%
                      if (docHost.includes("chaturbate.com")) return {};
                      if (details.frameId === 0 && (docHost.includes("doramasflix.") || docHost.includes("jkanime."))) {
                        return {};
                      }

                      const isSameSite = (reqHost === docHost) ||
                                         reqHost.endsWith("." + docHost) ||
                                         docHost.endsWith("." + reqHost) ||
                                         (getBaseBrand(reqHost) === getBaseBrand(docHost));

                      if (!isSameSite) {
                        const onProtectedSiteOrPlayer = isHostInList(docHost, PROTECTED_STREAMING_AND_PLAYERS) ||
                                                        docHost.includes("byse") ||
                                                        details.frameId > 0 ||
                                                        docUrl.includes("/e/") ||
                                                        docUrl.includes("/embed");
                        if (onProtectedSiteOrPlayer &&
                            !isHostInList(reqHost, ALLOWED_TECH_CDNS) &&
                            !isHostInList(reqHost, PROTECTED_STREAMING_AND_PLAYERS)) {
                          return { cancel: true };
                        }
                      }
                    }
                  } catch (_) {}
                  return {};
                },
                { urls: ["<all_urls>"] },
                ["blocking"]
              );
            }

            if (typeof browser !== "undefined" && browser.tabs && browser.tabs.onCreated) {
              browser.tabs.onCreated.addListener(function (tab) {
                if (tab && tab.openerTabId !== undefined && tab.id !== undefined) {
                  browser.tabs.remove(tab.id).catch(function () {});
                }
              });
            }
          })();
          '''

          with open(os.path.join(SHIELD_DIR, "background.js"), "w", encoding="utf-8") as bf:
              bf.write(background_js.strip() + "\n")

          content_start_js = r'''(function () {
            "use strict";
            if (window.__battvNativeShieldActive) return;
            window.__battvNativeShieldActive = true;

            const isTopFrame = (window === window.top);
            const currentHost = (window.location.hostname || "").toLowerCase().replace(/^www\./, "");
            const isChaturbate = currentHost === "chaturbate.com" || currentHost.endsWith(".chaturbate.com");
            const isDoramasflixTop = isTopFrame && (currentHost.includes("doramasflix.io") || currentHost.includes("doramasflix.co"));

            // 1. Inyección en el Main World:
            //    IMPORTANTE: En la página principal de Doramasflix (isDoramasflixTop) esperamos a DOMContentLoaded
            //    para NO insertar etiquetas <script> ni <style> antes de que Next.js / React 18 termine de hidratar
            //    las miniaturas y la lista de reproductores.
            const injectMainWorldKiller = function () {
              try {
                const s = document.createElement("script");
                if (isChaturbate) {
                  s.textContent = `(function(){
                    try {
                      const origCanPlay = HTMLMediaElement.prototype.canPlayType;
                      HTMLMediaElement.prototype.canPlayType = function(type) {
                        if (type && /mpegurl/i.test(type)) return "";
                        return origCanPlay.apply(this, arguments);
                      };
                    } catch(_) {}
                  })();`;
                } else {
                  s.textContent = `(function(){
                    try {
                      const dummyWin = {
                        closed: false,
                        focus: function(){},
                        blur: function(){},
                        close: function(){},
                        postMessage: function(){},
                        location: { href: "about:blank", assign: function(){}, replace: function(){} }
                      };
                      window.open = function(url) {
                        if (url && typeof url === "string" && url.startsWith(location.origin) && window === window.top) {
                          location.href = url;
                        }
                        return dummyWin;
                      };

                      const adGlobals = ["atOptions", "_pop", "popns", "exoOpts", "adsbyvidoomy", "pJSDom"];
                      for (let i = 0; i < adGlobals.length; i++) {
                        try {
                          Object.defineProperty(window, adGlobals[i], {
                            get: function() { return undefined; },
                            set: function() {},
                            configurable: false
                          });
                        } catch (_) {}
                      }

                      const origAttachShadow = Element.prototype.attachShadow;
                      if (origAttachShadow) {
                        Element.prototype.attachShadow = function(init) {
                          const root = origAttachShadow.call(this, { mode: "open" });
                          this.setAttribute("data-battv-shadow", "1");
                          return root;
                        };
                      }
                    } catch(_) {}
                  })();`;
                }
                (document.head || document.documentElement).appendChild(s);
                s.remove();
              } catch (_) {}
            };

            if (isDoramasflixTop) {
              window.addEventListener("load", injectMainWorldKiller, { once: true });
            } else if (document.documentElement) {
              injectMainWorldKiller();
            } else {
              document.addEventListener("DOMContentLoaded", injectMainWorldKiller, { once: true });
            }

            // 2. Desacortador automático (incluye embedshortener.co/e/<jwt> para que los reproductores de Doramasflix abran al instante)
            if (!isChaturbate) {
              const SHORTENER_HOSTS = [
                "ouo.io", "ouo.press", "exe.io", "exey.io", "fc.lc", "fc-lc.com",
                "shrtfly.com", "shrinke.me", "shrinkme.io", "linkvertise.com",
                "adfoc.us", "bc.vc", "shorte.st", "gestyy.com", "destyy.com",
                "corneey.com", "clk.sh", "clk.asia", "oko.sh", "za.gl",
                "cuty.io", "cety.app", "gplinks.co", "droplink.co", "tnshort.net",
                "rekonise.com", "sub2unlock.com", "boost.ink", "mboost.me",
                "embedshortener.co", "short-jambo.com", "uii.io", "mitly.us"
              ];

              function tryDecodeBase64Url(str) {
                try {
                  const clean = decodeURIComponent(str).trim().replace(/-/g, "+").replace(/_/g, "/");
                  const decoded = atob(clean).trim();
                  if (/^https?:\/\/[^\s"']+$/i.test(decoded)) return decoded;
                } catch (_) {}
                return null;
              }

              try {
                const loc = window.location;
                if (currentHost.includes("embedshortener.co") && loc.pathname.startsWith("/e/")) {
                  const parts = loc.pathname.slice(3).split(".");
                  if (parts.length > 1) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
                    if (payload && payload.link) {
                      const target = tryDecodeBase64Url(payload.link);
                      if (target) {
                        loc.replace(target);
                        return;
                      }
                    }
                  }
                }

                if (isTopFrame) {
                  const isShortener = SHORTENER_HOSTS.some(function (d) {
                    return currentHost === d || currentHost.endsWith("." + d);
                  });
                  if (isShortener) {
                    const params = new URLSearchParams(loc.search);
                    const keys = ["url", "dest", "destination", "go", "link", "target", "out", "redirect", "r", "u"];
                    for (let i = 0; i < keys.length; i++) {
                      const val = params.get(keys[i]);
                      if (!val) continue;
                      if (/^https?:\/\//i.test(val)) {
                        loc.replace(val);
                        return;
                      }
                      const b64 = tryDecodeBase64Url(val);
                      if (b64) {
                        loc.replace(b64);
                        return;
                      }
                    }
                  }
                }
              } catch (_) {}
            }

            // 3. Limpiador quirúrgico de "CONFIRMA QUE NO ERES UN ROBOT", "777 ¡Felicitaciones! ¡Reclama tu bono!" y "BONUS €1500"
            //    - NUNCA oculta ni borra el iframe del reproductor BYSE.
            //    - NUNCA oculta [data-battv-shadow] por CSS a ciegas (solo si su shadowRoot tiene texto scam).
            //    - NUNCA toca el árbol #__next de Doramasflix.
            const SCAM_TEXT_PATTERNS = [
              "confirma que no eres un robot",
              "haz clic en el botón",
              "reclama tu bono",
              "¡felicitaciones!",
              "ruleta mundial",
              "empieza a ganar",
              "donde juegan los grandes",
              "apuestas royal",
              "transferir dinero",
              "retirar dinero",
              "disponible €",
              "€1500",
              "limpia tu",
              "haz clic en \"más\"",
              "haz clic en 'más'",
              "bono de bienvenida"
            ];

            function containsScamText(str) {
              if (!str) return false;
              const lower = str.toLowerCase();
              for (let i = 0; i < SCAM_TEXT_PATTERNS.length; i++) {
                if (lower.includes(SCAM_TEXT_PATTERNS[i])) return true;
              }
              return false;
            }

            function isProtectedPlayerOrAppContainer(el) {
              if (!el || !el.tagName) return true;
              const tag = el.tagName.toUpperCase();
              if (tag === "VIDEO" || tag === "BODY" || tag === "HTML" || tag === "MAIN" || tag === "HEADER" || tag === "NAV") {
                return true;
              }
              const id = (el.id || "").toLowerCase();
              if (id === "__next" || id === "app" || id === "root" || id === "video_box" ||
                  id === "pframe" || id === "player" || id === "main_video_container" || id === "episodes-content") {
                return true;
              }
              const nextRoot = document.getElementById("__next");
              if (nextRoot && (el === nextRoot || el.contains(nextRoot) || nextRoot.contains(el))) {
                return true;
              }
              const cls = (typeof el.className === "string") ? el.className.toLowerCase() : "";
              if (cls.includes("servers") || cls.includes("player") || cls.includes("jw-") ||
                  cls.includes("vjs-") || cls.includes("plyr")) {
                return true;
              }
              if (el.querySelector && el.querySelector("video, iframe, #video_box, #pframe, .servers, .bg-servers, .player_conte")) {
                return true;
              }
              // Proteger el botón azul "Reproducir" del reproductor BYSE
              const txt = (el.textContent || "").trim().toLowerCase();
              if (txt === "reproducir" || (txt.includes("reproducir") && !containsScamText(txt))) {
                return true;
              }
              return false;
            }

            function nukeInPlayerScamOverlays() {
              if (isChaturbate || isDoramasflixTop) return;
              try {
                // 1. Revisar Shadow DOMs creados por Adsterra Social Bar / In-Page Push
                const shadowHosts = document.querySelectorAll("[data-battv-shadow]");
                for (let i = 0; i < shadowHosts.length; i++) {
                  const host = shadowHosts[i];
                  const sr = host.shadowRoot;
                  if (sr && !sr.querySelector("video") && containsScamText((sr.textContent || "") + " " + (sr.innerHTML || ""))) {
                    host.remove();
                  }
                }

                // 2. Eliminar contenedores de anuncios superpuestos ("CONFIRMA QUE NO ERES UN ROBOT" / "777 ¡Felicitaciones!")
                const candidates = document.querySelectorAll(
                  "div, aside, section, ins, a[target='_blank'], [class*='social-bar' i]"
                );
                for (let j = 0; j < candidates.length; j++) {
                  const el = candidates[j];
                  if (!el || !el.parentElement || isProtectedPlayerOrAppContainer(el)) continue;

                  if (el.tagName === "A" && (el.getAttribute("target") || "").toLowerCase() === "_blank") {
                    if (el.classList.contains("servers") || el.closest(".servers, .bg-servers, .dropdown-menu")) {
                      el.removeAttribute("target");
                      continue;
                    }
                    const href = (el.getAttribute("href") || "").trim();
                    if (!href || href === "#" || href.startsWith("javascript:")) {
                      el.removeAttribute("target");
                      continue;
                    }
                    try {
                      const dstHost = new URL(href, location.href).hostname.toLowerCase().replace(/^www\./, "");
                      if (dstHost !== currentHost && !dstHost.endsWith("." + currentHost)) {
                        if (!isTopFrame || (el.textContent || "").trim().length === 0) {
                          el.remove();
                        } else {
                          el.removeAttribute("href");
                          el.removeAttribute("target");
                        }
                        continue;
                      }
                    } catch (_) {}
                  }

                  const txt = (el.textContent || "").trim();
                  if (txt.length > 6 && txt.length < 380 && containsScamText(txt)) {
                    let toRemove = el;
                    while (
                      toRemove.parentElement &&
                      toRemove.parentElement !== document.body &&
                      toRemove.parentElement !== document.documentElement &&
                      !isProtectedPlayerOrAppContainer(toRemove.parentElement) &&
                      (toRemove.parentElement.textContent || "").trim().length < 480
                    ) {
                      toRemove = toRemove.parentElement;
                    }
                    if (!isProtectedPlayerOrAppContainer(toRemove)) {
                      toRemove.remove();
                    }
                  }
                }
              } catch (_) {}
            }

            // 4. Puente con MainActivity, aceleración por hardware 60 FPS y control remoto
            let port = null;
            let activeInputEl = null;
            let inputCounter = 1;
            let watchedVideosSet = new WeakSet();
            let cachedActiveVideo = null;
            let userPausedManuallyUntil = 0;

            function ensureBridgeConnected() {
              if (port) return port;
              try {
                if (typeof browser !== "undefined" && browser.runtime && browser.runtime.connectNative) {
                  port = browser.runtime.connectNative("battv_bridge");
                  port.onMessage.addListener(handleNativeMessage);
                  port.onDisconnect.addListener(function () {
                    port = null;
                  });
                }
              } catch (_) {}
              return port;
            }

            function postToNative(obj) {
              try {
                const p = ensureBridgeConnected();
                if (p) p.postMessage(obj);
              } catch (_) {}
            }

            function injectTvStyles() {
              try {
                if (!document.head && !document.body) return;
                const styleId = "__battv_fullscreen_css";
                if (document.getElementById(styleId)) return;
                const style = document.createElement("style");
                style.id = styleId;

                // NOTA CRÍTICA: JAMÁS incluir [data-battv-shadow] aquí porque ocultaría los controles
                // de reproductores que usan Shadow DOM legítimo (como BYSE / Plyr / Vidstack).
                const siteSpecificCss = isChaturbate ? `
                  .chat-holder, .chat-box, #chat, .msg-list-wrapper, .room-list, .endless_page_template {
                    contain: layout style paint !important;
                  }
                  html.__battv_lock_scroll .chat-holder,
