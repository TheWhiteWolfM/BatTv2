
name: Compilar Battv.2

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Battv.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar y preparar Gradle
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró el archivo gradlew en el repositorio."
            echo "Es necesario agregar el Gradle Wrapper al proyecto."
            exit 1
          fi

          echo "Gradle Wrapper encontrado en: $WRAPPER"
          chmod +x "$WRAPPER"

      - name: Compilar APK Release
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)
          WRAPPER_DIR=$(dirname "$WRAPPER")

          if [ "$WRAPPER_DIR" = "." ]; then
            ./gradlew -p android-geckoview assembleRelease --no-daemon --stacktrace
          else
            cd "$WRAPPER_DIR"
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Battv.2-APK
          path: android-geckoview/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
