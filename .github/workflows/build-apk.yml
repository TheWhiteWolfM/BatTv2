                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");
                    const docUrl = details.originUrl || details.documentUrl || "";
                    const docHost = docUrl.startsWith("http")
                      ? new URL(docUrl).hostname.toLowerCase().replace(/^www\./, "")
                      : "";

                    // 1. Impedir redireccion a /adblock.html en cualquier dominio de Byse/Filemoon
                    if (/\/adblock\.html(\?|$)/i.test(parsed.pathname)) {
                      return { cancel: true };
