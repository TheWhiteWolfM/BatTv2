              ]
          }

          with open(os.path.join(SHIELD_DIR, "manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2, ensure_ascii=False)

          domains_json_array = json.dumps(sorted(list(compiled_domains)))

          background_js_template = r'''(function () {
            "use strict";

            const COMPILED_AD_DOMAINS = new Set(__DOMAINS_JSON__);
            const AD_URL_REGEX = /(\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{2}\/[0-9a-f]{32}\.js|\/[0-9a-f]{32}\/invoke\.js|\/invoke\.js\?|\/(popunder|tabunder|clickunder|socialbar|inpagepush|adframe|adscript|pop\.js|pop2\.js)([\/._?-]|$)|\/(apu|afu)\.php(\?|$)|[?&](utm_source=pop|ad_type=pop|ali_trackid=|aff_fcid=|aff_fsk=|clickid=)|1xbet|mostbet|bet365|apuestasroyal)/i;

            function isDomainBlocked(hostname) {
              let curr = (hostname || "").toLowerCase().replace(/^www\./, "");
              while (curr && curr.includes(".")) {
                if (COMPILED_AD_DOMAINS.has(curr)) return true;
                const dotIdx = curr.indexOf(".");
                if (dotIdx === -1) break;
                curr = curr.slice(dotIdx + 1);
              }
              return false;
            }

            if (typeof browser !== "undefined" && browser.webRequest && browser.webRequest.onBeforeRequest) {
              browser.webRequest.onBeforeRequest.addListener(
                function (details) {
                  try {
                    const rawUrl = details.url || "";
                    if (!rawUrl.startsWith("http")) return {};

                    // Nunca bloquear imágenes, fuentes o JSONs de la app/doramas
                    if (details.type === "image" || details.type === "imageset" || details.type === "font") {
                      if (/1xbet|mostbet|bet365|apuestasroyal|exoclick|adsterra|juicyads/i.test(rawUrl)) {
                        return { cancel: true };
                      }
                      return {};
                    }

                    const parsed = new URL(rawUrl);
                    const reqHost = parsed.hostname.toLowerCase().replace(/^www\./, "");

                    if (isDomainBlocked(reqHost) || AD_URL_REGEX.test(rawUrl)) {
                      if (details.type === "script") {
                        return { redirectUrl: "data:text/javascript;charset=utf-8," };
                      }
                      return { cancel: true };
                    }
                  } catch (_) {}
                  return {};
                },
                { urls: ["<all_urls>"] },
                ["blocking"]
              );
            }

            if (typeof browser !== "undefined" && browser.tabs && browser.tabs.onCreated) {
              browser.tabs.onCreated.addListener(function (tab) {
                if (tab && tab.openerTabId !== undefined && tab.id !== undefined) {
                  browser.tabs.remove(tab.id).catch(function () {});
                }
              });
            }
          })();
          '''

          background_js = background_js_template.replace("__DOMAINS_JSON__", domains_json_array)
          with open(os.path.join(SHIELD_DIR, "background.js"), "w", encoding="utf-8") as bf:
              bf.write(background_js.strip() + "\n")

          content_start_js = r'''(function () {
            "use strict";
            if (window.__battvNativeShieldActive) return;
            window.__battvNativeShieldActive = true;

            const isTopFrame = (window === window.top);
            const currentHost = (window.location.hostname || "").toLowerCase().replace(/^www\./, "");
            const isChaturbate = currentHost === "chaturbate.com" || currentHost.endsWith(".chaturbate.com");

            const injectMainWorldEngine = function () {
              try {
                const s = document.createElement("script");
                if (isChaturbate) {
                  s.textContent = `(function(){
                    try {
                      const origCanPlay = HTMLMediaElement.prototype.canPlayType;
                      HTMLMediaElement.prototype.canPlayType = function(type) {
                        if (type && /mpegurl/i.test(type)) return "";
                        return origCanPlay.apply(this, arguments);
                      };
                    } catch(_) {}
                  })();`;
                } else {
                  s.textContent = `(function(){
                    try {
                      function createDummyPopupWindow(targetUrl) {
                        const resolvedUrl = (typeof targetUrl === "string" && targetUrl.length > 0) ? targetUrl : "https://localhost/";
                        const fakeLoc = {
                          href: resolvedUrl,
                          assign: function(u) { this.href = u; },
                          replace: function(u) { this.href = u; },
                          reload: function() {},
                          toString: function() { return this.href; }
                        };
                        const winObj = {
                          closed: false,
                          opener: window,
                          location: fakeLoc,
                          document: {
                            write: function() {},
                            writeln: function() {},
                            open: function() { return this; },
                            close: function() {},
                            body: { appendChild: function() {}, style: {} }
                          },
                          focus: function() {},
                          blur: function() {},
                          close: function() { this.closed = true; },
                          postMessage: function() {},
                          addEventListener: function() {},
                          removeEventListener: function() {},
                          setTimeout: function() { return 1; },
                          clearTimeout: function() {}
                        };
                        winObj.window = winObj;
                        winObj.self = winObj;
                        winObj.top = winObj;
                        return winObj;
                      }

                      window.open = function(url) {
                        if (url && typeof url === "string" && url.startsWith(location.origin) && window === window.top) {
                          location.href = url;
                        }
                        return createDummyPopupWindow(url);
                      };

                      const origAnchorClick = HTMLAnchorElement.prototype.click;
                      HTMLAnchorElement.prototype.click = function() {
                        try {
                          const href = (this.getAttribute("href") || "").trim();
                          const target = (this.getAttribute("target") || "").toLowerCase();
                          if (window !== window.top || target === "_blank" || (href.startsWith("http") && !href.includes(location.hostname))) {
                            return;
                          }
                        } catch (_) {}
                        return origAnchorClick.apply(this, arguments);
                      };

                      const origAddEventListener = EventTarget.prototype.addEventListener;
                      const INTERCEPTED_EVENTS = new Set(["click", "mousedown", "mouseup", "pointerdown", "pointerup", "touchstart", "touchend"]);
                      const AD_LISTENER_REGEX = /window\.open|\.open\s*\(|popunder|tabunder|clickunder|_blank|BetterJsPop|jsPopunder|atOptions|_pop|createElement\s*\(\s*['"]a['"]\s*\)/i;

                      EventTarget.prototype.addEventListener = function(type, listener, options) {
                        try {
                          if (INTERCEPTED_EVENTS.has(type) && typeof listener === "function") {
                            const fnStr = Function.prototype.toString.call(listener);
                            if (AD_LISTENER_REGEX.test(fnStr)) {
                              return;
                            }
                            if (window !== window.top && (this === window || this === document || this === document.body || this === document.documentElement)) {
                              const wrappedListener = function(ev) {
                                try {
                                  ev.stopPropagation = function() {};
                                  ev.stopImmediatePropagation = function() {};
                                } catch (_) {}
                                return listener.apply(this, arguments);
                              };
                              return origAddEventListener.call(this, type, wrappedListener, options);
                            }
                          }
                        } catch (_) {}
                        return origAddEventListener.apply(this, arguments);
                      };
                    } catch(_) {}
                  })();`;
                }
                (document.head || document.documentElement).appendChild(s);
                s.remove();
              } catch (_) {}
            };

            if (document.documentElement) {
              injectMainWorldEngine();
            } else {
              document.addEventListener("DOMContentLoaded", injectMainWorldEngine, { once: true });
            }

            const EXACT_SCAM_PHRASES = [
              "confirma que no eres un robot",
              "haz clic en el botón",
              "transferir dinero",
              "retirar dinero",
              "disponible €",
              "€1500",
              "reclama tu bono",
              "ruleta mundial",
              "empieza a ganar",
              "bono de bienvenida"
            ];

            function hasExactScamPhrase(str) {
              if (!str) return false;
              const lower = str.toLowerCase();
              for (let i = 0; i < EXACT_SCAM_PHRASES.length; i++) {
                if (lower.includes(EXACT_SCAM_PHRASES[i])) return true;
              }
              return false;
            }

            function isProtectedPlayerOrLayoutElement(el) {
              if (!el || !el.tagName) return true;
              const tag = el.tagName.toUpperCase();
              if (tag === "VIDEO" || tag === "BODY" || tag === "HTML" || tag === "MAIN" || tag === "HEADER" || tag === "NAV") {
                return true;
              }
              const id = (el.id || "").toLowerCase();
              if (id === "video_box" || id === "pframe" || id === "player" || id === "main_video_container" ||
                  id === "__next" || id === "app" || id === "root" || id === "episodes-content") {
                return true;
              }
              const cls = (typeof el.className === "string") ? el.className.toLowerCase() : "";
              if (cls.includes("servers") || cls.includes("player") || cls.includes("jw-") ||
                  cls.includes("vjs-") || cls.includes("plyr") || cls.includes("navbar") ||
                  cls.includes("header") || cls.includes("container")) {
                return true;
              }
              return false;
            }

            function inspectAndNeutralizeAdNode(el) {
              if (!el || el.nodeType !== 1 || isChaturbate) return;
              try {
                if (isProtectedPlayerOrLayoutElement(el)) return;

                if (el.tagName === "A") {
                  const href = (el.getAttribute("href") || "").trim();
                  const target = (el.getAttribute("target") || "").toLowerCase();
                  if (!isTopFrame && (target === "_blank" || (href && !href.startsWith("#") && !href.startsWith("javascript:")))) {
                    el.style.setProperty("display", "none", "important");
                    el.remove();
                    return;
                  }
                  if (target === "_blank" && href.startsWith("http")) {
                    try {
                      const dstHost = new URL(href, location.href).hostname.toLowerCase().replace(/^www\./, "");
                      if (dstHost !== currentHost && !dstHost.endsWith("." + currentHost)) {
                        el.style.setProperty("display", "none", "important");
                        el.remove();
                        return;
                      }
                    } catch (_) {}
                  }
                }

                if (el.children.length <= 12) {
                  const txt = (el.textContent || "").trim();
                  if (txt.length >= 8 && txt.length <= 320 && hasExactScamPhrase(txt)) {
                    el.style.setProperty("display", "none", "important");
                    el.remove();
                    return;
                  }
                }
              } catch (_) {}
            }

            if (!isChaturbate) {
              try {
                const obs = new MutationObserver(function (mutations) {
                  for (let i = 0; i < mutations.length; i++) {
                    const added = mutations[i].addedNodes;
                    for (let j = 0; j < added.length; j++) {
                      const node = added[j];
                      if (node && node.nodeType === 1) {
                        inspectAndNeutralizeAdNode(node);
                      }
                    }
                  }
                });
                obs.observe(document.documentElement || document, { childList: true, subtree: true });
              } catch (_) {}
            }

            function pierceOverlayAndTriggerPlayAtPoint(clientX, clientY) {
              if (isChaturbate) return;
              try {
                if (typeof document.elementsFromPoint === "function" && clientX > 0 && clientY > 0) {
                  const stack = document.elementsFromPoint(clientX, clientY);
                  let playerIdx = -1;
                  for (let i = 0; i < stack.length; i++) {
                    const item = stack[i];
                    const tag = (item.tagName || "").toUpperCase();
                    if (tag === "VIDEO" || tag === "IFRAME" || item.id === "video_box" || item.id === "pframe" ||
                        (typeof item.className === "string" && /jw-|vjs-|plyr|player/i.test(item.className))) {
                      playerIdx = i;
                      break;
                    }
                  }
                  if (playerIdx > 0) {
                    for (let j = 0; j < playerIdx; j++) {
                      const overlayEl = stack[j];
                      if (!isProtectedPlayerOrLayoutElement(overlayEl)) {
                        overlayEl.style.setProperty("pointer-events", "none", "important");
                        overlayEl.style.setProperty("display", "none", "important");
                        overlayEl.remove();
                      }
                    }
                  }
                }
              } catch (_) {}
            }

            let port = null;
            let activeInputEl = null;
            let inputCounter = 1;
            let promptedVideosSet = new WeakSet();
            let watchedVideosSet = new WeakSet();
            let cachedActiveVideo = null;
            let lastFullscreenPromptMs = 0;
            let userPausedManuallyUntil = 0;

            function ensureBridgeConnected() {
              if (port) return port;
              try {
                if (typeof browser !== "undefined" && browser.runtime && browser.runtime.connectNative) {
                  port = browser.runtime.connectNative("battv_bridge");
                  port.onMessage.addListener(handleNativeMessage);
                  port.onDisconnect.addListener(function () {
                    port = null;
                  });
                }
              } catch (_) {}
              return port;
            }

            function postToNative(obj) {
              try {
                const p = ensureBridgeConnected();
                if (p) p.postMessage(obj);
              } catch (_) {}
            }

            function injectTvStyles() {
              try {
                const styleId = "__battv_fullscreen_css";
                if (document.getElementById(styleId)) return;
                const style = document.createElement("style");
                style.id = styleId;

                const siteSpecificCss = isChaturbate ? `
