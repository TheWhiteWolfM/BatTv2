                  } else if (!wasDomFs && !wasCustomFs && !nowDomFs) {
                    postToNative({ type: "REQUEST_UNIFIED_FULLSCREEN", enable: true });
                  }
                }, 260);
                return;
              }

              const target = e.target ? e.target.closest("input, textarea, [contenteditable='true']") : null;
              if (target && isEditableTextInput(target)) {
                notifyInputFocus(target);
              }
            }, true);

            function setElementValue(el, value, submit) {
              if (!el) return;
              try {
                el.focus();
                if (el.isContentEditable) {
                  el.textContent = value;
                } else {
                  const proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
                  const setter = Object.getOwnPropertyDescriptor(proto, "value");
                  if (setter && setter.set) {
                    setter.set.call(el, value);
                  } else {
                    el.value = value;
                  }
                }
                el.dispatchEvent(new Event("input", { bubbles: true }));
                el.dispatchEvent(new Event("change", { bubbles: true }));

                if (submit) {
                  const enterDown = new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterPress = new KeyboardEvent("keypress", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  const enterUp = new KeyboardEvent("keyup", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true });
                  el.dispatchEvent(enterDown);
                  el.dispatchEvent(enterPress);
                  el.dispatchEvent(enterUp);
                  if (el.form) {
                    if (typeof el.form.requestSubmit === "function") {
                      el.form.requestSubmit();
                    } else {
                      el.form.submit();
                    }
                  }
                }
              } catch (_) {}
            }

            if (isOtherProtectedSite) {
              setInterval(function () {
                try {
                  nukeIsolatedSitesAdsOnce();
                  if (isOnlyJerk) enableIframeFullscreenAndEagerLoad();
                  if (isInAnyFullscreen()) {
                    const v = findActiveVideo();
                    if (v) sendVideoStateOnce(v);
                  }
                } catch (_) {}
              }, 1000);
            } else if (!isChaturbate) {
              setInterval(function () {
                try {
                  if (!isInAnyFullscreen()) return;
                  const videos = document.getElementsByTagName("video");
                  if (videos.length === 0) return;
                  const v = findActiveVideo();
                  if (v) sendVideoStateOnce(v);
                } catch (_) {}
              }, 1200);
            }

            if (isTopFrame) {
              function extractMediaMetadata() {
                try {
                  const h1 = document.querySelector("h1, .Title, .entry-title, .episodiotitle, .anime-title");
                  const ogTitle = document.querySelector("meta[property='og:title']");
                  const raw = (h1 ? h1.textContent : (ogTitle ? ogTitle.content : document.title)) || document.title || "";
                  const clean = raw.replace(/\s+/g, " ").trim();
                  if (clean) {
                    postToNative({
                      type: "PAGE_MEDIA_METADATA",
                      rawHeading: clean,
                      pageTitle: document.title || "",
                      url: window.location.href
                    });
                  }
                } catch (_) {}
              }
              window.addEventListener("load", function () {
                ensureBridgeConnected();
                extractMediaMetadata();
                enableIframeFullscreenAndEagerLoad();
                optimizeImagesAsyncDecoding();
                if (isChaturbate) {
                  optimizeChaturbateBioImages();
                } else if (isOtherProtectedSite) {
                  nukeIsolatedSitesAdsOnce();
                } else if (!isCleanLiveStreamSite) {
                  scheduleSweepDirectBodyAds();
                }
              });
            }

            function handleNativeMessage(msg) {
              if (!msg || !msg.type) return;
              if (msg.type === "WEB_INPUT_UPDATE") {
                const el = findInputById(msg.inputId);
                setElementValue(el, msg.value || "", msg.submit === true);
              } else if (msg.type === "WEB_INPUT_COMMIT_ONLY") {
                const el = findInputById(msg.inputId);
                if (el) el.blur();
              } else if (msg.type === "REQUEST_ACTIVE_WEB_INPUT") {
                const active = document.activeElement;
                if (active && isEditableTextInput(active)) {
                  notifyInputFocus(active);
                } else {
                  const all = getAllEditableInputs();
                  if (all.length > 0) notifyInputFocus(all[0]);
                }
              } else if (msg.type === "WEB_FORM_NAVIGATE") {
                const all = getAllEditableInputs();
                if (all.length === 0) return;
                const current = findInputById(msg.inputId);
                let idx = all.indexOf(current);
                if (idx === -1) idx = 0;
                const nextIdx = (idx + (msg.direction || 1) + all.length) % all.length;
                const nextEl = all[nextIdx];
                if (nextEl) {
                  nextEl.focus();
                  notifyInputFocus(nextEl);
                }
              } else if (msg.type === "VIDEO_COMMAND") {
                if (msg.action === "STOP_ALL_MEDIA") {
                  stopAllMediaInFrame(true);
                  return;
                }
                if (msg.action === "ENTER_FULLSCREEN") {
                  enterFullscreenInCurrentFrame();
                  return;
                }
                if (msg.action === "EXPAND_PLAYER_IFRAME_FALLBACK") {
                  expandMainPlayerIframeFallback();
                  return;
                }
                if (msg.action === "EXIT_FULLSCREEN") {
                  exitFullscreenInCurrentFrame();
                  return;
                }
                const v = findActiveVideo() || (isChaturbate ? findChaturbateVideoAnyState() : null);
                if (!v) return;
                if (msg.action === "SEEK_TO" && typeof msg.time === "number" && Number.isFinite(v.duration)) {
                  const targetSec = Math.max(0, Math.min(v.duration || msg.time, msg.time));
                  v.currentTime = targetSec;
                } else if (msg.action === "TOGGLE_PLAY") {
                  if (v.paused) {
                    v.play().catch(function () {});
                  } else {
                    v.pause();
                  }
                }
              }
            }

            function setupLightweightRootAdObserver() {
              if (isCleanLiveStreamSite) return;
              try {
                const pendingNodes = new Set();
                let flushTimer = null;

                const flushPendingNodes = function () {
                  flushTimer = null;
                  pendingNodes.forEach(function (n) {
                    if (!n || !n.isConnected) return;
                    if (isOtherProtectedSite) {
                      if (isOnlyJerk) cleanOnlyJerkCloseAdWidget();
                      inspectNodeForScamIsolated(n);
                    } else {
                      inspectCandidateAdOverlay(n);
                    }
                  });
                  pendingNodes.clear();
                };

                const obs = new MutationObserver(function (mutations) {
                  for (let i = 0; i < mutations.length; i++) {
                    const added = mutations[i].addedNodes;
                    for (let j = 0; j < added.length; j++) {
                      const n = added[j];
                      if (!n || n.nodeType !== 1) continue;
                      if (isLiveCamRips && n.tagName === "SCRIPT" && !n.src) {
                        const code = n.textContent || "";
                        if (code.includes("window.open") || code.includes("yellowishgather") || code.includes("popunder")) {
                          n.textContent = "";
                          n.remove();
                          continue;
                        }
                      }
                      const t = n.tagName;
                      if (isOtherProtectedSite || t === "DIV" || t === "IFRAME" || (n.hasAttribute && n.hasAttribute("data-battv-shadow"))) {
                        pendingNodes.add(n);
                      }
                    }
                  }
                  if (pendingNodes.size > 0 && !flushTimer) {
                    flushTimer = setTimeout(flushPendingNodes, 220);
                  }
                });

                if (isOtherProtectedSite) {
                  obs.observe(document.documentElement || document, { childList: true, subtree: true });
                } else {
                  const observeTargets = function () {
                    if (document.documentElement) {
                      obs.observe(document.documentElement, { childList: true, subtree: false });
                    }
                    if (document.body) {
                      obs.observe(document.body, { childList: true, subtree: !isTopFrame });
                    }
                  };
                  if (document.body) {
                    observeTargets();
                  } else {
                    if (document.documentElement) {
                      obs.observe(document.documentElement, { childList: true, subtree: false });
                    }
                    document.addEventListener("DOMContentLoaded", observeTargets, { once: true });
                  }
                }
              } catch (_) {}
            }

            setupLightweightRootAdObserver();

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", function () {
                ensureBridgeConnected();
                injectTvStyles();
                enableIframeFullscreenAndEagerLoad();
                optimizeImagesAsyncDecoding();
                if (isChaturbate) {
                  optimizeChaturbateBioImages();
                } else if (isOtherProtectedSite) {
                  nukeIsolatedSitesAdsOnce();
                } else if (!isCleanLiveStreamSite) {
                  scheduleSweepDirectBodyAds();
                }
              });
            } else {
              ensureBridgeConnected();
              injectTvStyles();
              enableIframeFullscreenAndEagerLoad();
              optimizeImagesAsyncDecoding();
              if (isChaturbate) {
                optimizeChaturbateBioImages();
              } else if (isOtherProtectedSite) {
                nukeIsolatedSitesAdsOnce();
              } else if (!isCleanLiveStreamSite) {
                scheduleSweepDirectBodyAds();
              }
            }
          })();
          EOF_CONTENT

          python3 -m json.tool "$SHIELD_DIR/manifest.json" > /dev/null
          node --check "$SHIELD_DIR/noop.js"
          node --check "$SHIELD_DIR/background.js"
          node --check "$SHIELD_DIR/content_start.js"
          ls -la "$SHIELD_DIR"

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version

      - name: Compilar APK Release
        working-directory: android-geckoview
        run: gradle assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Verificar APK generado y mostrar tamano final
        run: |
          ls -lh android-geckoview/app/build/outputs/apk/release/*.apk
          du -h android-geckoview/app/build/outputs/apk/release/*.apk

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BatTV-APK
          path: android-geckoview/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
