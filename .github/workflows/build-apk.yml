            "version": "24.0.0",
            "description": "Soporte completo para Filemoon y reproductores de Doramasflix sin anuncios ni popups + Resto de sitios intactos.",
            "browser_specific_settings": {
              "gecko": {
                "id": "shield_v24@battv.browser",
                "strict_min_version": "115.0"
              }
            },
            "permissions": [
              "<all_urls>",
              "webRequest",
              "webRequestBlocking",
              "storage",
              "tabs",
              "nativeMessaging",
              "nativeMessagingFromContent",
              "geckoViewAddons"
            ],
            "background": {
              "scripts": ["background.js"]
            },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content_start.js"],
                "run_at": "document_start",
                "all_frames": true,
