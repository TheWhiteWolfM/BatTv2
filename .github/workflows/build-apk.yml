name: Compilar Bat TV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android-geckoview/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Bat TV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verificar configuracion de AndroidManifest.xml y archivos Kotlin
        run: |
          set -e
          grep -q 'android:hardwareAccelerated="true"' android-geckoview/app/src/main/AndroidManifest.xml
          echo "android:hardwareAccelerated=true confirmado en AndroidManifest.xml"
          if grep -rn '\\vert' android-geckoview/app/src/main/java/com/battv/browser/; then
            echo "ERROR: Se encontraron secuencias \\vert en los archivos Kotlin"
            exit 1
          fi

      - name: Generar reglas ProGuard/R8 para reducir peso del APK
        run: |
          cat << 'EOF_PROGUARD' > android-geckoview/app/proguard-rules.pro
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.**
          -dontwarn androidx.**
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -keep class org.mozilla.** { *; }
          -keep class com.battv.browser.** { *; }
          EOF_PROGUARD

      - name: Generar Motor Nativo Ultraligero v44 (Google TV 1080p, Directos Fluidos y Clics Limpios)
        run: |
          set -e
          EXT_BASE="android-geckoview/app/src/main/assets/extensions"
          SHIELD_DIR="$EXT_BASE/battv_shield_v44"
          rm -rf "$EXT_BASE"
          mkdir -p "$SHIELD_DIR"

          cat << 'EOF_NOOP_JS' > "$SHIELD_DIR/noop.js"
          (function () {
            "use strict";
            try {
              window.canRunAds = true;
              window.isAdBlockActive = false;
              window.adBlockEnabled = false;
            } catch (_) {}
          })();
          EOF_NOOP_JS

          printf 'ok\n' > "$SHIELD_DIR/noop.txt"
          printf '<VAST version="3.0"></VAST>\n' > "$SHIELD_DIR/vast.xml"

          cat << 'EOF_MANIFEST' > "$SHIELD_DIR/manifest.json"
          {
            "manifest_version": 2,
            "name": "Bat TV Native Shield & Cinema 60FPS Engine",
            "version": "44.0.0",
            "description": "Motor optimizado para Google TV 1080p: directos fluidos, clics limpios en reproductores, pantalla completa estable y bloqueo anti-ads.",
            "browser_specific_settings": {
              "gecko": {
                "id": "shield_v44@battv.browser",
                "strict_min_version": "115.0"
              }
            },
            "permissions": [
              "<all_urls>",
              "webRequest",
              "webRequestBlocking",
              "storage",
              "tabs",
              "nativeMessaging",
              "nativeMessagingFromContent",
              "geckoViewAddons"
            ],
            "web_accessible_resources": [
              "noop.js",
              "noop.txt",
              "vast.xml"
            ],
            "background": {
              "scripts": ["background.js"]
            },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content_start.js"],
                "run_at": "document_start",
                "all_frames": true,
                "match_about_blank": true
